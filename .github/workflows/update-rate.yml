name: Update USDT Rate

on:
  schedule:
    # off-peak minutes: GitHub delays or drops runs scheduled at :00 and :30
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and validate CoinDCX USDTINR rate
        shell: bash
        run: |
          set -euo pipefail

          RATE=$(curl --fail --silent --show-error --location --max-time 30 --retry 3 --retry-delay 5 \
            "https://api.coindcx.com/exchange/ticker" | jq -er '
            [.[] | select(.market == "USDTINR") | .last_price | tonumber?]
            | .[0] // error("USDTINR rate not found")
          ')

          # sane band for USDT/INR; anything outside is a bad tick, keep the previous index.json
          jq -en --argjson r "$RATE" '$r >= 50 and $r <= 300' >/dev/null \
            || { echo "Implausible USDTINR rate: $RATE"; exit 1; }

          jq -n --argjson rate "$RATE" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{usdtInr: $rate, source: "CoinDCX", updatedAt: $at}' > index.json.tmp
          mv index.json.tmp index.json
          cat index.json

      - name: Commit and push updated rate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Update CoinDCX USDTINR rate"
            git push
          fi
          
