name: Update USDT Rate

on:
  schedule:
    # off-peak minutes: GitHub delays or drops runs scheduled at :00 and :30
    - cron: '19,49 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch and validate CoinDCX USDTINR rate
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl --fail --silent --show-error --location \
            --max-time 30 --retry 3 --retry-delay 5 \
            -H "Accept: application/json" \
            -H "User-Agent: Mozilla/5.0 (compatible; RateUpdater/1.0)" \
            "https://coindcx.com")

          RATE=$(echo "$RESPONSE" | jq -er '
            [.[] | select(.market == "USDTINR") | .last_price | tonumber?]
            | .[0] // error("USDTINR rate not found")
          ')

          # sane band for USDT/INR; anything outside is a bad tick, keep the previous usdt-inr.json
          jq -en --argjson r "$RATE" '$r >= 50 and $r <= 300' >/dev/null \
            || { echo "Implausible USDTINR rate: $RATE"; exit 1; }

          # skip file update if the numeric rate has not changed
          OLD_RATE=$(jq -r '.usdtInr // empty' usdt-inr.json 2>/dev/null || true)
          if [ "$RATE" = "$OLD_RATE" ]; then
            echo "Rate unchanged ($RATE). Skipping file update."
            exit 0
          fi

          jq -n --argjson rate "$RATE" --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{usdtInr: $rate, source: "CoinDCX", updatedAt: $at}' > usdt-inr.json.tmp
          mv usdt-inr.json.tmp usdt-inr.json
          cat usdt-inr.json

      - name: Commit and push updated rate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@://github.com"
          git add usdt-inr.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -q -m "Update CoinDCX USDTINR rate"
            git push
          fi
