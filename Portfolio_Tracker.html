   // ===== Android-style coin popup =====================================================================
   // Replaces the old inline "detail row". A single popup element lives in the page for the whole
   // session; opening, refreshing, swiping to another coin and closing only re-render its header/body,
   // so nothing is ever created twice and no listener is ever added twice. The popup's buttons use one
   // delegated listener on its body, so they keep working across re-renders.
   // ===== Back-button integration ======================================================================
   // Each overlay owns one history entry. Back closes only the topmost overlay in the stack.
   const NAV_HISTORY_KEY = '__portfolioTrackerOverlayStack';
   const navHist = { stack: [], handlingPop: false, pendingBack: false, backTimer: null, syncQueued: false };
   
   function currentOverlayStack() {
    const stack = [];
    if (coinPopupOpen) stack.push('popup');
    if (dlgOpen) stack.push('dialog');
    if (sigInfoOpen) stack.push('siginfo');
    return stack;
   }
   
   function navHistoryState(stack) {
    const current = history.state;
    const next = current && typeof current === 'object' && !Array.isArray(current) ? { ...current } : {};
    next[NAV_HISTORY_KEY] = stack.slice();
    return next;
   }
   
   function clearPendingBack() {
    navHist.pendingBack = false;
    if (navHist.backTimer) {
     clearTimeout(navHist.backTimer);
     navHist.backTimer = null;
    }
   }
   
   function flushNavHistory() {
    navHist.syncQueued = false;
    if (navHist.handlingPop || navHist.pendingBack) return;
    
    const desired = currentOverlayStack();
    const current = navHist.stack;
    if (desired.length === current.length && desired.every((layer, index) => layer === current[index])) return;
    
    const isPrefix = desired.length <= current.length && desired.every((layer, index) => layer === current[index]);
    
    try {
     if (desired.length > current.length && current.every((layer, index) => desired[index] === layer)) {
      for (let length = current.length + 1; length <= desired.length; length++) {
       const nextStack = desired.slice(0, length);
       history.pushState(navHistoryState(nextStack), '');
       navHist.stack = nextStack;
      }
     } else if (isPrefix && desired.length < current.length) {
      const delta = desired.length - current.length; // batches multi-layer closes (e.g. removeCoin -> -2)
      navHist.pendingBack = true;
      if (navHist.backTimer) clearTimeout(navHist.backTimer);
      navHist.backTimer = setTimeout(() => {
       if (!navHist.pendingBack) return;
       clearPendingBack();
       navHist.stack = currentOverlayStack();
       try { history.replaceState(navHistoryState(navHist.stack), ''); } catch (e) {}
      }, 450);
      history.go(delta);
     } else {
      history.replaceState(navHistoryState(desired), '');
      navHist.stack = desired;
     }
    } catch (e) {
     clearPendingBack();
     navHist.stack = desired;
    }
   }
   
   function syncNavHistory({ immediate = false } = {}) {
    if (navHist.handlingPop) return;
    if (immediate) {
     flushNavHistory();
     return;
    }
    if (!navHist.syncQueued) {
     navHist.syncQueued = true;
     queueMicrotask(flushNavHistory);
    }
   }
   
   window.addEventListener('popstate', (event) => {
    const stateStack = Array.isArray(event.state?.[NAV_HISTORY_KEY]) ?
     event.state[NAV_HISTORY_KEY].filter(layer => layer === 'popup' || layer === 'dialog' || layer === 'siginfo') : [];
    const currentlyOpen = currentOverlayStack();
    const targetIsPrefix = stateStack.length <= currentlyOpen.length &&
     stateStack.every((layer, index) => layer === currentlyOpen[index]);
    
    clearPendingBack();
    
    if (!targetIsPrefix) {
     // Landed on an overlay entry whose overlay(s) already closed — keep backing out cleanly.
     navHist.stack = stateStack;
     syncNavHistory({ immediate: true });
     return;
    }
    
    navHist.stack = stateStack;
    navHist.handlingPop = true;
    try {
     if (sigInfoOpen && !stateStack.includes('siginfo')) closeSignalInfoPopup();
     if (dlgOpen && !stateStack.includes('dialog')) closeDialog(null);
     if (coinPopupOpen && !stateStack.includes('popup')) closeCoinPopup();
    } finally {
     navHist.handlingPop = false;
    }
    
    const actualStack = currentOverlayStack();
    if (actualStack.length !== stateStack.length || actualStack.some((layer, index) => layer !== stateStack[index])) {
     syncNavHistory({ immediate: true });
    }
   });
   try {
    const currentState = history.state;
    if ((currentState && typeof currentState === 'object' && Object.prototype.hasOwnProperty.call(currentState, NAV_HISTORY_KEY))) {
     const cleanedState = { ...currentState };
     delete cleanedState[NAV_HISTORY_KEY];
     history.replaceState(cleanedState, '');
    }
   } catch (e) {}

     Math.max(0, document.body.offsetWidth - document.body.clientWidth);
    popupPrevPadRight = document.body.style.paddingRight;
    if (sbw > 0) document.body.style.paddingRight = (parseFloat(getComputedStyle(document.body).paddingRight) + sbw) + 'px';
    document.documentElement.classList.add('cp-locked');
    document.body.classList.add('cp-locked');
    popupScrollLocked = true;
   }
   
   function unlockPageScroll() {
    if (!popupScrollLocked) return;
    document.documentElement.classList.remove('cp-locked');

   async function runDiscoverBatch() {
    if (discoverInFlight || !discoverQueue.length) return;
    discoverInFlight = true;
    discoverBtn.disabled = true;
    (discoverBtn.querySelector('.btn-lbl') || discoverBtn).textContent = 'Scanning…';
    const existingMore = document.getElementById('discoverMoreBtn');
    if (existingMore) existingMore.disabled = true;
    
    try {
     const batch = discoverQueue.splice(0, DISCOVER_MAX_TA_FETCHES);
     const totalQueue = discoverCheckedCount + batch.length + discoverQueue.length;
     const macroTa = taCache[MACRO_COIN_ID] || null;
     const usdInr = await ensureUsdInrRate();
     
     for (let i = 0; i < batch.length; i++) {
      const coin = batch[i];
      if (portfolioMap[coin.id]) continue;
      discoverResults.innerHTML = `<div class="discover-empty">Checking price history — ${discoverCheckedCount + i + 1}/${totalQueue}${discoverPassing.length ? ` (${discoverPassing.length} found)` : ''}…</div>`;
      let closes = await fetchTaHistory(coin.id);
      if (!closes && (fetchTaHistory.lastErr === 'HTTP_ERROR:429' || fetchTaHistory.lastErr === 'HTTP_ERROR:418')) {
       discoverResults.innerHTML = `<div class="discover-empty">Rate limited by Binance — pausing 15s before retrying ${(coin.symbol || coin.id).toUpperCase()}…</div>`;
       await new Promise(r => setTimeout(r, 15000));
       closes = await fetchTaHistory(coin.id);
      }
      if (!closes) {
       discoverFailedCount++;
       discoverLastErr = fetchTaHistory.lastErr || discoverLastErr;
      } else if (closes.lastTs != null && (Date.now() - closes.lastTs) <= TA_MAX_DATA_AGE_MS) {
       const ta = computeTaFromCloses(closes);
       if (ta && auditTa(ta) && ta.rollingLow != null) {
        ta.closesEndTs = closes.lastTs;
        applyRangeExtremes(ta, closes);
        const md = coin.md;
        const item = { id: coin.id, symbol: (coin.symbol || '').toUpperCase(), name: coin.name, target: null };
        // ACCUMULATE only exists on top of a WAIT signal, and WAIT needs the coin's ATH. So the ATH is fetched BEFORE
        // classifying, but only for coins whose last closed RSI is already oversold (a hard requirement of the add rule),
        // which keeps the extra Binance calls to the few coins that can actually qualify.
        if (ta.rsi != null && ta.rsi <= (ta.rsiOversoldThreshold ?? RSI_OVERSOLD)) {
         try {
          const athCache = getAthCache();
          let athEntry = athCache[coin.id];
          if (!athEntry || !athEntry.fetchedAt || (Date.now() - athEntry.fetchedAt) > ATH_TTL_MS) {
           athEntry = await fetchBinanceAthAtl(coin.id);
           if (athEntry) { athCache[coin.id] = athEntry; saveAthCache(); }
          }
          Object.assign(md, resolveAthAtlForId(coin.id, coin.symbol, coin.binUsdt, md.current_price, usdInr, md));
         } catch (e) {}
        }
        const sig = classifyHolding(md, item, ta, macroTa);
        
        if (sig.signal === 'ACCUMULATE') {
         discoverPassing.push({
          id: coin.id,
          symbol: item.symbol,
          name: coin.name,
          rank: coin.rank,
          sig,
          ta
         });
        }
       }
      }
     }
     discoverCheckedCount += batch.length;
     renderDiscoverResults();
    } catch (err) {
     renderDiscoverResults();
     discoverResults.insertAdjacentHTML('afterbegin', '<div class="discover-empty">Scan interrupted — network error or API rate limit. Try again shortly.</div>');
    } finally {
     discoverInFlight = false;
     discoverBtn.disabled = false;
     (discoverBtn.querySelector('.btn-lbl') || discoverBtn).textContent = 'Scan for ADD';
    }
   }
   
   async function discoverCandidates() {
    if (discoverInFlight) return;
    discoverInFlight = true;
    discoverBtn.disabled = true;
    (discoverBtn.querySelector('.btn-lbl') || discoverBtn).textContent = 'Scanning…';
    discoverResults.innerHTML = `<div class="discover-empty">Fetching top ${DISCOVER_TOP_N} by Binance 24h volume…</div>`;
    
    let ready = false;
    try {
     if (!coinListLoaded) await loadCoinList(true);
     const [usdInr, tickRes] = await Promise.all([
      ensureUsdInrRate(),
      binanceFetch('/api/v3/ticker/24hr', { timeoutMs: 15000 })
     ]);
     if (!(usdInr > 0)) throw new Error('FX_UNAVAILABLE');
     const tickers = await tickRes.res.json();
     if (!Array.isArray(tickers)) throw new Error('TICKERS_INVALID');
     
     const activeSet = new Set(coinList.map(c => c.id));
     const matched = [];
     for (const t of tickers) {
      if (!t?.symbol) continue;
      if (activeSet.size ? !activeSet.has(t.symbol) : !t.symbol.endsWith('USDT')) continue;
      const binUsdt = Number(t.lastPrice);
      if (!(binUsdt > 0)) continue;
      const base = t.symbol.replace(/USDT$/, '');
      if (isStablecoinPair(base, t)) continue;
      const md = normalizeBinanceTicker(t, usdInr, null);
      if (!(md.total_volume > 0)) continue;
      matched.push({ id: t.symbol, symbol: base, name: base, binUsdt, md });
     }
     matched.sort((a, b) => b.md.total_volume - a.md.total_volume);
     matched.forEach((c, i) => { c.rank = i + 1; });
     const top100 = matched.slice(0, DISCOVER_TOP_N);
     const effRateD = usdInr * getFxMultiplier();
     
     const ownedIds = new Set(saved.map(s => s.id));
     const pctAbove24hLow = c => (c.low_24h > 0 && c.current_price > 0) ? (c.current_price - c.low_24h) / c.low_24h * 100 : null;
     discoverQueue = top100.filter(coin => {
      if (ownedIds.has(coin.id)) return false;
      const md = coin.md;
      // ATH comes only from Binance's weekly history, which isn't fetched for coins we don't hold yet: unknown passes here
      // and the real ATH gate runs in stage 2 (classifyHolding after the per-coin ATH fetch).
      if (md.ath_change_percentage != null && md.ath_change_percentage > DCA_MODERATE_PCT * VOL_SCALE_MIN) return false;
      const above24hLow = pctAbove24hLow(md);
      if (above24hLow != null && above24hLow > DCA_NEAR_LOW_CEIL_PCT) return false;
      const volume = md.total_volume;
      if (volume == null || volume < ABSOLUTE_DEAD_VOLUME || volume < THIN_VOLUME_USDT * effRateD) return false;
      return true;
     }).sort((a, b) => ((pctAbove24hLow(a.md) ?? Infinity) - (pctAbove24hLow(b.md) ?? Infinity)) || ((a.md.change_24h ?? 0) - (b.md.change_24h ?? 0)));
     
     discoverPassing = [];
     discoverCheckedCount = 0;
     discoverFailedCount = 0;
     discoverLastErr = '';
     
     if (!discoverQueue.length) {
      discoverResults.innerHTML = '<div class="discover-empty">No coins outside your list clear the discount/near-low/liquidity prefilter right now.</div>';
      return;
     }
     ready = true;
    } catch (err) {
     discoverResults.innerHTML = '<div class="discover-empty">Scan failed — network error or API rate limit. Try again shortly.</div>';
    } finally {
     discoverInFlight = false;
     if (!ready) {
      discoverBtn.disabled = false;
      (discoverBtn.querySelector('.btn-lbl') || discoverBtn).textContent = 'Scan for ADD';
     }
    }
    if (ready) await runDiscoverBatch();
   }

   async function applyImportedData(rawJson) {
    const parsed = typeof rawJson === 'string' ? JSON.parse(rawJson) : rawJson;
    const rawList = Array.isArray(parsed) ? parsed : (parsed?.portfolio || []);
    const rawDca = (!Array.isArray(parsed) && parsed?.dcaLog) || {};
    if (!Array.isArray(rawList) || !rawList.length) throw new Error('NO_COINS_FOUND');
    const imported = [];
    const idMap = {};
    const seen = new Set();
    for (const item of rawList) {
     const sym = (item.symbol || '').trim().toUpperCase();
     const newId = sym ? (sym.endsWith('USDT') ? sym : `${sym}USDT`) : item.id;
     if (item.id) idMap[item.id] = newId;
     if (!newId || seen.has(newId)) continue;
     seen.add(newId);
     const tgt = (item.target != null && item.target !== '' && !isNaN(Number(item.target))) ? Number(item.target) : null;
     imported.push({ id: newId, symbol: sym || item.symbol, name: item.name || newId, target: tgt });
    }
    const importedDca = { ...dcaLogCache };
    for (const [oldId, entry] of Object.entries(rawDca)) {
     const mappedId = idMap[oldId] || (oldId.endsWith('USDT') ? oldId : null);
     if (mappedId && entry) importedDca[mappedId] = entry;
    }
    saved = imported;
    dcaLogCache = importedDca;
    save();
    saveDcaLog();
    buildPortfolioMap();
    if (!Array.isArray(parsed) && Number.isFinite(Number(parsed?.fxMultiplier)) && Number(parsed.fxMultiplier) > 0) {
     const oldMult = getFxMultiplier();
     const newMult = Number(parsed.fxMultiplier);
     if (Math.abs(newMult - oldMult) >= 1e-6) {
      getFxCache().multiplier = newMult;
      saveFxCache();
      updateFxBadge();
      rescaleCachesByMultiplierRatio(newMult / oldMult);
     }
    }
    applyCurrentSort();
    const ids = saved.map(s => s.id).filter(Boolean);
    if (ids.length) {
     await fetchPrices(ids);
     recomputeHoldingSignals();
     applyCurrentSort();
     fetchTaForPortfolio([...new Set([...ids, MACRO_COIN_ID])]);
    }
    setActivityStatus(`Imported ${saved.length} coin(s) & DCA logs.`, 'ok');
   }

     '<div class="sig-guide-list">' + present.map(k => {
      const m = SIGNAL_INFO_META[k];
      const pillHtml = m.na ?
       `<span class="sig-pill na">${escHtml(m.label)}</span>` :
       `<span class="sig-pill${m.act ? ' act' : ''}" style="--vc:${m.vc}">${escHtml(m.label)}</span>`;
      const cnt = counts[k];
      return `<div class="sig-guide-row"><div class="sig-guide-badge">${pillHtml}<span class="sig-guide-cnt">${cnt} coin${cnt === 1 ? '' : 's'}</span></div><div class="sig-guide-desc">${escHtml(m.desc)}</div></div>`;
     }).join('') + '</div>' :
     '<p class="sig-guide-empty">No coins in your list yet — add a coin to see what each active signal is telling you.</p>';
    sigInfoLastFocus = document.activeElement;
    sigInfoOpen = true;
    sigInfoBackdropDown = false;
    positionSignalInfoPopup();
    syncNavHistory();
    sigInfoOverlay.setAttribute('aria-hidden', 'false');
    void sigInfoOverlay.offsetWidth;
    sigInfoOverlay.classList.add('open');
    sigInfoCard.focus({ preventScroll: true });
   }
   sigInfoOverlay.addEventListener('pointerdown', (e) => { sigInfoBackdropDown = (e.target === sigInfoOverlay); });
   sigInfoOverlay.addEventListener('click', (e) => {
    const closeIt = sigInfoBackdropDown && e.target === sigInfoOverlay;
    sigInfoBackdropDown = false;
    if (closeIt) closeSignalInfoPopup();
   });
   window.addEventListener('resize', () => { if (sigInfoOpen) positionSignalInfoPopup(); });
   const signalInfoBtn = document.getElementById('signalInfoBtn');
   if (signalInfoBtn) {
    signalInfoBtn.addEventListener('click', (e) => {
     e.stopPropagation();
     openSignalInfoPopup();
    });
   }
   signalHeader.addEventListener('click', (e) => {
    if (e.target.closest('#signalInfoBtn')) return;
    sortDir = currentSortColumn === 'signal' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
    currentSortColumn = 'signal';
    closeCoinPopup();
    applyCurrentSort();
   });
   
   let suggestTimer;
   
   function chooseSuggestion(el) {
    if (!el) return false;
    symbolInput.value = el.dataset.symbol;
    symbolInput.dataset.selectedId = el.dataset.id;
    symbolInput.dataset.selectedName = el.dataset.name;
    suggestBox.style.display = 'none';
    addBtn.disabled = false;
    return true;
   }
   
   symbolInput.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    const query = symbolInput.value.trim();
    delete symbolInput.dataset.selectedId;
    delete symbolInput.dataset.selectedName;
    addBtn.disabled = true;
    if (!query) {
     suggestBox.style.display = 'none';
     addBtn.disabled = true;
     return;
    }
    if (!coinListLoaded) {
     suggestBox.innerHTML = '<div class="suggestion-no-result">Coin list unavailable or still loading…</div>';
     suggestBox.style.display = 'block';
     addBtn.disabled = true;
     return;
    }
    suggestTimer = setTimeout(() => {
     const q = query.toLowerCase();
     const results = [];
     if (symbolIndex[q]) results.push(...symbolIndex[q]);
     if (results.length < 25) {
      coinList.some(c => {
       const symbol = c.symbol?.toLowerCase() || '';
       const name = c.name?.toLowerCase() || '';
       if ((symbol.includes(q) || name.includes(q)) && !results.some(r => r.id === c.id)) {
        results.push({ id: c.id, symbol: c.symbol?.toUpperCase(), name: c.name });
        return results.length >= 25;
       }
       return false;
      });
     }
     suggestBox.innerHTML = results.length ?
      results.map(coin => `<div class="suggestion-item" data-id="${coin.id}" data-symbol="${coin.symbol}" data-name="${(coin.name || '').replace(/"/g, '&quot;')}">${coin.symbol} — ${coin.name}</div>`).join('') :
      '<div class="suggestion-no-result">No results found</div>';
     const first = suggestBox.querySelector('.suggestion-item');
     if (first) {
      symbolInput.dataset.selectedId = first.dataset.id;
      symbolInput.dataset.selectedName = first.dataset.name;
      addBtn.disabled = false;
     } else {
      addBtn.disabled = true;
     }
     suggestBox.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => chooseSuggestion(el));
     });
     suggestBox.style.display = 'block';
    }, 250);
   });
   
   document.addEventListener('click', (e) => {
    if (!symbolInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.style.display = 'none';
   });
   
   buildPortfolioMap();
   saved.sort(compareBySortColumn);
   renderTable();
   updateFxBadge();
   const fxRateBadgeEl = document.getElementById('fxRateBadge');
   if (fxRateBadgeEl) fxRateBadgeEl.addEventListener('click', openFxCalibrationDialog);
   autoCalibrateUsdtRate();
   
   const startIds = saved.map(s => s.id).filter(Boolean);
   const startTaIds = [...new Set([...startIds, MACRO_COIN_ID])];
   
   statusCenter.setConnection('refreshing');
   const isApiReachable = startIds.length ? await fetchPrices(startIds) : await checkApiStatus();
   
   if (isApiReachable) {
    refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
    initialPriceFetchComplete = true;
    recomputeHoldingSignals();
    signalsHydrated = true;
    applyCurrentSort();
    updateScheduledStatus();
    startRealtimeSync();
    fetchTaForPortfolio(startTaIds);
   } else {
    initialPriceFetchComplete = true;
    signalsHydrated = true;
    renderTable();
    scheduleApiRecheck();
   }
   
   loadCoinList(isApiReachable);
   
  })();
 </script>
</body>

</html>
