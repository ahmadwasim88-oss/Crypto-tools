  delete holdingSignalCache[id];
  delete taCache[id];
  delete dcaLogCache[id];
  savePrices();
  saveMarketData();
  saveHoldingSignals();
  saveTaData();
  saveDcaLog();
  if (expandedRowId === id) closeCoinPopup();
  renderTable();
}

// DCA log. `dcaLogCache[id]` keeps its original shape ({price, dateStr, timestamp}) because the
// signal engine reads `.price` as the "last DCA" anchor; a `history` array rides along so a missed
// or back-dated entry can be added without clobbering a newer one. The anchor is always the
// newest-DATED entry (ties: most recently logged).
function dcaHistoryOf(id) {
  const e = dcaLogCache[id];
  if (!e) return [];
  if (Array.isArray(e.history) && e.history.length) return e.history.slice();
  return (e.price > 0) ? [{ price: e.price, dateStr: e.dateStr, timestamp: e.timestamp }] : [];
}

function setDcaHistory(id, history) {
  const sorted = history
    .filter(h => h && h.price > 0)
    .sort((a, b) => (b.dateStr || '').localeCompare(a.dateStr || '') || ((b.timestamp || 0) - (a.timestamp || 0)))
    .slice(0, DCA_HISTORY_MAX);
  if (!sorted.length) { delete dcaLogCache[id]; return; }
  const top = sorted[0];
  dcaLogCache[id] = { price: top.price, dateStr: top.dateStr, timestamp: top.timestamp, history: sorted };
}

async function logDcaLevel(id, symbol) {
  const cur = pricesCache[id] ?? marketDataCache[id]?.current_price ?? null;
  const entry = await dcaEntryDialog(symbol, cur);
  if (!entry) return;
  setDcaHistory(id, dcaHistoryOf(id).concat({ price: entry.price, dateStr: entry.dateStr, timestamp: Date.now() }));
  saveDcaLog();
  recomputeHoldingSignals();
  renderTable();
}

async function removeDcaEntry(id, symbol, ts) {
  const entry = dcaHistoryOf(id).find(h => h.timestamp === ts);
  if (!entry) return;
  const ok = await confirmDialog({
    title: `Delete this ${symbol} entry?`,
    message: `${formatINR(entry.price, pricePrecisionFor(entry.price))} on ${entry.dateStr} will be removed from the log.`,
    okLabel: 'Delete', danger: true
  });
  if (!ok) return;
  setDcaHistory(id, dcaHistoryOf(id).filter(h => h.timestamp !== ts));   // re-read: the log may have changed meanwhile
  saveDcaLog();
  recomputeHoldingSignals();
  renderTable();
}

async function clearDcaLevel(id, symbol) {
  const ok = await confirmDialog({
    title: `Clear ${symbol} DCA log?`,
    message: 'This removes the anchor used to judge whether a future add is meaningfully cheaper.',
    okLabel: 'Clear log', danger: true
  });
  if (!ok) return;
  delete dcaLogCache[id];
  saveDcaLog();
  recomputeHoldingSignals();
  renderTable();
}

let tvScriptPromise = null;
function loadTradingViewScript() {
  if (window.TradingView) return Promise.resolve();
  if (tvScriptPromise) return tvScriptPromise;
  tvScriptPromise = new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = 'https://s3.tradingview.com/tv.js';
    script.onload = () => resolve();
    script.onerror = () => { tvScriptPromise = null; reject(new Error('TV_SCRIPT_LOAD_FAILED')); };
    document.head.appendChild(script);
  });
  return tvScriptPromise;
}

function toggleChart(id, symbol, btn) {
  const container = document.getElementById(`chart-container-${id}`);
  if (!container) return;
  const isOpen = container.style.display === 'block';
  if (isOpen) {
    container.style.display = 'none';
    btn.textContent = '📈 View chart';
    return;
  }
  container.style.display = 'block';
  btn.textContent = 'Hide chart';
  if (container.dataset.loaded === 'true') return;

  container.innerHTML = '<div class="chart-loading">Loading TradingView chart…</div>';
  loadTradingViewScript().then(() => {
    const widgetId = `tv_widget_${id}`;
    container.innerHTML = `<div id="${widgetId}"></div>`;
    new TradingView.widget({
      width: '100%',
      height: window.innerWidth < 680 ? 280 : 380,
      symbol: `BINANCE:${symbol}USDT*FX_IDC:USDINR`,
      interval: 'D',
      timezone: 'Asia/Kolkata',
      theme: 'dark',
      style: '1',
      locale: 'en',
      toolbar_bg: '#121820',
      backgroundColor: '#121820',
      gridColor: 'rgba(255,255,255,0.06)',
      enable_publishing: false,
      hide_side_toolbar: window.innerWidth < 680,
      save_image: false,
      container_id: widgetId
    });
    container.dataset.loaded = 'true';
  }).catch(() => {
    container.innerHTML = '<div class="chart-loading">Chart failed to load — check your connection.</div>';
  });
}

function priceCellHTML(id, cur) {
  if (!cur) return '<span class="gain-na">—</span>';
  const chg = getDisplayChange(id);
  const chgHtml = chg == null ? '' : chg.rolling
    ? `<span class="price-change-24h chg-roll" title="Rolling 24h (today's candle not available yet)">${formatPct(chg.pct)} <em>24h</em></span>`
    : `<span class="price-change-24h ${chg.pct >= 0 ? 'gain-pos' : 'gain-neg'}" title="Today's UTC candle">${formatPct(chg.pct)}</span>`;
  return `<span class="px-main">${formatINR(cur, pricePrecisionFor(cur), true)}</span>${chgHtml}`;
}

function targetCellHTML(item) {
  return item.target == null
    ? `<span class="target-display target-unset" data-id="${item.id}">Set target</span>`
    : `<span class="target-display" data-id="${item.id}">${item.target}</span>`;
}

function beginTargetEdit(span) {
  const id = span.dataset.id;
  const item = saved.find(s => s.id === id);
  if (!item) return;
  const input = document.createElement('input');
  input.type = 'text';
  input.inputMode = 'decimal';
  input.className = 'target-input';
  input.dataset.id = id;
  input.placeholder = 'Target ₹';
  input.value = item.target ?? '';
  span.replaceWith(input);
  input.focus();
  input.select();

  const finalize = () => {
    const value = input.value.trim();
    const newTarget = value === '' ? null : Number(value);
    if (newTarget !== null && (isNaN(newTarget) || newTarget < 0)) {
      setActivityStatus('Target must be a positive number.', 'error');
    } else if (newTarget !== item.target) {
      item.target = newTarget;
      save();
      buildPortfolioMap();
      holdingSignalCache[id] = classifyHolding(marketDataCache[id] || null, item, taCache[id] || null, taCache['bitcoin'] || null);
      saveHoldingSignals();
      setActivityStatus(`Target updated for ${item.symbol}.`, 'info');
      updatePricesInTable();
      if (currentSortColumn === 'gain' || currentSortColumn === 'signal') applyCurrentSort();
    }
    const freshSpan = document.createElement('span');
    freshSpan.className = item.target == null ? 'target-display target-unset' : 'target-display';
    freshSpan.dataset.id = id;
    freshSpan.textContent = item.target == null ? 'Set target' : item.target;
    input.replaceWith(freshSpan);
  };

  input.addEventListener('blur', finalize);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { input.value = item.target ?? ''; input.blur(); }
  });
  input.addEventListener('click', (e) => e.stopPropagation());
}

document.addEventListener('click', (e) => {
  if (!e.target.classList.contains('target-display')) return;
  e.stopPropagation();
  beginTargetEdit(e.target);
});

// ===== Android-style coin popup =====================================================================
// Replaces the old inline "detail row". A single popup element lives in the page for the whole
// session; opening, refreshing, swiping to another coin and closing only re-render its header/body,
// so nothing is ever created twice and no listener is ever added twice. The popup's buttons use one
// delegated listener on its body, so they keep working across re-renders.
function lockPageScroll() {
  if (popupScrollLocked) return;
  // On desktop, hiding the scrollbar would widen the page and nudge the layout; pad by its width.
  const sbw = Math.max(0, window.innerWidth - document.documentElement.clientWidth)
            + Math.max(0, document.body.offsetWidth - document.body.clientWidth);
  popupPrevPadRight = document.body.style.paddingRight;
  if (sbw > 0) document.body.style.paddingRight = (parseFloat(getComputedStyle(document.body).paddingRight) + sbw) + 'px';
  document.documentElement.classList.add('cp-locked');
  document.body.classList.add('cp-locked');
  popupScrollLocked = true;
}

function unlockPageScroll() {
  if (!popupScrollLocked) return;
  document.documentElement.classList.remove('cp-locked');
  document.body.classList.remove('cp-locked');
  document.body.style.paddingRight = popupPrevPadRight;
  popupScrollLocked = false;
}

function openCoinPopupShell() {
  if (coinPopupOpen) return;
  clearTimeout(popupCloseTimer);
  popupLastFocus = document.activeElement;
  coinPopupOpen = true;
  popupBackdropDown = false;
  lockPageScroll();
  appRoot.inert = true;                       // keeps focus and taps out of the page behind the popup
  popupOverlay.setAttribute('aria-hidden', 'false');
  void popupOverlay.offsetWidth;              // let the slide-in start from the closed state
  popupOverlay.classList.add('open');
  popupSheet.focus({ preventScroll: true });
}

function closeCoinPopup() {
  expandedRowId = null;
  tableBody.querySelectorAll('tr.main-row.open').forEach(r => r.classList.remove('open'));
  if (!coinPopupOpen) return;
  coinPopupOpen = false;
  popupShownId = null;
  popupLastHtml = '';
  swipeState = null;
  dragState = null;
  popupSheet.style.transition = '';
  popupSheet.style.transform = '';
  popupOverlay.classList.remove('open');
  popupOverlay.setAttribute('aria-hidden', 'true');
  appRoot.inert = false;
  unlockPageScroll();
  const back = popupLastFocus;
  popupLastFocus = null;
  if (back && back.isConnected && typeof back.focus === 'function' && back !== document.body) back.focus({ preventScroll: true });
  clearTimeout(popupCloseTimer);
  // Wait for the slide-out, then drop the content (this also tears down any TradingView iframe).
  popupCloseTimer = setTimeout(() => { if (!coinPopupOpen) popupBody.innerHTML = ''; }, 320);
}

function presentCoinPopup(item, html, vc) {
  const sameCoin = coinPopupOpen && popupShownId === item.id;
  openCoinPopupShell();
  expandedRowId = item.id;

  const rows = Array.from(tableBody.querySelectorAll('tr.main-row'));
  const idx = rows.findIndex(r => r.dataset.id === item.id);
  cpSym.textContent = item.symbol || item.id;
  cpName.textContent = (item.name && item.name !== item.symbol) ? item.name : '';
  cpCount.textContent = (rows.length > 1 && idx >= 0) ? `${idx + 1}/${rows.length}` : '';
  cpPrev.disabled = cpNext.disabled = rows.length < 2;
  cpPx.innerHTML = priceCellHTML(item.id, pricesCache[item.id] ?? null);
  const tNum = (item.target != null && item.target !== '' && !isNaN(Number(item.target))) ? Number(item.target) : null;
  if (tNum == null) {
    cpTarget.innerHTML = 'Target not set';
  } else {
    const toTgt = pctToTarget(pricesCache[item.id] ?? null, tNum);   // same figure as the table's "To target" column
    cpTarget.innerHTML = `Target <b>${formatINR(tNum, Number.isInteger(tNum) ? 0 : pricePrecisionFor(tNum))}</b> <span class="${toTgt == null ? '' : toTgt >= 0 ? 'up' : 'dn'}">${formatPctShort(toTgt)}</span>`;
  }
  popupSheet.style.setProperty('--vc', vc);

  // Same coin + identical markup (e.g. a price tick that changed nothing shown): leave the DOM alone,
  // which keeps scroll position, any open chart and a mid-tap button intact.
  if (!sameCoin || html !== popupLastHtml) {
    const keep = sameCoin ? popupBody.scrollTop : 0;
    popupBody.innerHTML = html;
    popupBody.scrollTop = keep;
    popupLastHtml = html;
    if (!sameCoin) popupBody.querySelector('.detail-box')?.classList.add('cp-fresh');
  }
  popupShownId = item.id;
}

// close: ✕ button, tap on the dimmed backdrop (only if the press also STARTED on it), Escape key
cpClose.addEventListener('click', () => closeCoinPopup());
popupOverlay.addEventListener('pointerdown', (e) => { popupBackdropDown = (e.target === popupOverlay); });
popupOverlay.addEventListener('click', (e) => {
  const closeIt = popupBackdropDown && e.target === popupOverlay;
  popupBackdropDown = false;
  if (closeIt) closeCoinPopup();
});

document.addEventListener('keydown', (e) => {
  if (dlgOpen) { dialogKeydown(e); return; }   // an open dialog owns the keyboard: Esc closes only the dialog
  if (!coinPopupOpen) return;
  if (e.key === 'Escape') { e.preventDefault(); closeCoinPopup(); return; }
  if (e.key !== 'Tab') return;
  const f = Array.from(popupSheet.querySelectorAll('button:not(:disabled), a[href], input, [tabindex]:not([tabindex="-1"])'))
    .filter(el => el.offsetParent !== null);
  if (!f.length) { e.preventDefault(); popupSheet.focus({ preventScroll: true }); return; }
  const first = f[0], last = f[f.length - 1], active = document.activeElement;
  if (e.shiftKey && (active === first || active === popupSheet || !popupSheet.contains(active))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (active === last || !popupSheet.contains(active))) { e.preventDefault(); first.focus(); }
});

// previous / next coin buttons (same behaviour as the swipe)
cpPrev.addEventListener('click', () => navigateExpandedRow(-1, popupBody.querySelector('.detail-box')));
cpNext.addEventListener('click', () => navigateExpandedRow(1, popupBody.querySelector('.detail-box')));

// every in-popup action goes through this one delegated listener
popupBody.addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if (!btn || !popupBody.contains(btn)) return;
  const { id, symbol } = btn.dataset;
  if (btn.classList.contains('detail-remove-btn')) removeCoin(id, symbol);
  else if (btn.classList.contains('chart-toggle-btn')) {
    toggleChart(id, symbol, btn);
    const c = document.getElementById(`chart-container-${id}`);
    if (c && c.style.display === 'block') c.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  else if (btn.classList.contains('dca-log-btn')) logDcaLevel(id, symbol);
  else if (btn.classList.contains('dca-log-clear-btn')) clearDcaLevel(id, symbol);
  else if (btn.classList.contains('dca-del-btn')) removeDcaEntry(id, symbol, Number(btn.dataset.ts));
});

// ===== In-app dialog: DCA entry form + confirmations (replaces prompt()/confirm()/alert()) ===========
// One static dialog element; every use only re-renders its title/body, and all listeners are attached once.
function openDialog({ title, sub = '', bodyHtml = '', okLabel = 'Save', danger = false, validate = null, onReady = null }) {
  if (dlgOpen) return Promise.resolve(null);
  clearTimeout(dlgCloseTimer);
  return new Promise((resolve) => {
    dlgOpen = true; dlgDone = resolve; dlgValidate = validate; dlgBackdropDown = false;
    dlgLastFocus = document.activeElement;
    dlgTitle.textContent = title;
    dlgSub.textContent = sub; dlgSub.hidden = !sub;
    dlgBody.innerHTML = bodyHtml;
    dlgOk.textContent = okLabel;
    dlgOk.classList.toggle('danger', !!danger);
    popupOverlay.inert = true;                       // the coin popup behind it can't take focus or taps
    dlgOverlay.setAttribute('aria-hidden', 'false');
    void dlgOverlay.offsetWidth;
    dlgOverlay.classList.add('open');
    if (onReady) onReady(); else dlgCard.focus({ preventScroll: true });
  });
}

function closeDialog(result) {
  if (!dlgOpen) return;
  const done = dlgDone, back = dlgLastFocus;
  dlgOpen = false; dlgDone = null; dlgValidate = null; dlgLastFocus = null;
  dlgOverlay.classList.remove('open');
  dlgOverlay.setAttribute('aria-hidden', 'true');
  popupOverlay.inert = false;
  clearTimeout(dlgCloseTimer);
  dlgCloseTimer = setTimeout(() => { if (!dlgOpen) dlgBody.innerHTML = ''; }, 260);
  if (back && back.isConnected && typeof back.focus === 'function') back.focus({ preventScroll: true });
  else if (coinPopupOpen) popupSheet.focus({ preventScroll: true });
  if (done) done(result);
}

function submitDialog() {
  if (!dlgOpen) return;
  if (!dlgValidate) { closeDialog(true); return; }
  const r = dlgValidate();
  if (r && r.ok) closeDialog(r.value);
}

function dialogKeydown(e) {
  if (e.key === 'Escape') { e.preventDefault(); closeDialog(null); return; }
  if (e.key === 'Enter' && e.target && e.target.tagName === 'INPUT') {
    e.preventDefault();
    const next = e.target.id === 'dlgPrice' ? dlgEl('dlgDate') : null;   // "next" on the price field -> date; Enter on the date saves
    if (next) next.focus({ preventScroll: true }); else submitDialog();
    return;
  }
  if (e.key !== 'Tab') return;
  const f = Array.from(dlgCard.querySelectorAll('button:not(:disabled), input, [tabindex]:not([tabindex="-1"])')).filter(el => el.offsetParent !== null);
  if (!f.length) { e.preventDefault(); return; }
  const first = f[0], last = f[f.length - 1], active = document.activeElement;
  if (e.shiftKey && (active === first || active === dlgCard || !dlgCard.contains(active))) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && (active === last || !dlgCard.contains(active))) { e.preventDefault(); first.focus(); }
}

dlgOk.addEventListener('click', submitDialog);
dlgCancel.addEventListener('click', () => closeDialog(null));
dlgOverlay.addEventListener('pointerdown', (e) => { dlgBackdropDown = (e.target === dlgOverlay); });
dlgOverlay.addEventListener('click', (e) => {
  const closeIt = dlgBackdropDown && e.target === dlgOverlay;
  dlgBackdropDown = false;
  if (closeIt) closeDialog(null);
});

function confirmDialog({ title, message, okLabel = 'Confirm', danger = false }) {
  return openDialog({
    title, bodyHtml: `<p class="dlg-msg">${message}</p>`, okLabel, danger,
    onReady: () => dlgCancel.focus({ preventScroll: true })      // destructive actions never default-focus the confirm button
  }).then(r => !!r);
}

// --- DCA entry form -------------------------------------------------------------------------------
const dlgEl = (id) => dlgBody.querySelector('#' + id);

function dlgSetError(fieldId, msg) {
  const err = dlgEl(fieldId + 'Err'), wrap = dlgEl(fieldId + 'Wrap');
  if (err) err.textContent = msg || '';
  if (wrap) wrap.classList.toggle('invalid', !!msg);
}

function dlgPriceHint() {
  const hint = dlgEl('dlgPriceHint'), input = dlgEl('dlgPrice');
  if (!hint || !input) return;
  const raw = input.value.replace(/[₹,\s]/g, '');
  const p = /^(\d+\.?\d*|\.\d+)$/.test(raw) ? Number(raw) : NaN;
  if (!(p > 0) || dlgCtx.cur == null || !(dlgCtx.cur > 0)) { hint.textContent = ''; return; }
  const pct = (p - dlgCtx.cur) / dlgCtx.cur * 100;
  hint.textContent = Math.abs(pct) < 0.05 ? 'At the current price' : `${Math.abs(pct).toFixed(1)}% ${pct < 0 ? 'below' : 'above'} the current price`;
}

function dlgDateChips() {
  const d = dlgEl('dlgDate'); if (!d) return;
  dlgBody.querySelectorAll('.dlg-chip[data-act="today"]').forEach(b => b.classList.toggle('on', d.value === dlgCtx.today));
  dlgBody.querySelectorAll('.dlg-chip[data-act="yest"]').forEach(b => b.classList.toggle('on', d.value === dlgCtx.yest));
}

dlgBody.addEventListener('input', (e) => {
  if (e.target.id === 'dlgPrice') { dlgSetError('dlgPrice', ''); dlgPriceHint(); }
  else if (e.target.id === 'dlgDate') { dlgSetError('dlgDate', ''); dlgDateChips(); }
});
dlgBody.addEventListener('click', (e) => {
  const b = e.target.closest('.dlg-chip'); if (!b) return;
  const act = b.dataset.act;
  if (act === 'cur') { const i = dlgEl('dlgPrice'); i.value = String(dlgCtx.cur); dlgSetError('dlgPrice', ''); dlgPriceHint(); i.focus({ preventScroll: true }); }
  else if (act === 'today' || act === 'yest') { const d = dlgEl('dlgDate'); d.value = act === 'today' ? dlgCtx.today : dlgCtx.yest; dlgSetError('dlgDate', ''); dlgDateChips(); }
});
dlgBody.addEventListener('focusin', (e) => {   // keep the focused field clear of the on-screen keyboard
  if (e.target.tagName === 'INPUT') setTimeout(() => { if (e.target.isConnected) e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 250);
});

function dcaEntryDialog(symbol, cur) {
  const today = istDateStr(Date.now()), yest = istDateStr(Date.now() - 864e5);
  dlgCtx = { cur: (cur != null && cur > 0) ? cur : null, today, yest };
  const bodyHtml = `
    <div class="dlg-field">
      <label class="dlg-label" for="dlgPrice">Price paid per coin</label>
      <div class="dlg-input" id="dlgPriceWrap"><span class="dlg-prefix">₹</span><input id="dlgPrice" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="next" value="${dlgCtx.cur != null ? dlgCtx.cur : ''}" aria-describedby="dlgPriceHint dlgPriceErr"></div>
      <div class="dlg-hint" id="dlgPriceHint"></div>
      <div class="dlg-err" id="dlgPriceErr" role="alert"></div>
      ${dlgCtx.cur != null ? `<div class="dlg-chips"><button type="button" class="dlg-chip" data-act="cur">Use current ${formatINR(dlgCtx.cur, pricePrecisionFor(dlgCtx.cur))}</button></div>` : ''}
    </div>
    <div class="dlg-field">
      <label class="dlg-label" for="dlgDate">Date of this DCA</label>
      <div class="dlg-input" id="dlgDateWrap"><input id="dlgDate" type="date" value="${today}" max="${today}" min="2009-01-03" enterkeyhint="done" aria-describedby="dlgDateErr"></div>
      <div class="dlg-chips"><button type="button" class="dlg-chip on" data-act="today">Today</button><button type="button" class="dlg-chip" data-act="yest">Yesterday</button></div>
      <div class="dlg-err" id="dlgDateErr" role="alert"></div>
    </div>
    <p class="dlg-note">Missed an earlier buy? Set its date — the newest-dated entry is used for the next-add gap check.</p>`;
  return openDialog({
    title: 'Log DCA entry',
    sub: `${symbol}${dlgCtx.cur != null ? ' · now ' + formatINR(dlgCtx.cur, pricePrecisionFor(dlgCtx.cur)) : ''}`,
    bodyHtml, okLabel: 'Save entry',
    onReady: () => { const i = dlgEl('dlgPrice'); dlgPriceHint(); i.focus({ preventScroll: true }); i.select(); },
    validate: () => {
      const priceEl = dlgEl('dlgPrice'), dateEl = dlgEl('dlgDate');
      const raw = priceEl.value.replace(/[₹,\s]/g, '');
      const price = /^(\d+\.?\d*|\.\d+)$/.test(raw) ? Number(raw) : NaN;
      const d = dateEl.value;
      let firstBad = null;
      if (!(price > 0) || !isFinite(price)) { dlgSetError('dlgPrice', raw ? 'Enter a valid price, e.g. 299.50' : 'Enter the price you paid'); firstBad = priceEl; }
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) { dlgSetError('dlgDate', 'Pick the date of this buy'); firstBad = firstBad || dateEl; }
      else if (d > today) { dlgSetError('dlgDate', 'The date can\u2019t be in the future'); firstBad = firstBad || dateEl; }
      else if (d < '2009-01-03') { dlgSetError('dlgDate', 'That date is too far back'); firstBad = firstBad || dateEl; }
      if (firstBad) { firstBad.focus({ preventScroll: true }); return { ok: false }; }
      return { ok: true, value: { price, dateStr: d } };
    }
  });
}

// drag the handle/header down to dismiss (Android bottom-sheet gesture; narrow screens only)
const DRAG_CLOSE_PX = 90;
let dragState = null;
const isSheetLayout = () => window.matchMedia('(max-width: 699.98px)').matches;
popupSheet.addEventListener('touchstart', (e) => {
  if (!isSheetLayout() || !e.target.closest('.cp-grab, .cp-header') || e.target.closest('button')) return;
  dragState = { startY: e.touches[0].clientY, dy: 0 };
  popupSheet.style.transition = 'none';
}, { passive: true });
popupSheet.addEventListener('touchmove', (e) => {
  if (!dragState) return;
  dragState.dy = Math.max(0, e.touches[0].clientY - dragState.startY);
  popupSheet.style.transform = `translateY(${dragState.dy}px)`;
}, { passive: true });
const endSheetDrag = (cancelled) => {
  if (!dragState) return;
  const dy = dragState.dy;
  dragState = null;
  popupSheet.style.transition = '';
  popupSheet.style.transform = '';
  if (!cancelled && dy > DRAG_CLOSE_PX) closeCoinPopup();
};
popupSheet.addEventListener('touchend', () => endSheetDrag(false));
popupSheet.addEventListener('touchcancel', () => endSheetDrag(true));

// Swipe left/right on the open popup to jump to the next/previous
// coin in the currently sorted list, without closing the popup.
const SWIPE_MIN_DX = 50;
const SWIPE_EDGE_EXCLUDE_PX = 24; // avoid fighting the browser's edge back/forward gesture
let swipeState = null;

popupBody.addEventListener('touchstart', (e) => {
  const box = e.target.closest('.detail-box');
  if (!box) return;
  if (e.target.closest('button, a, input, .chart-container')) return;
  const t = e.touches[0];
  if (t.clientX < SWIPE_EDGE_EXCLUDE_PX || t.clientX > window.innerWidth - SWIPE_EDGE_EXCLUDE_PX) return;
  swipeState = { box, startX: t.clientX, startY: t.clientY, dx: 0, dy: 0 };
}, { passive: true });

popupBody.addEventListener('touchmove', (e) => {
  if (!swipeState) return;
  const t = e.touches[0];
  swipeState.dx = t.clientX - swipeState.startX;
  swipeState.dy = t.clientY - swipeState.startY;
}, { passive: true });

popupBody.addEventListener('touchend', () => {
  if (!swipeState) return;
  const { box, dx, dy } = swipeState;
  swipeState = null;
  if (Math.abs(dx) < SWIPE_MIN_DX || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  navigateExpandedRow(dx < 0 ? 1 : -1, box);
});
popupBody.addEventListener('touchcancel', () => { swipeState = null; });

function navigateExpandedRow(direction, box) {
  if (!expandedRowId) return;
  const fromId = expandedRowId;
  const rows = Array.from(tableBody.querySelectorAll('tr.main-row'));
  const idx = rows.findIndex(r => r.dataset.id === expandedRowId);
  if (idx === -1 || rows.length < 2) return;
  const nextIdx = (idx + direction + rows.length) % rows.length;
  const nextTr = rows[nextIdx];
  const nextItem = portfolioMap[nextTr.dataset.id];
  if (!nextTr || !nextItem) return;

  const go = () => {
    if (!coinPopupOpen || expandedRowId !== fromId) return;   // closed or already moved on meanwhile
    expandRowCore(nextTr, nextItem, false);
    nextTr.scrollIntoView({ block: 'nearest' });              // keep the row in view behind the popup
  };
  if (box) {
    box.classList.add('swipe-out');
    setTimeout(go, 90);
  } else {
    go();
  }
}

function renderTable() {
  if (saved.length === 0) {
    tableBody.innerHTML = '<tr class="empty-row"><td colspan="5">No coins yet — add one above to start tracking signals.</td></tr>';
    closeCoinPopup();
    return;
  }

  const currentExpandedId = expandedRowId;
  let reopenTr = null;
  tableBody.innerHTML = '';

  saved.forEach(item => {
    const cur = pricesCache[item.id] ?? null;
    const gain = pctToTarget(cur, item.target);
    const { html: signalHtml } = signalCellHTML(item.id);

    const tr = document.createElement('tr');
    tr.className = 'main-row';
    tr.dataset.id = item.id;
    tr.innerHTML = `
      <td data-col="coin">
        <div class="coin-name">${item.symbol}</div>
      </td>
      <td class="numeric price-cell" data-id="${item.id}">${priceCellHTML(item.id, cur)}</td>
      <td class="numeric">${targetCellHTML(item)}</td>
      <td class="numeric gain-cell ${gain == null ? 'gain-na' : gain >= 0 ? 'gain-pos' : 'gain-neg'}">${formatPctShort(gain)}</td>
      <td class="center signal-cell">${signalHtml}</td>
    `;

    tr.onclick = (e) => {
      if (e.target.classList.contains('target-input')) return;
      // Tapping the target value starts inline target editing — don't also pop the sheet over it.
      if (e.target.closest('.target-display')) return;
      handleRowExpansion(tr, item);
    };

    tableBody.appendChild(tr);
    if (item.id === currentExpandedId) reopenTr = tr;
  });

  // Re-sync an open popup with the rebuilt rows (after all rows exist, so the "n/total" counter is right).
  if (currentExpandedId) {
    if (reopenTr) handleRowExpansion(reopenTr, portfolioMap[currentExpandedId], true);
    else closeCoinPopup();
  }
}

function updatePricesInTable() {
  let shouldReSort = false;
  document.querySelectorAll('.price-cell').forEach(priceCell => {
    const id = priceCell.dataset.id;
    const item = portfolioMap[id];
    if (!item) return;
    const cur = pricesCache[id] ?? null;
    const gain = pctToTarget(cur, item.target);
    const row = priceCell.closest('tr.main-row');
    if (!row) return;

    priceCell.innerHTML = priceCellHTML(id, cur);

    const gainCell = row.querySelector('.gain-cell');
    if (gainCell) {
      gainCell.textContent = formatPctShort(gain);
      gainCell.className = `numeric gain-cell ${gain == null ? 'gain-na' : gain >= 0 ? 'gain-pos' : 'gain-neg'}`;
      const oldGain = parseFloat(row.dataset.gain) || 0;
      const newGain = gain ?? 0;
      if (currentSortColumn === 'gain' && Math.abs(oldGain - newGain) > 0.1) shouldReSort = true;
      row.dataset.gain = newGain;
    }

    const signalCell = row.querySelector('.signal-cell');
    if (signalCell) {
      const { html } = signalCellHTML(id);
      signalCell.innerHTML = html;
    }
  });
  if (shouldReSort) applyCurrentSort();
  else if (expandedRowId) {
    const activeChart = document.getElementById(`chart-container-${expandedRowId}`);
    const chartIsOpen = activeChart && activeChart.dataset.loaded === 'true' && activeChart.style.display === 'block';
    if (!chartIsOpen) {
      const tr = tableBody.querySelector(`tr[data-id="${expandedRowId}"]`);
      const item = portfolioMap[expandedRowId];
      if (tr && item) handleRowExpansion(tr, item, true);
    }
  }
}

function daysSince(dateStr) {
  if (!dateStr) return null;
  const then = new Date(dateStr).getTime();
  if (isNaN(then)) return null;
  return Math.max(0, Math.round((Date.now() - then) / 86400000));
}

function handleRowExpansion(tr, item, forceReExpand = false) {
  return expandRowCore(tr, item, forceReExpand);
}

// Builds the coin's detail markup (unchanged content and calculations) and shows it in the popup.
// Returns true when the tap closed an already-open popup for the same coin, false otherwise.
function expandRowCore(tr, item, forceReExpand) {
  if (!forceReExpand && coinPopupOpen && expandedRowId === item.id) { closeCoinPopup(); return true; }
  tableBody.querySelectorAll('tr.main-row.open').forEach(r => { if (r !== tr) r.classList.remove('open'); });
  if (tr) tr.classList.add('open');

  const ta = holdingSignalCache[item.id];

  const removeBtnHtml = `<button type="button" class="detail-remove-btn" data-id="${item.id}" data-symbol="${item.symbol}">Remove ${item.symbol} from portfolio</button>`;
  const chartHtml = `<div class="chart-toggle-row">
      <button type="button" class="chart-toggle-btn" data-id="${item.id}" data-symbol="${item.symbol}">📈 View chart</button>
      <a class="chart-external-link" href="https://www.tradingview.com/chart/?symbol=BINANCE%3A${item.symbol}USDT*FX_IDC%3AUSDINR" target="_blank" rel="noopener">Open in TradingView ↗</a>
    </div>
    <div class="chart-container" id="chart-container-${item.id}"></div>`;

  if (!ta || ta.signal === 'NA') {
    presentCoinPopup(item, `<div class="detail-box">
      <div class="detail-reason">${ta ? ta.reason : 'No market data yet for this coin.'}</div>
      ${chartHtml}
      ${removeBtnHtml}
    </div>`, SIG_COLOR.na);
    return false;
  }

  const cmp = ta.cmp;
  const precision = pricePrecisionFor(cmp);
  const fmt = (n) => (n == null || isNaN(n)) ? '—' : formatINR(n, precision);
  const sgn = (n, d = 1) => (n == null || isNaN(n)) ? '—' : (n >= 0 ? '+' : '−') + Math.abs(n).toFixed(d) + '%';
  const taC = taCache[item.id] || {};
  const vc = SIG_COLOR[ta.colorKey] || SIG_COLOR.hold;
  const label = SIGNAL_LABELS_SHORT[ta.signal] || ta.signal;
  const wd = ta.rollingLowWindowDays || DCA_DIP_WINDOW_DAYS;
  const tgt = (item.target != null && !isNaN(Number(item.target))) ? Number(item.target) : null;

  // ---- values the signal gates are built from ----
  const nearThr = ta.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
  const osThr = ta.rsiOversoldThreshold ?? RSI_OVERSOLD;
  const obThr = ta.rsiOverboughtThreshold ?? RSI_OVERBOUGHT;
  const aboveLow = (ta.effectiveLow != null && cmp != null) ? (cmp - ta.effectiveLow) / ta.effectiveLow * 100 : null;
  const gHigh = ta.gateHigh ?? ta.effectiveHigh, gHWd = ta.gateHighWindow ?? wd;
  const gBelow = (gHigh != null && cmp != null) ? (gHigh - cmp) / gHigh * 100 : null;
  const gHLvl = gHigh != null ? gHigh * (1 - nearThr / 100) : null;
  const gHTo = (gHigh != null && cmp != null && cmp > 0) ? (gHigh - cmp) / cmp * 100 : null;
  const gHBand = (gHigh != null && gHLvl != null) ? (gHigh - gHLvl) / gHLvl * 100 : null;
  const gLow = ta.gateLow ?? ta.effectiveLow, gWd = ta.gateLowWindow ?? wd;
  const gAbove = (gLow != null && cmp != null) ? (cmp - gLow) / gLow * 100 : null;
  const gLvl = gLow != null ? gLow * (1 + nearThr / 100) : null;
  const gTo = (gLow != null && cmp != null && cmp > 0) ? (gLow - cmp) / cmp * 100 : null;
  const gBand = (gLow != null && gLvl != null) ? (gLow - gLvl) / gLvl * 100 : null;
  const belowHigh = (ta.effectiveHigh != null && cmp != null) ? (ta.effectiveHigh - cmp) / ta.effectiveHigh * 100 : null;
  const closedRsi = taC.rsi ?? null;
  const lastLog = dcaLogCache[item.id] ?? null;
  const dynGap = Math.max(DCA_GAP_FLOOR_PCT, Math.min(DCA_GAP_CEIL_PCT, (taC.avgDailyMove ?? DCA_GAP_FLOOR_PCT) * DCA_GAP_MULT));
  const gapPct = (lastLog && cmp != null) ? (lastLog.price - cmp) / lastLog.price * 100 : null;
  const gapOk = !lastLog || (gapPct != null && gapPct >= dynGap);
  const nearTarget = tgt != null && cmp != null ? cmp >= tgt * (1 - TARGET_PROXIMITY_PCT / 100) : false;
  const volOk = ta.volume != null && ta.mcap != null && ta.mcap > 0 && ta.volume > 0 && ta.volMcapRatio != null
    && ta.volMcapRatio >= LIQUIDITY_DEAD_RATIO && !(ta.mcap < MICROCAP_FLOOR && ta.volume < ABSOLUTE_DEAD_VOLUME);
  const microOk = !(ta.mcap != null && ta.mcap < MICROCAP_FLOOR && (ta.rank == null || ta.rank > RANK_CAUTION));
  const athWatch = ta.athTiers?.watch ?? DCA_WATCH_PCT;
  const athModerate = ta.athTiers?.moderate ?? DCA_MODERATE_PCT;
  const buyZone = ta.yearTiers?.moderate ?? DCA_YEAR_MODERATE_PCT;
  const negPct = (n) => `${n < 0 ? '−' : ''}${Math.abs(n).toFixed(0)}%`;

  const gate = (st, l, v, req, sub) => `<div class="dx-gate"><span class="dx-ic ${st}">${st === 'ok' ? '✓' : st === 'no' ? '✕' : '–'}</span><span class="dx-l">${l}</span><span class="dx-v"><b class="${st === 'ok' ? 'buy' : st === 'no' ? 'sell' : 'na'}">${v}</b>${req ? ` <span class="dx-req">${req}</span>` : ''}${sub ? `<span class="dx-gs">${sub}</span>` : ''}</span></div>`;
  // distance wording: signed "% away" from the current price to the level (+ = level is above, − = below)
  const awayTxt = (n, d = 1) => (n == null || isNaN(n)) ? '—' : `${sgn(n, d)} away`;
  const DOT = ' • ';
  const targetGate = () => tgt == null ? '' : gate(nearTarget ? 'ok' : 'no', 'Your target',
    cmp == null ? '—' : awayTxt((tgt - cmp) / cmp * 100),
    `${DOT}target ${fmt(tgt)}`, `needs ≥${fmt(tgt * (1 - TARGET_PROXIMITY_PCT / 100))} (≤${TARGET_PROXIMITY_PCT}%)`);

  let fam;
  if (ta.signal === 'EXIT' || ta.signal === 'AT RISK') fam = 'safe';
  else if (ta.signal === 'TRIM') fam = nearTarget ? 'target' : 'trimAth';
  else if (ta.signal === 'SWING TRIM') fam = 'swing';
  else if (ta.signal === 'ACCUMULATE') fam = 'add';
  else if (ta.signal === 'HOLD') fam = 'hold';
  else fam = ta.lean === 'swing' ? 'swing' : 'add';

  let head = '', gates = '';
  if (fam === 'safe') {
    head = 'Is it safe to hold?';
    gates = gate(volOk ? 'ok' : 'no', 'Real trading volume', ta.volMcapRatio == null ? 'no data' : (ta.volMcapRatio * 100).toFixed(2) + '%', ta.volMcapRatio == null ? '' : `${DOT}of market cap`, `needs ≥${(LIQUIDITY_DEAD_RATIO * 100).toFixed(2)}%`)
      + gate(microOk ? 'ok' : 'no', 'Not a micro-cap', ta.mcap == null ? '—' : formatINR(ta.mcap, 2, true), ta.rank == null ? '' : `${DOT}rank #${ta.rank}`, `needs ≥${formatINR(MICROCAP_FLOOR, 2, true)} or top ${RANK_CAUTION}`);
  } else if (fam === 'target') {
    head = 'Should I trim? (your target)';
    gates = targetGate();
  } else if (fam === 'trimAth') {
    head = 'Why trim?';
    gates = gate('ok', 'Shallow discount vs ATH', sgn(ta.athPct), ta.athValue == null ? '' : `${DOT}ATH ${fmt(ta.athValue)}`, ta.athValue == null ? `needs >${sgn(athWatch, 0)}` : `needs >${fmt(ta.athValue * (1 + athWatch / 100))} (>${sgn(athWatch, 0)})`) + targetGate();
  } else if (fam === 'swing') {
    head = 'Should I trim some? (range top)';
    gates = gate(gBelow != null && gBelow <= nearThr ? 'ok' : 'no', `Close to ${gHWd}-day high`, awayTxt(gHTo), `${DOT}high ${fmt(gHigh)}`, `needs ≥${fmt(gHLvl)}${gHBand == null ? '' : ` (≤${Math.abs(gHBand).toFixed(1)}%)`}`)
      + gate(ta.rsi != null && ta.rsi >= obThr ? 'ok' : 'no', 'Overbought now (RSI)', ta.rsi == null ? '—' : ta.rsi.toFixed(1), (ta.rsi == null ? '' : `current${DOT}`) + `needs ≥${obThr.toFixed(0)}`) + targetGate();
  } else if (fam === 'hold') {
    head = 'Why hold?';
    gates = gate(ta.athPct != null && ta.athPct <= athModerate ? 'ok' : 'no', 'Meaningful discount vs ATH', sgn(ta.athPct), ta.athValue == null ? '' : `${DOT}ATH ${fmt(ta.athValue)}`, ta.athValue == null ? `needs ≤${sgn(athModerate, 0)}` : `needs ≤${fmt(ta.athValue * (1 + athModerate / 100))} (≤${sgn(athModerate, 0)})`)
      + gate(ta.drawdown365 != null && ta.drawdown365 <= buyZone ? 'ok' : 'no', `Real pullback from ${YEAR_HIGH_DAYS}-day high`, sgn(ta.drawdown365), ta.high365 == null ? '' : `${DOT}high ${fmt(ta.high365)}`, ta.high365 == null ? `needs ≤${sgn(buyZone, 0)}` : `needs ≤${fmt(ta.high365 * (1 + buyZone / 100))} (≤${sgn(buyZone, 0)})`);
  } else {
    head = 'Should I add?';
    gates = gate(gAbove != null && gAbove <= nearThr ? 'ok' : 'no', `Close to ${gWd}-day low`, awayTxt(gTo), `${DOT}low ${fmt(gLow)}`, `needs ≤${fmt(gLvl)}${gBand == null ? '' : ` (≤${Math.abs(gBand).toFixed(1)}%)`}`)
      + gate(ta.rsi != null && ta.rsi <= osThr ? 'ok' : 'no', 'Oversold now (RSI)', ta.rsi == null ? '—' : ta.rsi.toFixed(1), (ta.rsi == null ? '' : `current${DOT}`) + `needs ≤${osThr.toFixed(0)}`)
      + gate(closedRsi == null ? 'na' : closedRsi <= osThr ? 'ok' : 'no', 'Oversold at last close', closedRsi == null ? '—' : closedRsi.toFixed(1), (closedRsi == null ? '' : `last close${DOT}`) + `needs ≤${osThr.toFixed(0)}`)
      + gate(gapOk ? 'ok' : 'no', 'Below last DCA price', !lastLog ? 'no DCA logged' : `${Math.abs(gapPct).toFixed(1)}% ${gapPct >= 0 ? 'below' : 'above'}`, lastLog ? `${DOT}last ${fmt(lastLog.price)}` : '', lastLog ? `needs ≥${dynGap.toFixed(1)}% below (≤${fmt(lastLog.price * (1 - dynGap / 100))})` : '');
  }
  const chk = (l, v) => `${l} <b class="${v == null ? 'muted' : v ? 'buy' : 'sell'}">${v == null ? '—' : v ? '✓' : '✕'}</b>`;
  const others = `Other checks: ${chk('Safe', volOk && microOk)} · ${chk('Target hit', tgt == null ? null : nearTarget)} · ${chk('Add', ta.signal === 'ACCUMULATE')} · ${chk('Swing trim', ta.signal === 'SWING TRIM')}`;

  // ---- price-position sliders ----
  const dayC = getDayCandle(item.id);
  const rawCandle = dayCandleCache[item.id];
  const nowMs = Date.now(), dayStart = utcMidnightOf(nowMs);
  const candleMsg = (rawCandle && rawCandle.invalid && rawCandle.dayKey === utcDayKey(nowMs))
    ? 'Today\'s candle rejected — CoinGecko\'s first candle doesn\'t start at 00:00 UTC'
    : (nowMs - dayStart < 60 * 60000)
      ? `New UTC day — first candle closes ${new Date(dayStart + CANDLE_MS).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} local`
      : 'Today\'s candle unavailable — waiting on CoinGecko OHLC';
  const hasRange = dayC && dayC.low != null && dayC.high != null;
  // The live price is a real observed price, so it can only widen the candle range (a wick since the
  // last OHLC fetch is the one thing this can't see — hence the 'as of' time).
  const barLow = hasRange ? (cmp != null ? Math.min(dayC.low, cmp) : dayC.low) : null;
  const barHigh = hasRange ? (cmp != null ? Math.max(dayC.high, cmp) : dayC.high) : null;

  const rng = (name, lo, hi, o) => {
    if (lo == null || hi == null || cmp == null || !(hi > lo) || (o.log && !(lo > 0))) {
      return `<div class="dx-blk"><div class="dx-rng"><b>${name}</b><span style="grid-column:2/-1">—</span></div></div>`;
    }
    let z = o.log ? (Math.log(cmp) - Math.log(lo)) / (Math.log(hi) - Math.log(lo)) : (cmp - lo) / (hi - lo);
    z = Math.max(0, Math.min(1, z)) * 100;
    const op = o.open != null ? Math.max(0, Math.min(100, (o.open - lo) / (hi - lo) * 100)) : null;
    return `<div class="dx-blk"><div class="dx-rng"><b>${name}</b><span>${fmt(lo)}</span><div class="dx-bar" style="--mid:${op != null ? op : 50}%"><span class="m" style="left:${z}%"></span></div><span>${fmt(hi)}</span></div>
      <div class="dx-met"><div>${o.l}</div><div>${o.r}</div></div>${o.extra ? `<div class="dx-sub">${o.extra}</div>` : ''}</div>`;
  };
  const dTxt = (live, approx, d) => live ? 'today⚡' : (d == null ? '—' : (approx ? '~' : '') + d + 'd');
  const D = '<i class="dt">·</i>';
  const rsiTxtN = (v, approx) => `${D}RSI ${v == null ? '—' : (approx ? '~' : '') + v.toFixed(1)}`;
  const rsiTxt = (v, approx) => v == null ? '' : `${D}RSI ${approx ? '~' : ''}${v.toFixed(1)}`;

  const todayHtml = hasRange
    ? rng('Today', barLow, barHigh, {
        open: dayC.open,
        l: `<b>${sgn((cmp - barLow) / barLow * 100)}</b>${D}open ${fmt(dayC.open)}`,
        r: `<b>${sgn(-(barHigh - cmp) / barHigh * 100)}</b>${D}${new Date(dayC.fetchedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`
      })
    : `<div class="dx-blk"><div class="dx-rng"><b>Today</b><span style="grid-column:2/-1;font-family:var(--font-ui)">${dayC ? 'Range unavailable — CoinGecko is missing a candle' : candleMsg}</span></div></div>`;
  const d90Html = rng(`${wd} days${ta.rollingExtremesSource === 'closes' ? ' ≈' : ''}`, ta.effectiveLow, ta.effectiveHigh, {
    l: `<b>${sgn(aboveLow)}</b>${D}${dTxt(ta.isLiveLow, ta.lowDaysAgoApprox, ta.effectiveLowDaysAgo)}${rsiTxt(ta.lowRsi, ta.lowDaysAgoApprox)}`,
    r: `<b>${sgn(belowHigh == null ? null : -belowHigh)}</b>${D}${dTxt(ta.isLiveHigh, ta.highDaysAgoApprox, ta.effectiveHighDaysAgo)}${rsiTxt(ta.highRsi, ta.highDaysAgoApprox)}`
  });
  const winRow = (label, w) => (w && w.lo && w.hi) ? rng(label, w.lo.v, w.hi.v, {
    l: `<b>${sgn((cmp - w.lo.v) / w.lo.v * 100)}</b>${D}${dTxt(w.lo.live, w.lo.tilde, w.lo.k)}${rsiTxtN(w.lo.rsi, w.lo.tilde)}`,
    r: `<b>${sgn(-(w.hi.v - cmp) / w.hi.v * 100)}</b>${D}${dTxt(w.hi.live, w.hi.tilde, w.hi.k)}${rsiTxtN(w.hi.rsi, w.hi.tilde)}`
  }) : '';
  const d180Html = (ta.win180 && ta.win180.n > wd + 5) ? winRow('180 days', ta.win180) : '';
  const yrHtml = winRow(`${YEAR_HIGH_DAYS} days`, ta.win365);
  const athDays = ta.isLiveAth ? 0 : daysSince(ta.athDate);
  const atlDays = ta.isLiveAtl ? 0 : daysSince(ta.atlDate);
  const pctAboveAtl = (cmp != null && ta.atlValue != null && ta.atlValue !== 0) ? ((cmp - ta.atlValue) / ta.atlValue * 100) : null;
  const allHtml = rng('All time', ta.atlValue, ta.athValue, {
    log: true,
    l: `<b>${sgn(pctAboveAtl)}</b>${D}${ta.isLiveAtl ? 'today⚡' : (atlDays == null ? '—' : atlDays + 'd')}`,
    r: `<b>${sgn(ta.athPct)}</b>${D}${ta.isLiveAth ? 'today⚡' : (athDays == null ? '—' : athDays + 'd')}`
  });
  // Rolling 24h range (CoinGecko). The live price can only widen it (it is a real observed price).
  const rollChg = getRollingChangePct(item.id);
  const h24Lo = ta.low24h != null ? (cmp != null ? Math.min(ta.low24h, cmp) : ta.low24h) : null;
  const h24Hi = ta.high24h != null ? (cmp != null ? Math.max(ta.high24h, cmp) : ta.high24h) : null;
  const h24Html = rng('24h', h24Lo, h24Hi, {
    l: `<b>${sgn(h24Lo != null && cmp != null ? (cmp - h24Lo) / h24Lo * 100 : null)}</b>${D}rolling`,
    r: `<b>${sgn(h24Hi != null && cmp != null ? -(h24Hi - cmp) / h24Hi * 100 : null)}</b>${D}move <b class="${rollChg == null ? '' : rollChg >= 0 ? 'buy' : 'sell'}">${sgn(rollChg)}</b>`
  });

  // ---- momentum + liquidity ----
  const cell = (k, v, cls = '', sub = '') => `<div class="dx-cell"><div class="k">${k}</div><div class="n ${cls}">${v}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>`;
  const rs = ta.relStrengthVsBtc;
  const emaGap = (ta.emaLong != null && cmp != null) ? (ta.emaLong - cmp) / cmp * 100 : null;
  const momentum = [
    cell('7 days', sgn(ta.change7d), ta.change7d != null && ta.change7d <= CRASH_7D_PCT ? 'sell' : ta.change7d > 0 ? 'buy' : ''),
    cell('30 days', sgn(ta.change30d), ta.change30d > 0 ? 'buy' : ta.change30d < 0 ? 'sell' : ''),
    cell('RSI (14, live)', ta.rsi == null ? '—' : ta.rsi.toFixed(1), ta.rsi != null && ta.rsi <= osThr ? 'buy' : ta.rsi != null && ta.rsi >= obThr ? 'sell' : 'rsi'),
    cell('To EMA 200', sgn(emaGap), 'tgt', fmt(ta.emaLong)),
    cell('Trend', ta.sentiment == null ? '—' : ta.sentiment, ta.sentiment === 'Bullish' ? 'buy' : ta.sentiment === 'Bearish' ? 'sell' : '', '20/50 EMA, live'),
    cell(`vs BTC, ${REL_STRENGTH_WINDOW_DAYS}d`, rs == null ? '—' : `${rs >= 0 ? '+' : '−'}${Math.abs(rs).toFixed(1)}pp`, rs > 0 ? 'buy' : rs < 0 ? 'sell' : '', rs == null ? '' : rs > 0 ? 'outperforming' : 'underperforming')
  ].join('');
  const val = (n, f2) => n == null ? '—' : f2(n);
  const liquidity = `<div class="dx-liq"><span>24h vol <b>${val(ta.volume, v => formatINR(v, 2, true))}</b></span><span>MCap <b>${val(ta.mcap, v => formatINR(v, 2, true))}</b></span><span>Vol/MCap <b>${val(ta.volMcapRatio, v => (v * 100).toFixed(3) + '%')}</b></span><span>Rank <b>${val(ta.rank, v => '#' + v)}</b></span></div>`;

  // Logging is always available (not only while the signal reads ACCUMULATE) so a missed or
  // back-dated DCA can still be recorded; the newest-dated entry anchors the next-add gap check.
  const dcaHist = dcaHistoryOf(item.id);
  const dcaHistRows = dcaHist.slice(0, 5).map(h => `<div class="dca-hist-row"><span class="d">${h.dateStr || '—'}</span><b>${formatINR(h.price, pricePrecisionFor(h.price))}</b><button type="button" class="dca-del-btn" data-id="${item.id}" data-symbol="${item.symbol}" data-ts="${h.timestamp}" aria-label="Delete this DCA entry">✕</button></div>`).join('');
  const dcaLogHtml = `
    <div class="dca-block">
      <div class="dca-log-row">
        <span class="dca-log-status">${lastLog ? `Last logged DCA: ${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))} on ${lastLog.dateStr}` : 'No DCA logged yet.'}</span>
        <div class="dca-log-actions">
          ${lastLog ? `<button type="button" class="dca-log-clear-btn" data-id="${item.id}" data-symbol="${item.symbol}">Clear</button>` : ''}
          <button type="button" class="dca-log-btn" data-id="${item.id}" data-symbol="${item.symbol}">Log DCA</button>
        </div>
      </div>
      ${dcaHist.length > 1 ? `<div class="dca-hist">${dcaHistRows}</div><div class="dca-hist-note">${dcaHist.length > 5 ? `Showing newest 5 of ${dcaHist.length}. ` : ''}The newest-dated entry is used for the next-add gap check.</div>` : ''}
    </div>`;
  const dataThrough = ta.closesEndTs == null ? '—' : new Date(ta.closesEndTs).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
  const actsHtml = `<div class="dx-acts">
      <button type="button" class="chart-toggle-btn" data-id="${item.id}" data-symbol="${item.symbol}">📈 View chart</button>
      <a class="chart-external-link" href="https://www.tradingview.com/chart/?symbol=BINANCE%3A${item.symbol}USDT*FX_IDC%3AUSDINR" target="_blank" rel="noopener">TradingView ↗</a>
      <button type="button" class="detail-remove-btn" data-id="${item.id}" data-symbol="${item.symbol}" aria-label="Remove ${item.symbol} from portfolio">Remove</button>
    </div>
    <div class="chart-container" id="chart-container-${item.id}"></div>`;

  presentCoinPopup(item, `<div class="detail-box"><div class="dx">
      <div class="dx-verdict" style="--vc:${vc}"><span class="dx-vp">${label} ${ta.strength}%${ta.signal === 'ACCUMULATE' && ta.dcaStreakDay ? ` · D${ta.dcaStreakDay}` : ''}</span><p>${ta.reason}</p></div>
      <div><h3>${head}</h3>${gates}<div class="dx-oth">${others}</div></div>
      <div>${todayHtml}${h24Html}${d90Html}${d180Html}${yrHtml}${allHtml}</div>
      <div class="dx-grid">${momentum}</div>
      ${liquidity}
      ${ta.taStale ? '<div class="dx-hint">TA history for this coin hasn\'t loaded yet.</div>' : ''}
      ${dcaLogHtml}
      <div class="dx-hint" style="margin:0" title="Last daily close used for RSI, EMA and the ${wd}d/${YEAR_HIGH_DAYS}d windows">Daily data through ${dataThrough} · extremes: ${ta.rollingExtremesSource ?? '—'}</div>
      ${actsHtml}
    </div></div>`, vc);
  return false;
}

function applyCurrentSort() {
  gainSortArrow.textContent = '';
  signalSortArrow.textContent = '';
  priceSortArrow.textContent = '';
  if (currentSortColumn === 'gain') gainSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';
  else if (currentSortColumn === 'signal') signalSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';
  else if (currentSortColumn === 'change24h') priceSortArrow.textContent = sortDir === 'desc' ? '▼' : '▲';

  saved.sort((a, b) => {
    let valA, valB;
    if (currentSortColumn === 'gain') {
      const pctA = pctToTarget(pricesCache[a.id], a.target);
      const pctB = pctToTarget(pricesCache[b.id], b.target);
      valA = pctA == null ? -999999 : pctA;
      valB = pctB == null ? -999999 : pctB;
    } else if (currentSortColumn === 'change24h') {
      const chgA = getDisplayChange(a.id);
      const chgB = getDisplayChange(b.id);
      valA = chgA == null ? -999999 : chgA.pct;
      valB = chgB == null ? -999999 : chgB.pct;
    } else {
      valA = holdingSignalCache[a.id]?.strength || 0;
      valB = holdingSignalCache[b.id]?.strength || 0;
    }
    if (valA < valB) return sortDir === 'desc' ? 1 : -1;
    if (valA > valB) return sortDir === 'desc' ? -1 : 1;
    return 0;
  });
  renderTable();
}

// Shared by the manual "Add coin" flow and the Discover-section add buttons.
async function addCoinToPortfolio(chosenId, rawSymbol, chosenName) {
  if (saved.some(s => s.id === chosenId)) { alert(`${rawSymbol} is already in your list.`); return false; }
  const newCoin = { symbol: rawSymbol, id: chosenId, name: chosenName || chosenId, target: null };
  saved.push(newCoin);
  save();
  buildPortfolioMap();

  await checkApiStatus();
  applyCurrentSort();
  await fetchPrices([newCoin.id]);
  recomputeHoldingSignals();
  applyCurrentSort();
  fetchTaForPortfolio([...new Set([newCoin.id, 'bitcoin'])]);
  return true;
}

addBtn.onclick = async () => {
  if (!coinListLoaded) { setActivityStatus('Coin list not loaded yet — please wait.', 'warn'); return; }
  const rawSymbol = symbolInput.value.trim().toUpperCase();
  const chosenId = symbolInput.dataset.selectedId || null;
  const chosenName = symbolInput.dataset.selectedName || null;
  if (!chosenId) { alert('Please select a coin from the dropdown after typing.'); return; }

  symbolInput.value = '';
  delete symbolInput.dataset.selectedId;
  delete symbolInput.dataset.selectedName;
  addBtn.disabled = true;

  await addCoinToPortfolio(chosenId, rawSymbol, chosenName);
};

let discoverInFlight = false;
async function discoverCandidates() {
  if (discoverInFlight) return;
  discoverInFlight = true;
  discoverBtn.disabled = true;
  discoverBtn.textContent = 'Scanning…';
  discoverResults.innerHTML = `<div class="discover-empty">Fetching top ${DISCOVER_TOP_N} by market cap…</div>`;

  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 15000);
    const res = await fetch(`${API_BASE}/coins/markets?vs_currency=inr&order=market_cap_desc&per_page=${DISCOVER_TOP_N}&page=1&sparkline=false&price_change_percentage=7d,30d&x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    const markets = await res.json();

    const ownedIds = new Set(saved.map(s => s.id));
    // Stage 1 prefilter — same liquidity sanity checks classifyHolding applies, all computable
    // from this one /coins/markets response, no extra calls. The discount cutoff uses
    // DCA_MODERATE_PCT loosened by VOL_SCALE_MAX since no per-coin volatility is known yet at this
    // stage (no history fetched); stage 2 below applies the real volatility-scaled near-low band.
    const prefiltered = markets.filter(md => {
      if (ownedIds.has(md.id)) return false;
      if (md.ath_change_percentage == null || md.ath_change_percentage > DCA_MODERATE_PCT * VOL_SCALE_MAX) return false;
      const volume = md.total_volume, mcap = md.market_cap;
      if (volume == null || mcap == null || mcap === 0 || volume === 0) return false;
      if (mcap < MICROCAP_FLOOR && volume < ABSOLUTE_DEAD_VOLUME) return false;
      if ((volume / mcap) < LIQUIDITY_DEAD_RATIO) return false;
      return true;
    }).sort((a, b) => a.ath_change_percentage - b.ath_change_percentage) // deepest discount first
      .slice(0, DISCOVER_MAX_TA_FETCHES);

    if (!prefiltered.length) {
      discoverResults.innerHTML = '<div class="discover-empty">No coins outside your list clear the discount/liquidity prefilter right now.</div>';
      return;
    }

    // Stage 2: only the short list above gets the expensive per-coin daily-history fetch, same
    // near-low + RSI-oversold check classifyHolding uses for ACCUMULATE (no gap gate — that's
    // anchored to a logged DCA price, which doesn't exist for a coin you don't hold yet).
    const passing = [];
    for (let i = 0; i < prefiltered.length; i++) {
      const md = prefiltered[i];
      discoverResults.innerHTML = `<div class="discover-empty">Checking price history — ${i + 1}/${prefiltered.length}…</div>`;
      const closes = await fetchTaHistory(md.id);
      if (closes) {
        const ta = computeTaFromCloses(closes);
        if (ta && auditTa(ta) && ta.rollingLow != null) {
          const cur = md.current_price;
          const rl = ta.refLow;
          const wide = !!(rl && rl.window > ta.rollingLowWindowDays);
          const lowWin = wide ? rl.window : ta.rollingLowWindowDays;
          const atlWithinWindow = md.atl_date ? daysSince(md.atl_date) <= lowWin : false;
          const effectiveLow = Math.min(wide ? rl.val : ta.rollingLow, cur, (md.low_24h != null ? md.low_24h : Infinity), (atlWithinWindow && md.atl != null) ? md.atl : Infinity);
          const aboveLow = (cur - effectiveLow) / effectiveLow * 100;
          const nearLowThresholdPct = ta.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
          const nearLow = aboveLow <= nearLowThresholdPct;
          const liveRsiSeries = calcRSISeries(closes.concat([cur]), RSI_PERIOD);
          const liveRsi = liveRsiSeries.length ? liveRsiSeries[liveRsiSeries.length - 1] : null;
          const rsiThreshold = ta.rsiOversoldThreshold ?? RSI_OVERSOLD;
          const rsiOversold = liveRsi != null && liveRsi <= rsiThreshold && ta.rsi != null && ta.rsi <= rsiThreshold;
          const yr = yearHighDrawdown(closes, cur);
          const yearOk = yr == null || yr.pct <= (ta.yearTiers?.moderate ?? DCA_YEAR_MODERATE_PCT);
          if (nearLow && rsiOversold && yearOk) {
            passing.push({
              id: md.id, symbol: (md.symbol || '').toUpperCase(), name: md.name,
              price: cur, athPct: md.ath_change_percentage, yearPct: yr ? yr.pct : null, aboveLow, rsi: liveRsi, rsiThreshold, nearLowThresholdPct,
              windowDays: lowWin, rank: md.market_cap_rank
            });
          }
        }
      }
      await new Promise(r => setTimeout(r, TA_FETCH_DELAY_MS));
    }

    if (!passing.length) {
      discoverResults.innerHTML = `<div class="discover-empty">Checked ${prefiltered.length} discount candidates — none also cleared near-low + RSI-oversold right now.</div>`;
      return;
    }

    passing.sort((a, b) => a.athPct - b.athPct);
    discoverResults.innerHTML = passing.map(c => `
      <div class="discover-card" data-id="${c.id}" data-symbol="${c.symbol}" data-name="${(c.name || '').replace(/"/g, '&quot;')}">
        <div class="dc-top">
          <span><span class="dc-symbol">${c.symbol}</span><span class="dc-name">${c.name}</span></span>
          <button class="dc-add">+ Add</button>
        </div>
        <div class="dc-reason">${Math.abs(c.athPct).toFixed(0)}% below ATH${c.yearPct != null ? `, ${Math.abs(c.yearPct).toFixed(0)}% below ${YEAR_HIGH_DAYS}d high` : ''}, ${c.aboveLow.toFixed(1)}% above its ${c.windowDays}d low (within its own ≤${c.nearLowThresholdPct.toFixed(1)}% band), RSI ${c.rsi.toFixed(2)} (below its own ≤${c.rsiThreshold.toFixed(0)} bottom zone)${c.rank ? ` · rank #${c.rank}` : ''} — meets the same ACCUMULATE conditions as your holdings.</div>
      </div>
    `).join('');

    discoverResults.querySelectorAll('.dc-add').forEach(btn => {
      btn.addEventListener('click', async () => {
        const card = btn.closest('.discover-card');
        btn.disabled = true;
        btn.textContent = 'Adding…';
        const ok = await addCoinToPortfolio(card.dataset.id, card.dataset.symbol, card.dataset.name);
        if (ok) card.remove(); else { btn.disabled = false; btn.textContent = '+ Add'; }
      });
    });
  } catch (err) {
    discoverResults.innerHTML = '<div class="discover-empty">Scan failed — network error or CoinGecko rate limit. Try again shortly.</div>';
  } finally {
    discoverInFlight = false;
    discoverBtn.disabled = false;
    discoverBtn.textContent = 'Find candidates not in my list';
  }
}

discoverBtn.onclick = discoverCandidates;

gainHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'gain' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'gain';
  closeCoinPopup(); // re-sorting moves rows around, so keeping one open mid-move felt disorienting
  applyCurrentSort();
});

priceHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'change24h' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'change24h';
  closeCoinPopup();
  applyCurrentSort();
});

signalHeader.addEventListener('click', () => {
  sortDir = currentSortColumn === 'signal' ? (sortDir === 'desc' ? 'asc' : 'desc') : 'desc';
  currentSortColumn = 'signal';
  closeCoinPopup();
  applyCurrentSort();
});

let suggestTimer;
symbolInput.addEventListener('input', () => {
  clearTimeout(suggestTimer);
  const query = symbolInput.value.trim();
  delete symbolInput.dataset.selectedId;
  delete symbolInput.dataset.selectedName;
  addBtn.disabled = true;
  if (!query) { suggestBox.style.display = 'none'; return; }
  if (!coinListLoaded) {
    suggestBox.innerHTML = '<div class="suggestion-no-result">Coin list unavailable or still loading…</div>';
    positionSuggestBox();
    suggestBox.style.display = 'block';
    return;
  }
  suggestTimer = setTimeout(() => {
    const q = query.toLowerCase();
    const results = [];
    if (symbolIndex[q]) results.push(...symbolIndex[q]);
    if (results.length < 25) {
      coinList.some(c => {
        const s = c.symbol?.toLowerCase() || '';
        const n = c.name?.toLowerCase() || '';
        if (s.includes(q) || n.includes(q)) { results.push({ id: c.id, symbol: c.symbol?.toUpperCase(), name: c.name }); return results.length >= 25; }
        return false;
      });
    }
    suggestBox.innerHTML = results.length
      ? results.map(coin => `<div class="suggestion-item" data-id="${coin.id}" data-symbol="${coin.symbol}" data-name="${(coin.name || '').replace(/"/g, '&quot;')}">${coin.symbol} — ${coin.name}</div>`).join('')
      : '<div class="suggestion-no-result">No results found</div>';
    suggestBox.querySelectorAll('.suggestion-item').forEach(el => {
      el.addEventListener('click', () => {
        symbolInput.value = el.dataset.symbol;
        symbolInput.dataset.selectedId = el.dataset.id;
        symbolInput.dataset.selectedName = el.dataset.name;
        suggestBox.style.display = 'none';
        addBtn.disabled = false;
      });
    });
    positionSuggestBox();
    suggestBox.style.display = 'block';
  }, 250);
});

function positionSuggestBox() {
  const rect = symbolInput.getBoundingClientRect();
  const parentRect = symbolInput.offsetParent.getBoundingClientRect();
  suggestBox.style.top = (rect.bottom - parentRect.top + 4) + 'px';
  suggestBox.style.left = (rect.left - parentRect.left) + 'px';
  suggestBox.style.width = rect.width + 'px';
}

document.addEventListener('click', (e) => {
  if (!symbolInput.contains(e.target) && !suggestBox.contains(e.target)) suggestBox.style.display = 'none';
});

buildPortfolioMap();
renderTable();

const isApiReachable = await checkApiStatus();
await loadCoinList(isApiReachable);

const startIds = saved.map(s => s.id).filter(Boolean);
const startTaIds = [...new Set([...startIds, 'bitcoin'])];
if (isApiReachable) {
  refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
  await fetchPrices(startIds);
  recomputeHoldingSignals();
  updateScheduledStatus();
  fetchTaForPortfolio(startTaIds);
  refreshDayCandles(startIds);
} else {
  scheduleApiRecheck();
}

applyCurrentSort();

})();
</script>
