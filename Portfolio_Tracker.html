<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width,initial-scale=1" />
 <title>Portfolio Tracker</title>
 <style>
  :root {
   --bg: #0b0f14;
   --panel: #121820;
   --panel-2: #161e28;
   --border: rgba(255, 255, 255, 0.07);
   --text: #e6edf3;
   --muted: #7d8998;
   --muted-2: #566374;
   --accent: #4c8dff;
   --accent-dim: rgba(76, 141, 255, 0.12);
   --buy: #2fd576;
   --buy-dim: rgba(47, 213, 118, 0.12);
   --sell: #ff5c72;
   --sell-dim: rgba(255, 92, 114, 0.12);
   --dca: #22c1d9;
   --trim: #e8a63b;
   --trim-dim: rgba(232, 166, 59, 0.12);
   --swing: #ff5fa2;
   --hold: #7d8998;
   --target: #f5d90a;
   --rsi: #c792ea;
   --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
   --font-ui: -apple-system, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
   --r-sm: 6px;
   --r-md: 10px;
  }
  
  * {
   box-sizing: border-box;
  }
  
  html,
  body {
   height: 100%;
   margin: 0;
   font-family: var(--font-ui);
   font-size: 13px;
   background: var(--bg);
   color: var(--text);
   -webkit-font-smoothing: antialiased;
   max-width: 100%;
   overflow-x: hidden;
   overflow-anchor: none;
  }
  
  body {
   padding: 8px 8px calc(52px + env(safe-area-inset-bottom, 0px));
  }
  
  .app {
   max-width: min(100%, 1400px);
   margin: 0 auto;
  }
  
  header {
   display: flex;
   justify-content: space-between;
   align-items: center;
   gap: 8px;
   flex-wrap: nowrap;
   padding: 12px 12px;
   margin-bottom: 8px;
   border-radius: var(--r-md);
   border: 1px solid var(--border);
   background: radial-gradient(circle at 0% 0%, rgba(76, 141, 255, 0.14), transparent 58%), linear-gradient(135deg, var(--panel-2) 0%, var(--panel) 100%);
   box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  }
  
  .brand {
   display: flex;
   flex-direction: row;
   align-items: flex-start;
   gap: 9px;
   flex: 1 0 auto;
   min-width: 0;
  }
  
  .brand-mark {
   width: 34px;
   height: 34px;
   border-radius: 9px;
   background: var(--accent-dim);
   border: 1px solid rgba(76, 141, 255, 0.3);
   color: var(--accent);
   display: grid;
   place-items: center;
   flex-shrink: 0;
  }
  
  .brand-mark svg {
   width: 18px;
   height: 18px;
   fill: none;
   stroke: currentColor;
   stroke-width: 2.2;
   stroke-linecap: round;
   stroke-linejoin: round;
  }
  
  .brand-copy {
   display: flex;
   flex-direction: column;
   min-width: 0;
  }
  
  .brand h1 {
   margin: 0;
   font-size: 15.5px;
   font-weight: 700;
   letter-spacing: -0.015em;
   line-height: 1.2;
   color: var(--text);
   white-space: nowrap;
  }
  
  .brand-sub {
   font-size: 10px;
   font-weight: 600;
   letter-spacing: 0.06em;
   text-transform: uppercase;
   color: var(--muted);
   margin-top: 3px;
   white-space: nowrap;
  }
  
  .status-panel {
   display: flex;
   flex-direction: column;
   align-items: flex-end;
   gap: 6px;
   flex: 0 1 auto;
   min-width: 0;
  }
  
  .pill {
   font-size: 10.5px;
   font-weight: 600;
   line-height: 1.2;
   display: inline-flex;
   align-items: center;
   gap: 5px;
   padding: 4px 9px;
   border-radius: 999px;
   border: 1px solid var(--border);
   white-space: nowrap;
   max-width: 100%;
   overflow: hidden;
  }
  
  .pill-txt {
   flex: 1 1 auto;
   min-width: 0;
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
  }
  
  .pill .dot {
   width: 6px;
   height: 6px;
   border-radius: 50%;
   flex-shrink: 0;
  }
  
  .pill.ok {
   color: var(--buy);
   background: var(--buy-dim);
   border-color: rgba(47, 213, 118, 0.25);
  }
  
  .pill.ok .dot {
   background: var(--buy);
  }
  
  .pill.warn {
   color: var(--trim);
   background: var(--trim-dim);
   border-color: rgba(232, 166, 59, 0.25);
  }
  
  .pill.warn .dot {
   background: var(--trim);
  }
  
  .pill.error {
   color: var(--sell);
   background: var(--sell-dim);
   border-color: rgba(255, 92, 114, 0.25);
  }
  
  .pill.error .dot {
   background: var(--sell);
  }
  
  .pill.info {
   color: var(--muted);
   background: var(--panel-2);
  }
  
  .pill.info .dot {
   background: var(--muted);
  }
  
  button.fx-badge {
   display: inline-flex;
   align-items: center;
   flex: 0 1 auto;
   min-width: 0;
   height: 24px;
   font-family: var(--font-mono);
   font-size: 9.5px;
   font-weight: 600;
   line-height: 1;
   padding: 0 7px;
   border-radius: 6px;
   background: transparent;
   color: var(--muted);
   border: 1px solid var(--border);
   cursor: pointer;
   max-width: 100%;
   overflow: hidden;
   text-overflow: ellipsis;
   white-space: nowrap;
  }
  
  button.fx-badge:hover {
   color: var(--text);
   background: var(--panel);
  }
  
  button.fx-badge.calibrated {
   color: var(--accent);
   background: var(--accent-dim);
   border-color: rgba(76, 141, 255, 0.3);
  }
  
  button.fx-badge.peg-warn {
   color: var(--trim);
   background: var(--trim-dim);
   border-color: rgba(232, 166, 59, 0.35);
  }
  
  .toolbar {
   display: flex;
   gap: 8px;
   margin-bottom: 8px;
   position: relative;
  }
  
  input[type="text"] {
   font-family: var(--font-ui);
   padding: 7px 10px;
   border-radius: var(--r-sm);
   border: 1px solid var(--border);
   background: var(--panel);
   color: var(--text);
   outline: none;
   font-size: 13px;
  }
  
  input[type="text"]:focus {
   border-color: var(--accent);
   box-shadow: 0 0 0 3px var(--accent-dim);
  }
  
  input::placeholder {
   color: var(--muted-2);
  }
  
  .symbol-input {
   flex: 1;
   min-width: 0;
  }
  
  button {
   font-family: var(--font-ui);
   background: var(--accent);
   border: none;
   padding: 7px 14px;
   border-radius: var(--r-sm);
   color: #06101f;
   cursor: pointer;
   font-weight: 600;
   font-size: 13px;
   white-space: nowrap;
   transition: filter 0.12s ease, opacity 0.12s ease;
  }
  
  button:hover:not(:disabled) {
   filter: brightness(1.1);
  }
  
  button:disabled {
   opacity: 0.4;
   cursor: not-allowed;
  }
  
  .table-scroll-wrapper {
   overflow-x: auto;
   overflow-y: visible;
   max-height: none;
   border: 1px solid var(--border);
   border-radius: var(--r-md);
   -webkit-overflow-scrolling: touch;
  }
  
  table {
   width: 100%;
   border-collapse: collapse;
   background: var(--panel);
   font-size: 11px;
  }
  
  th,
  td {
   padding: 6px 7px;
   text-align: left;
   white-space: nowrap;
   font-size: 10.5px;
  }
  
  th.numeric,
  td.numeric {
   text-align: right;
   font-family: var(--font-mono);
   font-variant-numeric: tabular-nums;
  }
  
  th.center,
  td.center {
   text-align: center;
  }
  
  th {
   background: var(--panel-2);
   font-weight: 600;
   font-size: 9px;
   text-transform: uppercase;
   letter-spacing: 0.04em;
   color: var(--muted);
   position: sticky;
   top: 0;
   border-bottom: 1px solid var(--border);
   padding: 8px 10px;
  }
  
  th.sortable {
   cursor: pointer;
   user-select: none;
  }
  
  th.sortable:hover {
   color: var(--text);
  }
  
  .sort-arrow {
   margin-left: 4px;
   color: var(--accent);
   font-weight: 700;
  }
  
  tbody tr.main-row {
   border-bottom: 1px solid var(--border);
   cursor: pointer;
   transition: background 0.12s ease;
   scroll-margin-top: 6px;
  }
  
  tbody tr.main-row:hover {
   background: rgba(255, 255, 255, 0.025);
  }
  
  tbody tr.main-row:last-child {
   border-bottom: none;
  }
  
  td[data-col="coin"] {
   overflow: hidden;
   text-overflow: ellipsis;
  }
  
  .coin-name {
   font-weight: 600;
   font-size: 10px;
   overflow: hidden;
   text-overflow: ellipsis;
  }
  
  .health-dot {
   width: 6px;
   height: 6px;
   border-radius: 50%;
   display: inline-block;
   margin-right: 4px;
   vertical-align: 1px;
   flex-shrink: 0;
  }
  
  .target-input {
   width: 82px;
   text-align: right;
   padding: 3px 4px;
   font-size: 10px;
   font-family: inherit;
   line-height: normal;
   box-sizing: border-box;
   -webkit-text-size-adjust: 100%;
   text-size-adjust: 100%;
  }
  
  .target-display {
   display: inline-block;
   padding: 3px 2px;
   cursor: pointer;
   border-bottom: 1px dashed var(--border);
  }
  
  .target-display.target-unset {
   color: var(--muted-2);
  }
  
  .gain-pos {
   color: var(--buy);
   font-weight: 600;
  }
  
  .gain-neg {
   color: var(--sell);
   font-weight: 600;
  }
  
  .gain-na {
   color: var(--muted-2);
  }
  
  .signal-cell {
   min-width: 0;
  }
  
  .signal-wrap {
   display: flex;
   align-items: center;
   justify-content: center;
   gap: 3px;
  }
  
  .empty-row td {
   text-align: center;
   color: var(--muted-2);
   padding: 32px 12px;
  }
  
  .detail-box {
   padding: 10px;
   transition: opacity 0.1s ease;
   touch-action: pan-y;
  }
  
  .detail-box.swipe-out {
   opacity: 0.3;
  }
  
  .detail-reason {
   font-size: 11.5px;
   color: var(--muted);
   line-height: 1.5;
   padding-top: 10px;
   border-top: 1px solid var(--border);
   overflow-wrap: anywhere;
  }
  
  .detail-remove-btn {
   display: block;
   width: 100%;
   margin-top: 12px;
   background: var(--sell-dim);
   color: var(--sell);
   border: 1px solid rgba(255, 92, 114, 0.25);
  }
  
  .dca-log-row {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 10px;
   margin-top: 10px;
   padding-top: 10px;
   border-top: 1px solid var(--border);
   flex-wrap: wrap;
  }
  
  .dca-log-status {
   font-size: 11px;
   color: var(--muted-2);
  }
  
  .dca-log-actions {
   display: flex;
   gap: 6px;
   flex-shrink: 0;
  }
  
  .dca-log-btn {
   background: var(--panel);
   color: var(--dca);
   border: 1px solid rgba(34, 193, 217, 0.35);
   font-size: 11.5px;
   padding: 6px 12px;
  }
  
  .dca-log-clear-btn {
   background: transparent;
   color: var(--muted-2);
   border: 1px solid var(--border);
   font-size: 11.5px;
   padding: 6px 12px;
  }
  
  .chart-toggle-row {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 10px;
   margin-top: 10px;
   padding-top: 10px;
   border-top: 1px solid var(--border);
   flex-wrap: wrap;
  }
  
  .chart-toggle-btn {
   background: var(--panel);
   color: var(--accent);
   border: 1px solid rgba(76, 141, 255, 0.3);
   font-size: 11.5px;
   padding: 6px 12px;
  }
  
  .chart-external-link {
   font-size: 11px;
   color: var(--muted-2);
   text-decoration: none;
   white-space: nowrap;
  }
  
  .chart-external-link:hover {
   color: var(--accent);
  }
  
  .chart-container {
   display: none;
   margin-top: 10px;
   border-radius: var(--r-sm);
   overflow: hidden;
   border: 1px solid var(--border);
   min-height: 60px;
   max-width: 100%;
  }
  
  .chart-container>div {
   max-width: 100%;
   overflow: hidden;
  }
  
  .chart-loading {
   padding: 24px 12px;
   text-align: center;
   font-size: 11.5px;
   color: var(--muted-2);
  }
  
  #suggestBox {
   position: absolute;
   top: calc(100% + 4px);
   left: 0;
   width: calc(100% - 88px);
   z-index: 40;
   background: var(--panel-2);
   border: 1px solid var(--border);
   border-radius: var(--r-sm);
   max-height: 260px;
   overflow-y: auto;
   display: none;
   box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
  }
  
  .suggestion-item {
   padding: 8px 12px;
   cursor: pointer;
   font-size: 12.5px;
   border-bottom: 1px solid var(--border);
  }
  
  .suggestion-item:last-child {
   border-bottom: none;
  }
  
  .suggestion-item:hover {
   background: var(--accent-dim);
  }
  
  .suggestion-no-result {
   padding: 10px 12px;
   color: var(--muted-2);
   font-size: 12px;
  }
  
  .activity-log-container {
   position: fixed;
   bottom: 0;
   left: 0;
   width: 100%;
   z-index: 50;
   padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px));
   background: rgba(6, 10, 15, 0.97);
   border-top: 1px solid var(--border);
   backdrop-filter: blur(6px);
  }
  
  .status-line {
   display: flex;
   align-items: center;
   gap: 8px;
   font-family: var(--font-mono);
   font-size: 11px;
   color: var(--muted-2);
   white-space: nowrap;
   overflow: hidden;
  }
  
  .status-line .sl-dot {
   width: 6px;
   height: 6px;
   border-radius: 50%;
   background: var(--muted-2);
   flex-shrink: 0;
   transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  
  .status-line span#statusLineText {
   flex: 1;
   min-width: 0;
   overflow: hidden;
   text-overflow: ellipsis;
   transition: color 0.3s ease;
  }
  
  .status-line.has-log {
   cursor: pointer
  }
  
  .sl-q {
   flex: none;
   padding: 1px 6px;
   border-radius: 999px;
   font-size: 9.5px;
   font-weight: 700;
   background: var(--accent-dim);
   color: var(--accent);
   border: 1px solid rgba(76, 141, 255, 0.3)
  }
  
  .sl-log-list {
   display: flex;
   flex-direction: column;
   margin-top: 6px
  }
  
  .sl-log-row {
   display: flex;
   align-items: flex-start;
   gap: 8px;
   padding: 6px 0;
   border-top: 1px solid var(--border);
   font-size: 11.5px;
   line-height: 1.35
  }
  
  .sl-log-row:first-child {
   border-top: 0
  }
  
  .sl-log-dot {
   width: 6px;
   height: 6px;
   border-radius: 50%;
   margin-top: 5px;
   flex-shrink: 0;
   background: var(--muted-2)
  }
  
  .sl-log-row.ok .sl-log-dot { background: var(--buy) }
  .sl-log-row.warn .sl-log-dot { background: var(--trim) }
  .sl-log-row.error .sl-log-dot { background: var(--sell) }
  
  .sl-log-t {
   font-family: var(--font-mono);
   font-size: 10px;
   color: var(--muted);
   white-space: nowrap;
   margin-top: 1px
  }
  
  .sl-log-m {
   flex: 1;
   min-width: 0;
   color: var(--text);
   overflow-wrap: anywhere
  }
  
  @keyframes taSpin {
   to {
    transform: rotate(360deg);
   }
  }
  
  .status-line.ok .sl-dot {
   background: var(--buy);
   box-shadow: 0 0 6px rgba(47, 213, 118, 0.6);
  }
  
  .status-line.ok span#statusLineText {
   color: var(--buy);
  }
  
  .status-line.warn .sl-dot {
   background: var(--trim);
   box-shadow: 0 0 6px rgba(232, 166, 59, 0.6);
  }
  
  .status-line.warn span#statusLineText {
   color: var(--trim);
  }
  
  .status-line.error .sl-dot {
   background: var(--sell);
   box-shadow: 0 0 6px rgba(255, 92, 114, 0.6);
  }
  
  .status-line.error span#statusLineText {
   color: var(--sell);
  }
  
  .status-line.ambient span#statusLineText {
   color: var(--muted-2);
  }
  
  .discover-section {
   margin-top: 10px;
   padding: 10px 12px;
   border-radius: var(--r-md);
   border: 1px solid var(--border);
   background: var(--panel);
  }
  
  .discover-head {
   display: flex;
   align-items: center;
   justify-content: space-between;
   gap: 10px;
   flex-wrap: wrap;
  }
  
  .discover-copy {
   min-width: 0;
  }
  
  .discover-title {
   font-size: 9.5px;
   font-weight: 700;
   letter-spacing: 0.06em;
   text-transform: uppercase;
   color: var(--muted);
  }
  
  .discover-sub {
   font-size: 11px;
   color: var(--muted-2);
   margin-top: 2px;
  }
  
  #discoverBtn {
   display: inline-flex;
   align-items: center;
   justify-content: center;
   gap: 6px;
   padding: 7px 12px;
   border-radius: 8px;
   background: linear-gradient(135deg, rgba(34, 193, 217, 0.14), var(--panel-2));
   color: var(--dca);
   border: 1px solid rgba(34, 193, 217, 0.36);
   font-size: 12px;
  }
  
  #discoverBtn svg,
  .data-actions button svg {
   width: 14px;
   height: 14px;
   fill: none;
   stroke: currentColor;
   stroke-width: 2;
   stroke-linecap: round;
   stroke-linejoin: round;
   flex-shrink: 0;
  }
  
  #discoverBtn:disabled {
   color: var(--muted);
   border-color: var(--border);
  }
  
  .discover-card {
   border: 1px solid var(--border);
   border-radius: 10px;
   padding: 10px 12px;
   margin-top: 10px;
   background: var(--panel);
  }
  
  .discover-card .dc-top {
   display: flex;
   justify-content: space-between;
   align-items: center;
   gap: 8px;
  }
  
  .discover-card .dc-symbol {
   font-weight: 700;
  }
  
  .discover-card .dc-name {
   color: var(--muted);
   font-size: 12px;
   margin-left: 6px;
  }
  
  .discover-card .dc-add {
   padding: 4px 10px;
   font-size: 13px;
  }
  
  .discover-card .dc-reason {
   color: var(--muted);
   font-size: 12px;
   margin-top: 6px;
   line-height: 1.4;
  }
  
  .discover-empty {
   color: var(--muted);
   font-size: 13px;
   padding: 10px 2px;
  }
  
  /* ===== v2 layout: compact table, signal chips, redesigned expanded row ===== */
  :root {
   --track: #222d3a;
   --ring: rgba(76, 141, 255, 0.55);
  }
  
  table {
   table-layout: fixed
  }
  
  th {
   font-size: 8.5px;
   letter-spacing: 0;
   padding: 7px 4px
  }
  
  td {
   padding: 5px 4px
  }
  
  th:first-child,
  td:first-child {
   padding-left: 9px
  }
  
  th:last-child,
  td:last-child {
   padding-right: 8px
  }
  
  td.price-cell {
   line-height: 1.15
  }
  
  .px-main {
   display: block;
   font-size: 10px;
   font-weight: 600
  }
  
  .price-change-24h {
   display: block;
   font-size: 8.5px;
   font-weight: 600;
   margin-top: 1px;
   line-height: 1.1
  }
  
  .price-change-24h em {
   font-style: normal;
   color: var(--muted-2);
   font-weight: 500
  }
  
  .price-change-24h.chg-roll {
   color: var(--muted)
  }
  
  td.numeric {
   font-size: 10px
  }
  
  .target-cell {
   cursor: pointer
  }
  
  tbody tr.main-row.row-unhealthy td:not(.signal-cell) {
   opacity: 0.48;
   transition: opacity 0.2s ease
  }
  .cp-sheet.cp-unhealthy .cp-titles,
  .cp-sheet.cp-unhealthy #cpMetaText,
  .cp-sheet.cp-unhealthy .cp-price .px-main > :not(.cp-stale-tag):not(.health-dot),
  .cp-sheet.cp-unhealthy .cp-price .price-change-24h,
  .cp-sheet.cp-unhealthy .cp-target,
  .cp-sheet.cp-unhealthy .cp-body .dx > :not(.dx-acts):not(.chart-container),
  .cp-sheet.cp-unhealthy .cp-body .detail-reason {
   opacity: 0.48;
   transition: opacity 0.2s ease
  }
  .cp-stale-tag {
   margin-left: 6px;
   font-size: 9.5px;
   font-weight: 700;
   color: var(--trim);
   font-family: var(--font-ui)
  }

   const BINANCE_HOSTS = [
    'https://api-gcp.binance.com',
    'https://data-api.binance.vision',
    'https://api.binance.com'
   ];
   let binanceActiveHost = BINANCE_HOSTS[0];

   async function binanceFetch(path, { timeoutMs = 4000 } = {}) {
    if (navigator.onLine === false) throw new Error('OFFLINE');
    const orderedHosts = [binanceActiveHost, ...BINANCE_HOSTS.filter(h => h !== binanceActiveHost)];
    let lastErr = null;
    for (const host of orderedHosts) {
     const controller = new AbortController();
     const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
     const start = performance.now();
     try {
      const res = await fetch(`${host}${path}`, { signal: controller.signal });
      const latencyMs = performance.now() - start;
      if (res.status === 429 || res.status === 418) {
       // Never fail over to another Binance host on rate-limit/ban; IP limits are shared.
       throw new Error(`HTTP_ERROR:${res.status}`);
      }
      if (!res.ok) {
       lastErr = new Error(`HTTP_ERROR:${res.status}`);
       continue;
      }
      binanceActiveHost = host;
      return { res, host, latencyMs };
     } catch (err) {
      lastErr = err;
      if ((err.message || '').includes('429') || (err.message || '').includes('418')) throw err;
     } finally {
      clearTimeout(timeoutId);
     }
    }
    throw lastErr || new Error('BINANCE_FETCH_FAILED');
   }

   const FX_CACHE_KEY = 'shortfall_fx_cache';
   const FX_LIVE_TTL_MS = 30 * 60000;
   // GitHub Pages JSON written by the usdt-proxy repo's workflow. If this is emptied, a URL saved earlier in this browser is used.
   //const USDT_INR_JSON_URL = 'https://ahmadwasim88-oss.github.io/usdt-proxy/usdt-inr.json';
   const USDT_INR_JSON_URL = 'https://ahmadwasim88-oss.github.io/Crypto-tools/usdt-inr.json';
   const FX_AUTO_FRESH_MS = 45 * 60000; // the proxy refreshes every ~30 min, so up to 45 min old = fresh
   const FX_AUTO_STALE_MS = 2 * 3600000; // 45 min – 2 h = delayed; beyond = stale
   let fxCacheMem = null;
   let fxLiveInFlight = null;

   function getFxCache() {
    if (!fxCacheMem) {
     fxCacheMem = loadJSON(FX_CACHE_KEY, { liveRate: null, liveDate: null, liveFetchedAt: 0, multiplier: 1 });
     if (!(fxCacheMem.multiplier > 0)) fxCacheMem.multiplier = 1;
    }
    return fxCacheMem;
   }

   function getFxMultiplier() {
    const m = getFxCache().multiplier;
    return (Number.isFinite(m) && m > 0) ? m : 1;
   }

   function saveFxCache() {
    if (fxCacheMem) lsSet(FX_CACHE_KEY, JSON.stringify(fxCacheMem));
   }

   const pegTickers = {};
   let usdtPegStatus = { warned: false, impliedUsdt: 1, devPct: 0, detail: '' };
   let lastPegAlertAt = 0;
   let signalsHydrated = false;
   const prevSignalById = {};
   const alertCooldownUntil = {};

   function getActivePegPairs() {
    if (!Array.isArray(coinList) || !coinList.length) return ['USDCUSDT'];
    const activeSet = new Set(coinList.map(c => c.id));
    const list = PEG_CANDIDATES.filter(p => activeSet.has(p));
    return list.length ? list : ['USDCUSDT'];
   }

   function evaluateUsdtPeg() {
    const now = Date.now();
    const pairs = getActivePegPairs();
    const readings = [];
    for (const sym of pairs) {
     const r = pegTickers[sym];
     if (r && r.price > 0 && (now - r.ts) < 5 * 60000) {
      const implied = 1 / r.price;
      readings.push({ sym: sym.replace(/USDT$/, ''), implied, devPct: (implied - 1) * 100 });
     }
    }
    if (!readings.length) { usdtPegStatus = { warned: false, impliedUsdt: 1, devPct: 0, detail: '' }; return; }
    const threshold = readings.length >= 2 ? PEG_WARN_DEV_PCT : PEG_SINGLE_DEV_PCT;
    const high = readings.filter(x => x.devPct >= threshold);
    const low = readings.filter(x => x.devPct <= -threshold);
    const needCount = readings.length >= 2 ? 2 : 1;
    const triggered = high.length >= needCount ? high : (low.length >= needCount ? low : []);
    const wasWarned = usdtPegStatus.warned;
    if (triggered.length) {
     const avgImplied = triggered.reduce((s, x) => s + x.implied, 0) / triggered.length;
     const avgDev = (avgImplied - 1) * 100;
     const detail = triggered.map(x => `${x.sym}/USDT`).join(', ');
     usdtPegStatus = { warned: true, impliedUsdt: avgImplied, devPct: avgDev, detail };
     if (!wasWarned && signalsHydrated && (now - lastPegAlertAt) > 15 * 60000) {
      lastPegAlertAt = now;
      triggerAlertNotice('USDT Peg Shift', `USDT ~${avgImplied.toFixed(3)} (${avgDev >= 0 ? '+' : ''}${avgDev.toFixed(2)}% vs ${detail}) — check exchange USDT/INR.`);
     }
    } else {
     const avgImplied = readings.reduce((s, x) => s + x.implied, 0) / readings.length;
     usdtPegStatus = { warned: false, impliedUsdt: avgImplied, devPct: (avgImplied - 1) * 100, detail: readings.map(x => x.sym).join('/') };
    }
    updateFxBadge();
   }

   function updatePegTicker(sym, price) {
    if (!(price > 0)) return;
    pegTickers[sym] = { price, ts: Date.now() };
    evaluateUsdtPeg();
   }

   async function checkUsdtPegRest() {
    try {
     const pairs = getActivePegPairs();
     const q = encodeURIComponent(JSON.stringify(pairs));
     const { res } = await binanceFetch(`/api/v3/ticker/24hr?symbols=${q}`, { timeoutMs: 6000 });
     const data = await res.json();
     const list = Array.isArray(data) ? data : [data];
     for (const t of list) {
      if (t?.symbol && Number(t.lastPrice) > 0) pegTickers[t.symbol] = { price: Number(t.lastPrice), ts: Date.now() };
     }
     evaluateUsdtPeg();
    } catch (e) {}
   }

   function updateFxBadge() {
    const badge = document.getElementById('fxRateBadge');
    if (!badge) return;
    const bank = fxRateForDate(null);
    const mult = getFxMultiplier();
    if (!(bank > 0)) {
     badge.textContent = 'USDT ₹—';
     badge.classList.remove('calibrated', 'peg-warn');
     return;
    }
    const eff = bank * mult;
    const isCal = Math.abs(mult - 1) >= 0.0005;
    if (usdtPegStatus.warned) {
     badge.textContent = `⚠ USDT ~${usdtPegStatus.impliedUsdt.toFixed(3)} · ₹${eff.toFixed(2)}`;
     badge.classList.add('peg-warn');
     badge.classList.remove('calibrated');
     badge.title = `USDT shifted ${usdtPegStatus.devPct >= 0 ? '+' : ''}${usdtPegStatus.devPct.toFixed(2)}% vs ${usdtPegStatus.detail} — check your Indian exchange USDT/INR and tap to recalibrate.`;
    } else {
     const fxTag = getFxCache().manual ? ' · manual' : (fxAutoStatus().state === 'stale' ? ' · stale' : '');
     badge.textContent = (isCal ? `USDT ₹${eff.toFixed(2)} · ×${mult.toFixed(3)}` : `USDT ₹${bank.toFixed(2)}`) + fxTag;
     badge.classList.remove('peg-warn');
     badge.classList.toggle('calibrated', isCal);
     badge.title = 'Tap for USDT/INR rate source and freshness';
    }
   }

   function triggerAlertNotice(title, body) {
    setActivityStatus(`${title}: ${body}`, 'warn');
   }

   function checkSignalTransitions(ids) {
    const now = Date.now();
    const hits = [];
    for (const id of ids) {
     const item = portfolioMap[id];
     const sigObj = holdingSignalCache[id];
     if (!item || !sigObj || sigObj.signal === 'NA') continue;
     const prev = prevSignalById[id];
     const cur = sigObj.signal;
     prevSignalById[id] = cur;
     if (!signalsHydrated) continue;
     if (prev && prev !== cur && ALERT_SIGNALS.has(cur) && now >= (alertCooldownUntil[id] || 0)) {
      alertCooldownUntil[id] = now + ALERT_COOLDOWN_MS;
      const px = pricesCache[id];
      const shortSig = SIGNAL_LABELS_SHORT[cur] || cur;
      hits.push({ symbol: item.symbol, shortSig, px, reason: sigObj.reason });
     }
    }
    if (hits.length === 1) {
     const h = hits[0];
     triggerAlertNotice(`${h.symbol} → ${h.shortSig}`, `${h.px != null ? formatINR(h.px, pricePrecisionFor(h.px)) + ' · ' : ''}${h.reason}`);
    } else if (hits.length > 1) {
     const summary = hits.map(h => `${h.symbol} → ${h.shortSig}`).join(', ');
     triggerAlertNotice(`${hits.length} signals`, summary);
    }
   }
   
   async function fetchWithTimeout(url, timeoutMs = 6000) {
    if (navigator.onLine === false) throw new Error('OFFLINE');
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
    try {
     const res = await fetch(url, { signal: controller.signal });
     if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
     return await res.json();
    } finally {
     clearTimeout(timeoutId);
    }
   }

   async function ensureUsdInrRate({ force = false } = {}) {
    const c = getFxCache();
    // Bank forex is only an anchor: price = Binance USDT price × anchor × multiplier. While the exchange JSON sync is healthy
    // (or a manual rate is set) the anchor stays frozen, so the USDT/INR rate in use never drifts on its own.
    const anchored = c.liveRate > 0 && (c.manual || ['fresh', 'delayed'].includes(fxAutoStatus().state));
    if (!force && c.liveRate > 0 && (anchored || (Date.now() - (c.liveFetchedAt || 0)) < FX_LIVE_TTL_MS)) {
     updateFxBadge();
     return c.liveRate;
    }
    if (fxLiveInFlight) return fxLiveInFlight;
    // Every cached INR value (prices, candles, TA closes) uses ONE rate, so when the anchor moves they are rescaled together.
    const apply = (rate, date) => {
     const old = c.liveRate;
     c.liveRate = rate;
     c.liveDate = date || new Date().toISOString().slice(0, 10);
     c.liveFetchedAt = Date.now();
     saveFxCache();
     updateFxBadge();
     if (old > 0 && Math.abs(rate / old - 1) >= 1e-9) rescaleCachesByMultiplierRatio(rate / old);
     return rate;
    };
    fxLiveInFlight = (async () => {
     const sources = [
      ['https://api.frankfurter.dev/v2/rate/usd/inr', j => [j?.rate, j?.date]],
      ['https://open.er-api.com/v6/latest/USD', j => [j?.rates?.INR, null]]
     ];
     for (const [url, pick] of sources) {
      try {
       const [rate, date] = pick(await fetchWithTimeout(url, 5000));
       if (Number.isFinite(rate) && rate > 0) return apply(rate, date);
      } catch (e) {}
     }
     updateFxBadge();
     return c.liveRate > 0 ? c.liveRate : null;
    })();
    try { return await fxLiveInFlight; } finally { fxLiveInFlight = null; }
   }

/* AUTO_EXCHANGE_USDT_PATCH_START */
   let lastAutoCalibrateAt = 0;
   let autoCalibrateInFlight = null;

   function getUsdtJsonUrl() {
    let u = (USDT_INR_JSON_URL || getFxCache().customProxyUrl || '').trim();
    if (u && !u.endsWith('.json')) u = u.replace(/\/+$/, '') + '/usdt-inr.json';
    return u;
   }

   // Optional update time written by the JSON itself (ISO string, epoch seconds or epoch ms).
   function parseDataTs(j) {
    const raw = j?.updatedAt ?? j?.updated_at ?? j?.updated ?? j?.timestamp ?? j?.ts ?? j?.time;
    if (raw == null) return null;
    let t = typeof raw === 'number' ? raw : (/^\d+(\.\d+)?$/.test(String(raw)) ? Number(raw) : Date.parse(raw));
    if (!isFinite(t)) return null;
    if (t < 1e12) t *= 1000;
    return (t > 1e12 && t <= Date.now() + 5 * 60000) ? t : null;
   }

   async function fetchIndianExchangeUsdtRate() {
    const url = getUsdtJsonUrl();
    if (!url) throw new Error('No JSON URL set');
    const j = await fetchWithTimeout(url + (url.includes('?') ? '&' : '?') + '_=' + Date.now(), 7000);
    const p = Number(j?.usdtInr);
    if (!(p > 0 && isFinite(p))) throw new Error('"usdtInr" missing or invalid in JSON');
    return { price: p, source: j.source || 'GitHub Pages', dataTs: parseDataTs(j) };
   }

   // Freshness is judged on the source's own update time when the JSON has one, else on when we last fetched it.
   function fxAutoStatus() {
    const c = getFxCache();
    if (!getUsdtJsonUrl()) return { state: 'off' };
    if (!c.lastAutoAt) return { state: 'never' };
    const basis = c.lastAutoDataTs || c.lastAutoAt;
    const age = Date.now() - basis;
    return { state: age <= FX_AUTO_FRESH_MS ? 'fresh' : age <= FX_AUTO_STALE_MS ? 'delayed' : 'stale', age, fromData: !!c.lastAutoDataTs };
   }

   function fxAgo(ms) {
    return ms < 90000 ? 'just now' : ms < 3600000 ? `${Math.round(ms / 60000)} min ago` : ms < 86400000 ? `${(ms / 3600000).toFixed(1).replace(/\.0$/, '')} h ago` : `${Math.round(ms / 86400000)} d ago`;
   }

   function fxCardHTML() {
    const c = getFxCache(), bank = fxRateForDate(null) || 0, mult = getFxMultiplier(), url = getUsdtJsonUrl(), st = fxAutoStatus();
    const when = ts => `${fxAgo(Date.now() - ts)} <span class="fx-sub">· ${formatDateTime(ts)}</span>`;
    let host = '';
    try { const u = new URL(url); host = u.host + u.pathname; } catch (e) {}
    const pill = c.manual ? ['Manual', 'var(--accent)'] :
     ({ fresh: ['Fresh', 'var(--buy)'], delayed: ['Delayed', 'var(--trim)'], stale: ['Stale', 'var(--sell)'], never: ['Not synced', 'var(--trim)'], off: ['Bank forex', 'var(--muted)'] })[st.state];
    const row = (k, v, cls = '') => `<div class="fx-row"><span class="fx-k">${k}</span><span class="fx-v ${cls}">${v}</span></div>`;
    const rows = [row('Mode', c.manual ? 'Manual rate — auto-sync paused' : url ? 'Auto-sync, about every 5 min' : 'Bank forex only (no source set)')];
    if (url) rows.push(row('Source', `${escHtml(c.autoSource || '—')} <span class="fx-sub">· ${escHtml(host)}</span>`));
    if (url && c.lastAutoAt) {
     if (c.lastAutoDataTs) rows.push(row('Data updated', when(c.lastAutoDataTs)));
     rows.push(row('Last synced', when(c.lastAutoAt)));
     rows.push(row('Source rate', `₹${Number(c.lastAutoRate).toFixed(2)}`));
     if (!c.lastAutoDataTs) rows.push(row('Freshness', 'from last fetch (JSON has no update time)', 'fx-sub'));
    }
    if (url && c.lastAutoErr) rows.push(row('Last attempt', `failed ${fxAgo(Date.now() - (c.lastAutoTryAt || Date.now()))} — ${escHtml(c.lastAutoErr)}`, 'fx-bad'));
    rows.push(row('Anchor USD/INR', `₹${bank.toFixed(2)}`));
    rows.push(row('Multiplier', `×${mult.toFixed(4)} (${mult >= 1 ? '+' : ''}${((mult - 1) * 100).toFixed(2)}% vs bank)`));
    if (usdtPegStatus.warned) rows.push(row('USDT peg', `⚠ ~${usdtPegStatus.impliedUsdt.toFixed(3)} (${usdtPegStatus.devPct >= 0 ? '+' : ''}${usdtPegStatus.devPct.toFixed(2)}%) vs ${escHtml(usdtPegStatus.detail)}`, 'fx-bad'));
    return `<div class="fx-head"><div><div class="fx-big">₹${(bank * mult).toFixed(2)}</div><div class="fx-sub">USDT/INR rate in use</div></div><span class="fx-pill" style="--c:${pill[1]}">${pill[0]}</span></div>${rows.join('')}`;
   }

   async function autoCalibrateUsdtRate({ force = false, silent = false } = {}) {
    const now = Date.now();
    const c = getFxCache();
    if (!getUsdtJsonUrl()) return false;
    if (c.manual && !force) return false;
    if (!force && now - lastAutoCalibrateAt < 5 * 60000) return false;
    if (autoCalibrateInFlight) return autoCalibrateInFlight;
    lastAutoCalibrateAt = now;
    autoCalibrateInFlight = (async () => {
     try {
      const bank = (await ensureUsdInrRate()) || fxRateForDate(null);
      if (!(bank > 0)) throw new Error('Bank USD/INR unavailable');
      const reading = await fetchIndianExchangeUsdtRate();
      if (!(reading.price / bank >= 0.85 && reading.price / bank <= 1.5)) throw new Error(`rate ₹${reading.price.toFixed(2)} is implausible vs bank ₹${bank.toFixed(2)} — ignored`);
      const oldMult = getFxMultiplier();
      const newMult = reading.price / bank;
      c.manual = false;
      c.autoSource = reading.source;
      c.lastAutoRate = reading.price;
      c.lastAutoAt = Date.now();
      c.lastAutoDataTs = reading.dataTs;
      c.lastAutoErr = null;
      if (Math.abs(newMult - oldMult) >= 0.001) {
       const ratio = newMult / oldMult;
       c.multiplier = newMult;
       saveFxCache();
       updateFxBadge();
       rescaleCachesByMultiplierRatio(ratio);
       if (!silent) setActivityStatus(`USDT auto-synced: ₹${reading.price.toFixed(2)} (${reading.source})`, 'ok');
       return true;
      }
      saveFxCache();
      updateFxBadge();
      return false;
     } catch (e) {
      c.lastAutoErr = e.name === 'AbortError' ? 'timed out' : (e.message || 'fetch failed');
      c.lastAutoTryAt = Date.now();
      saveFxCache();
      updateFxBadge();
      return false;
     } finally { autoCalibrateInFlight = null; }
    })();
    return autoCalibrateInFlight;
   }
   /* AUTO_EXCHANGE_USDT_PATCH_END */

   // One rate for every date: old candles, ATH and ATL are Binance USDT values converted at today's rate,
   // so percentages, RSI and EMAs are pure-USDT and never pick up bank-forex drift.
   function fxRateForDate() {
    const r = getFxCache().liveRate;
    return r > 0 ? r : null;
   }

   function fxRateForTs() {
    return fxRateForDate();
   }

   function effectiveFxRateForTs(ts) {
    const base = fxRateForTs(ts);
    return base > 0 ? base * getFxMultiplier() : null;
   }

   function rescaleCachesByMultiplierRatio(ratio) {
    if (!(ratio > 0) || Math.abs(ratio - 1) < 1e-9) return;
    const scaleVal = (v) => (v != null && isFinite(v)) ? v * ratio : v;
    Object.keys(pricesCache).forEach(id => { pricesCache[id] = scaleVal(pricesCache[id]); });
    Object.keys(marketDataCache).forEach(id => {
     const m = marketDataCache[id];
     if (!m || m.notFound) return;
     m.current_price = scaleVal(m.current_price);
     m.low_24h = scaleVal(m.low_24h);
     m.high_24h = scaleVal(m.high_24h);
     m.ath = scaleVal(m.ath);
     m.atl = scaleVal(m.atl);
     m.total_volume = scaleVal(m.total_volume);
     m.bidDepthInr = scaleVal(m.bidDepthInr);
     m.askDepthInr = scaleVal(m.askDepthInr);
    });
    Object.keys(dayCandleCache).forEach(id => {
     const d = dayCandleCache[id];
     if (!d || d.invalid) return;
     d.open = scaleVal(d.open);
     d.high = scaleVal(d.high);
     d.low = scaleVal(d.low);
    });
    Object.keys(taCache).forEach(id => {
     const t = taCache[id];
     if (!t) return;
     t.emaLong = scaleVal(t.emaLong);
     t.rollingLow = scaleVal(t.rollingLow);
     t.rollingHigh = scaleVal(t.rollingHigh);
     if (Array.isArray(t.closes)) t.closes = t.closes.map(scaleVal);
     if (Array.isArray(t.highs)) t.highs = t.highs.map(scaleVal);
     if (Array.isArray(t.lows)) t.lows = t.lows.map(scaleVal);
     if (t.year) { t.year.high = scaleVal(t.year.high); t.year.low = scaleVal(t.year.low); }

    if (!Array.isArray(wk) || !wk.length) return null;
    let maxK = wk[0], minK = wk[0];
    for (const k of wk) {

    if (Array.isArray(dHigh)) for (const k of dHigh) if (Number(k[2]) >= Number(exactHigh[2])) exactHigh = k;
    if (Array.isArray(dLow)) for (const k of dLow) if (Number(k[3]) <= Number(exactLow[3])) exactLow = k;

   function calcEMASeries(values, period) {
    if (values.length < period) return [];
    const k = 2 / (period + 1);
    const out = [];
    let ema = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
    out[period - 1] = ema;
    for (let i = period; i < values.length; i++) {
     ema = values[i] * k + ema * (1 - k);
     out[i] = ema;
    }
    return out;
   }
   
   function calcRSISeries(values, period) {

    const out = new Array(values.length).fill(null);
    let gains = 0,
     losses = 0;
    for (let i = 1; i <= period; i++) {
     const diff = values[i] - values[i - 1];
     if (diff >= 0) gains += diff;
     else losses -= diff;
    }
    let avgGain = gains / period,
     avgLoss = losses / period;
    out[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
    for (let i = period + 1; i < values.length; i++) {
     const diff = values[i] - values[i - 1];
     avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
     avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;

    }

     } else if (athPct <= athTiers.extreme && (yr == null || yr.pct <= yearTiers.extreme)) {
      signal = 'WAIT';
      colorKey = 'hold';
      strength = 30;
      reason = `${depth.toFixed(2)}% below ATH${yrNote} — extreme, but depth alone isn't a floor. Watching for a better entry.`;
     } else if (athPct <= athTiers.deep && (yr == null || yr.pct <= yearTiers.deep)) {
      signal = 'WAIT';
      colorKey = 'hold';
      strength = 25;
      reason = `${depth.toFixed(2)}% below ATH${yrNote} — deep discount, but that alone doesn't confirm the fall has stopped.`;
     } else if (athPct <= athTiers.moderate) {
      signal = 'WAIT';
      colorKey = 'hold';
      strength = 20;
      reason = `${depth.toFixed(2)}% below ATH${yrNote} — meaningful discount, but not yet a confirmed add.`;
     } else {
      signal = 'HOLD';
      colorKey = 'hold';
      strength = 35;
      reason = athPct <= athTiers.watch ?
       `Only ${depth.toFixed(2)}% below ATH — not a deep enough discount yet.` :
       `Within ${depth.toFixed(2)}% of ATH — holding for your target unless an extreme blow-off triggers.`;
     }
    } else {
     signal = 'HOLD';
     colorKey = 'hold';
     strength = 25;
     reason = `No ATH data yet to judge discount.`;
    }
    
    const atlWithinWindow = (atlDate && ta?.rollingLowWindowDays != null) ? daysSince(atlDate) <= ta.rollingLowWindowDays : false;
    // Folds in low_24h too, not just `cur` — without it, a coin that wicked below the rolling low
    // intraday and then bounced back before this render would show a 90-day low that's contradicted
    // by its own 24h range (low_24h < the "90-day" low), since the 24h window is always inside the
    // 90-day one.
    const effectiveLow = (ta?.rollingLow != null && cur != null) ?
     Math.min(ta.rollingLow, cur, (low24h != null ? low24h : Infinity), (atlWithinWindow && atlValue != null) ? atlValue : Infinity) :
     null;
    // True when something from today (live price or today's 24h-low reading) — not a confirmed prior
    // extreme — is what's setting the low, i.e. the coin is currently probing a fresh low, so this
    // figure will keep moving with price.
    const isLiveLow = (effectiveLow != null && cur != null) &&
     (effectiveLow === cur || effectiveLow === low24h) &&
     (ta?.rollingLow == null || effectiveLow < ta.rollingLow);
    // Days ago for whichever source actually set effectiveLow: today (live price or today's 24h low),
    // a historical ATL that folded in because it's both within the window and lower than the
    // rolling-close low, or the rolling-close low itself (position within the daily-closes window).
    const effectiveLowDaysAgo = isLiveLow ?
     0 :
     (atlWithinWindow && atlValue != null && effectiveLow === atlValue) ?
     daysSince(atlDate) :
     (ta?.rollingLowDaysAgo ?? null);
    
    // Same construction as effectiveLow above, mirrored for the high: fold in the all-time-high
    // when it falls within the rolling window, and let live price or today's 24h-high reading set a
    // fresh intraday high (same reasoning as low24h above — the 24h window can't exceed the 90-day one).
    const athWithinWindow = (athDate && ta?.rollingLowWindowDays != null) ? daysSince(athDate) <= ta.rollingLowWindowDays : false;
    const effectiveHigh = (ta?.rollingHigh != null && cur != null) ?
     Math.max(ta.rollingHigh, cur, (high24h != null ? high24h : -Infinity), (athWithinWindow && athValue != null) ? athValue : -Infinity) :
     null;
    const isLiveHigh = (effectiveHigh != null && cur != null) &&
     (effectiveHigh === cur || effectiveHigh === high24h) &&
     (ta?.rollingHigh == null || effectiveHigh > ta.rollingHigh);
    const effectiveHighDaysAgo = isLiveHigh ?
     0 :
     (athWithinWindow && athValue != null && effectiveHigh === athValue) ?
     daysSince(athDate) :
     (ta?.rollingHighDaysAgo ?? null);
    const low24Set = isLiveLow && effectiveLow !== cur;
    const high24Set = isLiveHigh && effectiveHigh !== cur;
    const lowDayK = effectiveLowDaysAgo;
    const highDayK = effectiveHighDaysAgo;
    const taStaleGap = ta?.closesEndTs ? Math.max(0, daysSince(new Date(ta.closesEndTs).toISOString()) - 1) : 0;
    const lowRsi = rsiAtExtreme(liveRsiSeries, lowDayK, isLiveLow, taStaleGap);
    const highRsi = rsiAtExtreme(liveRsiSeries, highDayK, isLiveHigh, taStaleGap);
    // ---- Single source of truth for window extremes and the RSI on their candle ----
    // Every window (90d / 180d / 365d / all-time) picks its low and high from the same candidate list and
    // gets its RSI from ONE routine, so the same extreme can never show two different RSI values, and
    // the add/swing gates read these exact objects. A longer-window candidate only replaces a shorter
    // one if it is genuinely more extreme (beyond data-source noise, EXTREME_TOL), never for a re-measure
    // of the same candle.
    const EXTREME_TOL = 5e-4;
    const liveRsiNow = rsiAtExtreme(liveRsiSeries, 0, true);
    const rsiOf = c => {
     if (c.live) return liveRsiNow;
     const cl = ta?.closes;
     if (c.k == null || !cl || !cl.length || c.k > cl.length) return null; // older than the data we hold
     return rsiAtExtreme(liveRsiSeries, c.k, false, taStaleGap);
    };
    const pickExtreme = (cands, isLow) => {
     let best = null;
     for (const c of cands) {
      if (!c || c.v == null || isNaN(c.v)) continue;
      if (!best || (isLow ? c.v < best.v * (1 - EXTREME_TOL) : c.v > best.v * (1 + EXTREME_TOL))) best = c;
     }
     return best && { ...best, rsi: best.rsi !== undefined ? best.rsi : rsiOf(best) };
    };
    // The 90d extreme is the authoritative candidate (its date/RSI are already resolved above).
    const effLowC = effectiveLow != null ? { v: effectiveLow, k: lowDayK, live: isLiveLow, r24: low24Set, rsi: lowRsi } : null;
    const effHighC = effectiveHigh != null ? { v: effectiveHigh, k: highDayK, live: isLiveHigh, r24: high24Set, rsi: highRsi } : null;
    const atlK = atlDate ? daysSince(atlDate) : null,
     athK = athDate ? daysSince(athDate) : null;
    const atlC = atlValue != null && atlK != null ? { v: atlValue, k: isLiveAtl ? 0 : atlK, live: !!isLiveAtl } : null;
    const athC = athValue != null && athK != null ? { v: athValue, k: isLiveAth ? 0 : athK, live: !!isLiveAth } : null;
    const buildWin = N => {
     const cl = ta?.closes;
     if (!cl || !cl.length || cur == null) return null;
     const w = cl.slice(-N),
      cLo = Math.min(...w),
      cHi = Math.max(...w);
     const yrLow = (yr && yr.lowDaysAgo != null && yr.lowDaysAgo <= N) ? { v: yr.low, k: yr.lowDaysAgo, live: yr.lowDaysAgo === 0 } : null;
     const yrHigh = (yr && yr.highDaysAgo != null && yr.highDaysAgo <= N) ? { v: yr.high, k: yr.highDaysAgo, live: yr.highDaysAgo === 0 } : null;
     const winExt = N === 180 ? ta?.win180Ext : (N === YEAR_HIGH_DAYS ? ta?.year : null);
     const winExtLow = winExt ? { v: winExt.low, k: winExt.lowDaysAgo, live: false } : null;
     const winExtHigh = winExt ? { v: winExt.high, k: winExt.highDaysAgo, live: false } : null;
     return {
      n: w.length,
      short: cl.length < N - 5, // Binance history shorter than this window: it only covers the pair's life since listing
      lo: pickExtreme([effLowC, winExtLow, yrLow, atlK != null && atlK <= N ? atlC : null, { v: cLo, k: w.length - w.indexOf(cLo), live: false }], true),
      hi: pickExtreme([effHighC, winExtHigh, yrHigh, athK != null && athK <= N ? athC : null, { v: cHi, k: w.length - w.indexOf(cHi), live: false }], false)
     };
    };
    const win180 = buildWin(180);
    const win365 = buildWin(YEAR_HIGH_DAYS);
    // Gate references: the shortest window whose extreme was set at an RSI meeting THIS coin's own
    // threshold; if none qualifies, the window whose extreme is closest to qualifying (RSI-wise).
    const w90 = ta?.rollingLowWindowDays ?? DCA_DIP_WINDOW_DAYS;
    const osThrG = ta?.rsiOversoldThreshold ?? RSI_OVERSOLD,
     obThrG = ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT;
    const lowCands = [],
     highCands = [];
    if (effLowC) lowCands.push({ w: w90, v: effLowC.v, rsi: effLowC.rsi });
    if (effHighC) highCands.push({ w: w90, v: effHighC.v, rsi: effHighC.rsi });
    if (win180 && win180.n > w90 + 5) { if (win180.lo) lowCands.push({ w: 180, v: win180.lo.v, rsi: win180.lo.rsi }); if (win180.hi) highCands.push({ w: 180, v: win180.hi.v, rsi: win180.hi.rsi }); }
    if (win365 && !win365.short) { if (win365.lo) lowCands.push({ w: YEAR_HIGH_DAYS, v: win365.lo.v, rsi: win365.lo.rsi }); if (win365.hi) highCands.push({ w: YEAR_HIGH_DAYS, v: win365.hi.v, rsi: win365.hi.rsi }); }
    const qLow = pickRefWindow(lowCands, osThrG + REF_LOW_RSI_MARGIN, true);
    const qHigh = pickRefWindow(highCands, obThrG, false);
    const gateWindow = qLow ? qLow.w : w90,
     gateLow = qLow ? qLow.v : effectiveLow;
    const gateHighWindow = qHigh ? qHigh.w : w90,
     gateHigh = qHigh ? qHigh.v : effectiveHigh;
    
    const isDiscountCandidate = signal === 'WAIT';
    let addReasonShown = false; // true when `reason` below was written by the add pipeline
    if (isDiscountCandidate) {
     const relStrength = relStrengthVsBtc;
     const relStrengthBonus = relStrength == null ? 0 : Math.max(REL_STRENGTH_MIN_BONUS, Math.min(REL_STRENGTH_MAX_BONUS, relStrength / REL_STRENGTH_SCALE));
     const relStrengthNote = relStrength == null ?
      '' :
      ` ${relStrength > 0 ? 'Outperforming' : 'Underperforming'} BTC (${relStrength >= 0 ? '+' : ''}${relStrength.toFixed(2)}pp over ${REL_STRENGTH_WINDOW_DAYS}d) — ${relStrength > 0 ? 'capital may already be rotating in.' : 'weight this accordingly.'}`;
     
     if (ta && ta.rollingLow != null && cur != null) {
      addReasonShown = true;
      const aboveLow = (cur - gateLow) / gateLow * 100;
      const nearLowThresholdPct = ta.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
      const nearLow = aboveLow <= nearLowThresholdPct;
      const rsiThreshold = ta.rsiOversoldThreshold ?? RSI_OVERSOLD;
      // Both the live reading AND the last closed daily RSI must be oversold: the live RSI includes
      // today's unfinished price, so an intraday spike down alone isn't enough to add.
      const rsiLiveOversold = liveRsi != null && liveRsi <= rsiThreshold;
      const rsiClosedOversold = ta.rsi != null && ta.rsi <= rsiThreshold;
      const rsiOversold = rsiLiveOversold && rsiClosedOversold;
      const gapAvgDailyMove = ta.avgDailyMove ?? null;
      const atLow = nearLow && rsiOversold;
      if (atLow) {
       const lastLog = dcaLogCache[item.id] ?? null;
       const dcaGap = getDcaGapStatus(cur, lastLog, gapAvgDailyMove, dcaHistoryOf(item.id));
       const dynGapPct = dcaGap.requiredGapPct;
       const gapPct = dcaGap.gapPct;
       const gapCleared = dcaGap.cleared;
       
       if (gapCleared) {
        signal = 'ACCUMULATE';
        colorKey = 'dca';
        strength = Math.round(strength + 30 + relStrengthBonus);
        const gapNote = lastLog == null ? '' : ` Also ${gapPct.toFixed(2)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}) — a real step down.`;
        reason = `${depth.toFixed(2)}% below ATH${yrNote}, ${aboveLow.toFixed(2)}% above its ${gateWindow}d low (within this coin's own ≤${nearLowThresholdPct.toFixed(2)}% band), RSI ${liveRsi.toFixed(2)} (oversold vs this coin's own ≤${rsiThreshold.toFixed(2)} bottom zone) — conditions met.${gapNote}${relStrengthNote}`;
       } else {
        const nextDcaPrice = dcaGap.nextDcaPrice;
        const positionNote = gapPct >= 0 ?
         `only ${gapPct.toFixed(2)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))})` :
         `${Math.abs(gapPct).toFixed(2)}% above last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}), not below it`;
        reason = `Still meets add conditions, but ${positionNote}. Needs ≥${dynGapPct.toFixed(2)}% below that — next DCA near ${formatINR(nextDcaPrice, pricePrecisionFor(nextDcaPrice))}. Held at WAIT.${relStrengthNote}`;
       }
      } else {
       if (nearLow && rsiLiveOversold && !rsiClosedOversold) {
        reason = `${depth.toFixed(2)}% below ATH${yrNote}, near its ${gateWindow}d low, live RSI ${liveRsi.toFixed(2)} is oversold (≤${rsiThreshold.toFixed(2)}), but the last daily close (RSI ${ta.rsi == null ? '—' : ta.rsi.toFixed(2)}) hasn't confirmed it yet — waiting for a daily close.`;
       } else if (nearLow && !rsiOversold) {
        reason = `${depth.toFixed(2)}% below ATH${yrNote}, near its ${gateWindow}d low, but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own oversold zone (≤${rsiThreshold.toFixed(2)}) yet.`;
       } else {
        reason = `${depth.toFixed(2)}% below ATH${yrNote}, but ${Math.abs(aboveLow).toFixed(2)}% ${aboveLow >= 0 ? 'above' : 'below'} its ${gateWindow}d low — outside this coin's own ≤${nearLowThresholdPct.toFixed(2)}% near-low band.`;
       }
      }
     } else {
      reason = `Not enough price history loaded yet to judge proximity to its recent-range low.`;
     }
    }
    
    // Interim range-trade signal: while a coin is just riding out a WAIT/HOLD stretch (not already
    // an ACCUMULATE, the ATH-tier TRIM, or a risk/liquidity call), a confirmed poke at the top of its
    // own recent range is a chance to bank a partial profit and rebuy lower — independent of whether
    // the user's own longer-term sell target has been reached.
    // Which question applies to a WAIT coin — "should I add?" or "should I trim?" — is decided FIRST, from
    // the plain 90d range: whichever extreme price is nearer to (as % of the current price). Only then are
    // that question's gates (and its reasoning) evaluated against the RSI-qualified references.
    const dToLow = (effectiveLow != null && cur) ? (cur - effectiveLow) / cur : null;
    const dToHigh = (effectiveHigh != null && cur) ? (effectiveHigh - cur) / cur : null;
    const lean = (dToLow != null && dToHigh != null && dToHigh < dToLow) ? 'swing' : 'add';
    let nearHigh = false;
    const swingHigh = gateHigh ?? effectiveHigh;
    const swingWindow = gateHighWindow;
    const emaStretchPct = (liveEmaLong != null && liveEmaLong > 0 && cur != null) ? (cur - liveEmaLong) / liveEmaLong * 100 : null;
    const surge30dPct = calcReturnPct(liveCloses, 30);
    if (swingHigh != null && cur != null && signal !== 'EXIT' && signal !== 'AT RISK' && signal !== 'ACCUMULATE' && signal !== 'TRIM') {
     const belowHighPct = (swingHigh - cur) / swingHigh * 100;
     const nearHighThresholdPct = ta?.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
     nearHigh = belowHighPct <= nearHighThresholdPct;
     const rsiOverboughtThreshold = ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT;
     const rsiLiveOverbought = liveRsi != null && liveRsi >= rsiOverboughtThreshold;
     const rsiClosedOverbought = ta?.rsi != null && ta.rsi >= rsiOverboughtThreshold;
     const rsiOverbought = rsiLiveOverbought && rsiClosedOverbought;
     const emaStretched = emaStretchPct != null && emaStretchPct >= SWING_TRIM_EMA_STRETCH_PCT;
     const surgeStretched = surge30dPct != null && surge30dPct >= SWING_TRIM_SURGE_30D_PCT;
     const parabolicStretched = emaStretched || surgeStretched;
     const windowLabel = swingWindow;
     if (nearHigh && rsiOverbought && parabolicStretched) {
      signal = 'SWING TRIM';
      colorKey = 'swing';
      strength = Math.max(strength, 65);
      const stretchBits = [
       emaStretched ? `+${emaStretchPct.toFixed(2)}% above EMA-200` : null,
       surgeStretched ? `+${surge30dPct.toFixed(2)}% in 30d` : null
      ].filter(Boolean).join(' & ');
      const targetNote = item.target != null ? ` Still well short of your ₹${item.target} target, so this is a partial-profit/rebuy-lower play, not an exit.` : '';
      reason = `${belowHighPct.toFixed(2)}% below its ${windowLabel}d high (≤${nearHighThresholdPct.toFixed(2)}% band), live & closed RSI extreme (${liveRsi.toFixed(2)} / ${ta.rsi.toFixed(2)} ≥${rsiOverboughtThreshold.toFixed(2)}), and stretched (${stretchBits}) — extreme spike with room to buy back lower.${targetNote}`;
     } else if (nearHigh && rsiLiveOverbought && !rsiClosedOverbought) {
      reason = `${belowHighPct.toFixed(2)}% below its ${windowLabel}d high and live RSI ${liveRsi.toFixed(2)} is overbought (≥${rsiOverboughtThreshold.toFixed(2)}), but the last daily close (RSI ${ta?.rsi == null ? '—' : ta.rsi.toFixed(2)}) hasn't confirmed it yet — waiting for a daily close.`;
     } else if (nearHigh && rsiOverbought && !parabolicStretched) {
      reason = `${belowHighPct.toFixed(2)}% below its ${windowLabel}d high with extreme RSI (${liveRsi.toFixed(2)}), but not parabolic enough yet (needs ≥+${SWING_TRIM_EMA_STRETCH_PCT.toFixed(2)}% above EMA-200 or ≥+${SWING_TRIM_SURGE_30D_PCT.toFixed(2)}% in 30d) — holding to avoid trimming early.`;
     } else if (lean === 'swing' && ((addReasonShown && signal === 'WAIT') || (athPct != null && athPct > athTiers.watch))) {
      const lead = `${belowHighPct.toFixed(1)}% below its ${windowLabel}d high`;
      reason = nearHigh ?
       `${lead} (within this coin's own ≤${nearHighThresholdPct.toFixed(2)}% band), but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(2)}) yet.` :
       `${lead} — outside this coin's own ≤${nearHighThresholdPct.toFixed(2)}% near-high band, and RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) is below this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(2)}).`;
     } else if (nearHigh) {
      reason = `${reason} Also ${belowHighPct.toFixed(2)}% below its ${windowLabel}d high, but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(2)}) yet.`;
     }
    }
    
    const nearTarget = item.target && cur != null ? (cur >= item.target * (1 - TARGET_PROXIMITY_PCT / 100)) : false;
    if (nearTarget && signal !== 'EXIT' && signal !== 'AT RISK') {
     signal = 'TRIM';
     colorKey = 'trim';
     strength = cur >= item.target ? 80 : 70;
     reason = `Price is at or within ${TARGET_PROXIMITY_PCT.toFixed(2)}% of your target (₹${item.target}) — worth considering a trim regardless of what the underlying discount signal says.`;
    }
    
    return {
     signal,
     colorKey,
     strength,
     reason,
     volume,
     athPct,
     athValue,
     athDate,
     atlValue,
     atlDate,
     isLiveAth,
     isLiveAtl,
     ath24,
     atl24,
     low24Set,
     high24Set,
     listDate: md.list_date ?? null,
     low24h,
     high24h,
     volRel,
     volMedInr,
     spreadPct,
     spreadTicks,
     spreadDead,
     spreadAtRisk,
     bidDepthInr: md.bidDepthInr ?? null,
     askDepthInr: md.askDepthInr ?? null,
     change7d: calcReturnPct(liveCloses, 7),
     change30d: calcReturnPct(liveCloses, 30),
     rsi: liveRsi,
     rsiOversoldThreshold: ta?.rsiOversoldThreshold ?? RSI_OVERSOLD,
     rsiOverboughtThreshold: ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT,
     nearLowThresholdPct: ta?.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT,
     athTiers,
     closesEndTs: ta?.closesEndTs ?? null,
     yearTiers,
     high365: yr ? yr.high : null,
     drawdown365: yr ? yr.pct : null,
     emaLong: liveEmaLong,
     effectiveLow,
     gateLow,
     gateLowWindow: gateWindow,
     effectiveLowDaysAgo: lowDayK,
     lowRsi,
     win180,
     win365,
     isLiveLow,
     effectiveHigh,
     gateHigh,
     lean,
     gateHighWindow,
     effectiveHighDaysAgo: highDayK,
     highRsi,
     isLiveHigh,
     rollingLowWindowDays: ta?.rollingLowWindowDays ?? null,
     rollingExtremesSource: ta?.rollingExtremesSource ?? null,
     cmp: cur ?? null,
     relStrengthVsBtc,
     sentiment,
     emaStretchPct,
     swingSurge30d: surge30dPct,
     taStale: !ta,
    };
   }

   async function loadCoinList(isApiReachable) {
    const cached = localStorage.getItem(CACHE_KEY);
    symbolInput.disabled = false;
    
    const buildIndex = (list) => {
     symbolIndex = {};
     list.forEach(c => {
      const s = (c.symbol || '').toLowerCase();
      (symbolIndex[s] ||= []).push({ id: c.id, name: c.name, symbol: (c.symbol || '').toUpperCase() });
     });
    };
    
    if (cached) {
     try {
      const parsed = JSON.parse(cached);
      const list = parsed.list || [];
      const hasTickSizes = list.some(c => c.tickSize > 0);
      if (list.length > 0 && hasTickSizes && (Date.now() - (parsed.timestamp || 0)) < CACHE_DURATION) {
       coinList = list;
       buildIndex(coinList);
       coinListLoaded = true;
       addBtn.disabled = true;
       symbolInput.placeholder = 'Type a coin symbol or name to add it…';
       setActivityStatus('Coin list loaded from cache.', 'ok');
       return;
      }
     } catch { localStorage.removeItem(CACHE_KEY); }
    }
    
    if (!isApiReachable) {
     symbolInput.placeholder = 'Coin list unavailable (API down)';
     setActivityStatus('Coin list unavailable — cannot add new coins right now.', 'error');
     return;
    }
    
    setActivityStatus('Fetching Binance USDT pairs…', 'info');
    try {
     const { res } = await binanceFetch('/api/v3/exchangeInfo?permissions=SPOT', { timeoutMs: 15000 });
     const data = await res.json();
     const existingNames = {};
     saved.forEach(item => { if (item.id && item.name) existingNames[item.id] = item.name; });
     coinList = (data.symbols || [])
      .filter(s => s.status === 'TRADING' && s.quoteAsset === 'USDT' && s.isSpotTradingAllowed)
      .map(s => {
       const pf = (s.filters || []).find(f => f.filterType === 'PRICE_FILTER');
       const tickSize = pf ? Number(pf.tickSize) : null;
       return { id: s.symbol, symbol: s.baseAsset, name: existingNames[s.symbol] || s.symbol, tickSize: (tickSize > 0 && isFinite(tickSize)) ? tickSize : null };
      });
     buildIndex(coinList);
     lsSet(CACHE_KEY, JSON.stringify({ list: coinList, timestamp: Date.now() }));
     coinListLoaded = true;
     addBtn.disabled = true;
     symbolInput.placeholder = 'Type a coin symbol or name to add it…';
     setActivityStatus(`Binance coin list loaded (${coinList.length} USDT pairs).`, 'ok');
    } catch (err) {
     symbolInput.placeholder = 'Coin list unavailable (API failed)';
     setActivityStatus('Coin list failed to load — cannot add new coins right now.', 'error');
    }
   }
   
   function getTickSize(id) {

   function normalizeBinanceTicker(t, usdInr, prevMd, fromWs = false) {
    const binUsdt = t.lastPrice != null ? Number(t.lastPrice) : null;
    const effRate = usdInr * getFxMultiplier();
    const cur = binUsdt != null ? binUsdt * effRate : null;
    const low24h = t.lowPrice != null ? Number(t.lowPrice) * effRate : null;
    const high24h = t.highPrice != null ? Number(t.highPrice) * effRate : null;
    const quoteVol = t.quoteVolume != null ? Number(t.quoteVolume) * effRate : null;
    const chg24h = t.priceChangePercent != null ? Number(t.priceChangePercent) : null;
    const base = (prevMd && !prevMd.notFound) ? prevMd : {};
    const baseSym = t.symbol.replace(/USDT$/, '');
    const { ath, ath_date: athDate, ath_change_percentage: athPct, atl, atl_date: atlDate, list_date: listDate } = resolveAthAtlForId(
     t.symbol,
     baseSym,
     isFinite(binUsdt) ? binUsdt : null,
     isFinite(cur) ? cur : null,
     usdInr,
     base
    );
    let spreadPct = base.spreadPct ?? null;
    let spreadTicks = base.spreadTicks ?? null;
    let deadBook = base.deadBook ?? false;
    let wideSpreadStreak = base.wideSpreadStreak ?? 0;
    let exitSpreadStreak = base.exitSpreadStreak ?? 0;
    if (t.bidPrice != null && t.askPrice != null) {
     const bid = Number(t.bidPrice), ask = Number(t.askPrice);
     if (!(bid > 0) || !(ask > 0) || ask < bid) {
      deadBook = true;
      spreadPct = null;
      spreadTicks = null;
     } else {
      deadBook = false;
      const mid = (bid + ask) / 2;
      spreadPct = mid > 0 ? ((ask - bid) / mid) * 100 : null;
      const tick = getTickSize(t.symbol);
      spreadTicks = (tick > 0) ? Math.round((ask - bid) / tick) : null;
     }
     const step = fromWs ? 1 : SPREAD_FLICKER_STREAK;
     const tickOk = (spreadTicks == null || spreadTicks > SPREAD_MIN_TICKS);
     const wideNow = deadBook || (spreadPct != null && spreadPct >= SPREAD_RISK_PCT && tickOk);
     const exitNow = deadBook || (spreadPct != null && spreadPct >= SPREAD_EXIT_PCT && tickOk);
     wideSpreadStreak = wideNow ? (wideSpreadStreak + step) : 0;
     exitSpreadStreak = exitNow ? (exitSpreadStreak + step) : 0;
    }
    let bidDepthInr = base.bidDepthInr ?? null;
    let askDepthInr = base.askDepthInr ?? null;
    if (t.bidPrice != null && t.bidQty != null) {
     const bd = Number(t.bidPrice) * Number(t.bidQty) * effRate;
     if (isFinite(bd) && bd >= 0) bidDepthInr = bd;
    }
    if (t.askPrice != null && t.askQty != null) {
     const ad = Number(t.askPrice) * Number(t.askQty) * effRate;
     if (isFinite(ad) && ad >= 0) askDepthInr = ad;
    }
    return {
     ...base,
     spreadPct,
     spreadTicks,
     deadBook,
     wideSpreadStreak,
     exitSpreadStreak,
     bidDepthInr,
     askDepthInr,
     total_volume: isFinite(quoteVol) ? quoteVol : (base.total_volume ?? null),
     low_24h: isFinite(low24h) ? low24h : (base.low_24h ?? null),
     high_24h: isFinite(high24h) ? high24h : (base.high_24h ?? null),
     current_price: isFinite(cur) ? cur : null,
     change_24h: isFinite(chg24h) ? chg24h : null,
     ath,
     ath_change_percentage: athPct,
     ath_date: athDate,
     atl,
     atl_date: atlDate,
     list_date: listDate,
     notFound: false,
     timestamp: Date.now()
    };
   }
   
   function applyBinanceTickers(tickers, validIds, usdInr) {
    const foundIds = new Set();
    let updated = 0;
    tickers.forEach(t => {
     if (!t || !t.symbol) return;
     foundIds.add(t.symbol);
     const normalized = normalizeBinanceTicker(t, usdInr, marketDataCache[t.symbol]);
     if (normalized.current_price != null) {
      pricesCache[t.symbol] = normalized.current_price;
      updated++;
     }
     marketDataCache[t.symbol] = normalized;
    });
    validIds.forEach(id => {
     if (!foundIds.has(id)) {
      marketDataCache[id] = { notFound: true, timestamp: Date.now() };
     }
    });
    return updated;
   }
   
   async function fetchPricesChunk(validIds, usdInr, attempt = 0) {
    const maxRetries = 1;
    let lastErr = '';
    while (attempt <= maxRetries) {
     try {
      const q = encodeURIComponent(JSON.stringify(validIds));
      const { res } = await binanceFetch(`/api/v3/ticker/24hr?symbols=${q}`, { timeoutMs: 4000 });
      const data = await res.json();
      const list = Array.isArray(data) ? data : [data];
      const updated = applyBinanceTickers(list, validIds, usdInr);
      return { updated, total: validIds.length, err: '' };
     } catch (err) {
      const msg = err.message || '';
      if (msg.includes('400') && validIds.length > 1) {
       // One invalid/delisted symbol causes Binance to reject the whole batch; isolate per symbol.
       const singles = [];
       for (const id of validIds) {
        try {
         const { res: r1 } = await binanceFetch(`/api/v3/ticker/24hr?symbol=${encodeURIComponent(id)}`, { timeoutMs: 6000 });
         const d1 = await r1.json();
         if (d1 && d1.symbol) singles.push(d1);
        } catch (e1) {
         if ((e1.message || '').includes('429') || (e1.message || '').includes('418')) {
          return { updated: 0, total: validIds.length, err: '429' };
         }
        }
       }
       const updated = applyBinanceTickers(singles, validIds, usdInr);
       return { updated, total: validIds.length, err: '' };
      }
      const isNet = msg === 'OFFLINE' || msg.includes('fetch') || err.name === 'TypeError' || err.name === 'AbortError';
      lastErr = msg === 'OFFLINE' ? 'OFFLINE' : (msg.includes('429') || msg.includes('418')) ? '429' : (/403|5\d{2}/.test(msg) ? '5xx' : (isNet ? 'network' : 'error'));
      if (lastErr === '429' || lastErr === 'OFFLINE' || lastErr === 'network') break;
      attempt++;
      if (attempt <= maxRetries) await new Promise(r => setTimeout(r, 1500));
     }
    }
    return { updated: 0, total: validIds.length, err: lastErr };
   }
   
   async function fetchPrices(ids) {
    if (!Array.isArray(ids)) return false;
    if (!ids.length) return true;
    const validIds = ids.filter(Boolean);
    if (!validIds.length) return true;
    
    const usdInr = await ensureUsdInrRate();
    if (!(usdInr > 0)) {
     statusCenter.setConnection('error', { pill: 'FX error', log: 'FX rate unavailable — using cached prices & TA.' });
     return false;
    }
    
    const chunks = [];
    for (let i = 0; i < validIds.length; i += MAX_IDS_PER_PRICE_CALL) chunks.push(validIds.slice(i, i + MAX_IDS_PER_PRICE_CALL));
    
    const start = performance.now();
    const [results] = await Promise.all([
     Promise.all(chunks.map(chunk => fetchPricesChunk(chunk, usdInr))),
     checkUsdtPegRest()
    ]);
    const updated = results.reduce((a, r) => a + r.updated, 0);
    
    saveMarketData();
    if (updated > 0) {
     ensureAthAtlForIds(validIds);
     lastPriceTime = Date.now();
     lsSet('binance_prices_time', lastPriceTime);
     savePrices();
     updateScheduledStatus();
     statusCenter.setConnection('live', { latencyMs: performance.now() - start, partial: updated < validIds.length });
     if (updated < validIds.length) statusCenter.notify(`Prices partially updated (${updated}/${validIds.length}).`, 'warn');
     return true;
    }
    
    const errType = results.find(r => r.err)?.err || 'error';
    statusCenter.setConnection('error', statusCenter.classifyError(errType));
    return false;
   }

   function scheduleApiRecheck() {
    if (recheckTimer) clearTimeout(recheckTimer);
    recheckTimer = setTimeout(async () => {
     if (document.hidden) { recheckTimer = null; return; }
     const ids = saved.map(s => s.id).filter(Boolean);
     const reachable = ids.length ? await fetchPrices(ids) : await checkApiStatus();
     if (reachable) {
      recheckTimer = null;
      if (refreshPriceTimer) clearInterval(refreshPriceTimer);
      refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
      recomputeHoldingSignals();
      applyCurrentSort();
      startRealtimeSync();
      fetchTaForPortfolio([...new Set([...ids, MACRO_COIN_ID])]);
     } else {
      updatePricesInTable();
      scheduleApiRecheck();
     }
    }, API_RECHECK_INTERVAL);
   }
   
   async function schedulePriceFetch() {
    if (document.hidden || priceFetchInFlight) return;
    const ids = saved.map(s => s.id).filter(Boolean);
    if (!ids.length) {
     await checkApiStatus();
     return;
    }
    priceFetchInFlight = true;
    statusCenter.setConnection('refreshing');
    try {
     const isApiReachable = await fetchPrices(ids);
     if (isApiReachable) {
      autoCalibrateUsdtRate({ silent: true });
      recomputeHoldingSignals();
      updatePricesInTable();
      fetchTaForPortfolio([...new Set([...ids, MACRO_COIN_ID])]);
     } else {
      updatePricesInTable();
      if (refreshPriceTimer) {
       clearInterval(refreshPriceTimer);
       refreshPriceTimer = null;
      }
      stopWsFallbackPoll();
      scheduleApiRecheck();
     }
    } finally {
     priceFetchInFlight = false;
    }
   }
   
   const WS_ENDPOINTS = ['wss://data-stream.binance.vision/stream', 'wss://stream.binance.com:9443/stream'];
   const WS_PERSIST_MS = 15000;
   const WS_FALLBACK_POLL_MS = 5000;
   let wsEngineStarted = false;
   let wsSocket = null;
   let wsStreamsKey = '';
   let wsHostIdx = 0;
   let wsReconnectDelay = 3000;
   let wsReconnectTimer = null;
   let wsFallbackTimer = null;
   let wsFlushTimer = null;
   let wsLastPersistAt = 0;
   let wsClosingIntentionally = false;
   const wsDirtyIds = new Set();

   function persistWsCaches() {
    if (!wsLastPersistAt && !wsDirtyIds.size) return;
    lsSet('binance_prices_time', lastPriceTime);
    savePrices();
    saveMarketData();
    saveHoldingSignals();
    wsLastPersistAt = Date.now();
   }

   let popupTouchActive = false;
   let popupTouchCooldownUntil = 0;
   let lastPopupBodyRefreshAt = 0;

   function flushWsUpdates() {
    wsFlushTimer = null;
    if (!wsDirtyIds.size) return;
    const ids = [...wsDirtyIds];
    wsDirtyIds.clear();
    const macroTa = taCache[MACRO_COIN_ID] || null;
    let openSigChanged = false;
    for (const id of ids) {
     const item = portfolioMap[id];
     if (!item) continue;
     const oldSig = holdingSignalCache[id]?.signal;
     holdingSignalCache[id] = classifyHolding(marketDataCache[id] || null, item, taCache[id] || null, macroTa);
     if (id === expandedRowId && oldSig !== holdingSignalCache[id]?.signal) openSigChanged = true;
    }
    checkSignalTransitions(ids);
    lastPriceTime = Date.now();
    updateScheduledStatus();
    statusCenter.setConnection('live', { ws: true });
    const now = Date.now();
    const canRefreshBody = coinPopupOpen && expandedRowId && !popupTouchActive && now >= popupTouchCooldownUntil && (openSigChanged || (now - lastPopupBodyRefreshAt >= POPUP_LIVE_REFRESH_MS));
    updatePricesInTable({ allowResort: false, refreshPopupBody: canRefreshBody });
    if (now - wsLastPersistAt >= WS_PERSIST_MS) persistWsCaches();
   }

   function handleWsTickerMessage(d) {
    if (!d || !d.s || d.c == null) return;
    if (PEG_CANDIDATES.includes(d.s)) updatePegTicker(d.s, Number(d.c));
    if (!portfolioMap[d.s]) return;
    const usdInr = getFxCache().liveRate || fxRateForDate(null);
    if (!(usdInr > 0)) return;
    const normalized = normalizeBinanceTicker({
     symbol: d.s,
     lastPrice: d.c,
     lowPrice: d.l,
     highPrice: d.h,
     quoteVolume: d.q,
     priceChangePercent: d.P,
     bidPrice: d.b,
     askPrice: d.a,
     bidQty: d.B,
     askQty: d.A
    }, usdInr, marketDataCache[d.s], true);
    if (normalized.current_price != null) pricesCache[d.s] = normalized.current_price;
    marketDataCache[d.s] = normalized;
    wsDirtyIds.add(d.s);
    if (!wsFlushTimer) wsFlushTimer = setTimeout(flushWsUpdates, 1000);
   }

   function startWsFallbackPoll() {
    if (wsFallbackTimer || document.hidden) return;
    wsFallbackTimer = setInterval(schedulePriceFetch, WS_FALLBACK_POLL_MS);
   }

   function stopWsFallbackPoll() {
    if (wsFallbackTimer) { clearInterval(wsFallbackTimer); wsFallbackTimer = null; }
   }

   function closePortfolioWebSocket() {
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    if (wsFlushTimer) { clearTimeout(wsFlushTimer); wsFlushTimer = null; flushWsUpdates(); }
    stopWsFallbackPoll();
    wsStreamsKey = '';
    statusCenter.setWsLive(false);
    if (wsSocket) {
     wsClosingIntentionally = true;
     try { wsSocket.close(); } catch (e) {}
     wsSocket = null;
    }
   }

   function syncPortfolioWebSocket() {
    if (!wsEngineStarted || document.hidden) return;
    const portIds = saved.map(s => s.id).filter(Boolean);
    if (!portIds.length) { closePortfolioWebSocket(); return; }
    const ids = [...new Set([...portIds, ...getActivePegPairs()])].sort();
    const nextKey = ids.join(',');
    if (nextKey === wsStreamsKey && wsSocket && (wsSocket.readyState === WebSocket.OPEN || wsSocket.readyState === WebSocket.CONNECTING)) return;
    if (wsReconnectTimer) { clearTimeout(wsReconnectTimer); wsReconnectTimer = null; }
    if (wsSocket) {
     wsClosingIntentionally = true;
     try { wsSocket.close(); } catch (e) {}
     wsSocket = null;
    }
    wsStreamsKey = nextKey;
    const streams = ids.map(id => `${id.toLowerCase()}@ticker`).join('/');
    const url = `${WS_ENDPOINTS[wsHostIdx % WS_ENDPOINTS.length]}?streams=${streams}`;
    let opened = false;
    wsClosingIntentionally = false;
    const sock = new WebSocket(url);
    wsSocket = sock;
    sock.onopen = () => {
     if (wsSocket !== sock) { try { sock.close(); } catch (e) {} return; }
     opened = true;
     wsReconnectDelay = 3000;
     stopWsFallbackPoll();
     statusCenter.setConnection('live', { ws: true });
    };
    sock.onmessage = (ev) => {
     if (wsSocket !== sock) return;
     try {
      const msg = JSON.parse(ev.data);
      handleWsTickerMessage(msg.data || msg);
     } catch (e) {}
    };
    sock.onerror = () => { try { sock.close(); } catch (e) {} };
    sock.onclose = () => {
     if (wsSocket === sock) wsSocket = null;
     if (wsClosingIntentionally || document.hidden) return;
     if (!opened) wsHostIdx++;
     if (navigator.onLine === false) {
      statusCenter.setConnection('error', { pill: 'Offline', log: 'Offline — using cached prices & TA.' });
      if (refreshPriceTimer) { clearInterval(refreshPriceTimer); refreshPriceTimer = null; }
      stopWsFallbackPoll();
      scheduleApiRecheck();
     } else {
      statusCenter.setWsLive(false);
     startWsFallbackPoll();
      setTimeout(() => { if (!document.hidden && !wsSocket) schedulePriceFetch(); }, 1200);
     }
     const delay = wsReconnectDelay;
     wsReconnectDelay = Math.min(15000, wsReconnectDelay * 2);
     wsReconnectTimer = setTimeout(() => { wsReconnectTimer = null; syncPortfolioWebSocket(); }, delay);
    };
   }

   function startRealtimeSync() {
    wsEngineStarted = true;
    syncPortfolioWebSocket();
   }

   function refreshOnResume() {
    if (document.hidden) {
     persistWsCaches();
     closePortfolioWebSocket();
     return;
    }
    const age = Date.now() - lastPriceTime;
    if (statusCenter.isDown() || !refreshPriceTimer || age >= 10000) {
     if (recheckTimer) { clearTimeout(recheckTimer); recheckTimer = null; }
     if (refreshPriceTimer) clearInterval(refreshPriceTimer);
     refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
     schedulePriceFetch();
    }
    if (wsEngineStarted) syncPortfolioWebSocket();
   }

   // DCA log. `dcaLogCache[id]` keeps its original shape ({price, dateStr, timestamp}) because the
   // signal engine reads `.price` as the "last DCA" anchor; a `history` array rides along so a missed
   // or back-dated entry can be added without clobbering a newer one. The anchor is always the
   // newest-DATED entry (ties: most recently logged).
   function dcaHistoryOf(id) {
    const e = dcaLogCache[id];
    if (!e) return [];
    if (Array.isArray(e.history) && e.history.length) return e.history.slice();
    return (e.price > 0) ? [{ price: e.price, dateStr: e.dateStr, timestamp: e.timestamp }] : [];
   }
   
   function setDcaHistory(id, history) {
    const sorted = history
     .filter(h => h && h.price > 0)
     .sort((a, b) => (b.dateStr || '').localeCompare(a.dateStr || '') || ((b.timestamp || 0) - (a.timestamp || 0)))
     .slice(0, DCA_HISTORY_MAX);
    if (!sorted.length) { delete dcaLogCache[id]; return; }
    const top = sorted[0];
    dcaLogCache[id] = { price: top.price, dateStr: top.dateStr, timestamp: top.timestamp, history: sorted };
   }
   
   async function logDcaLevel(id, symbol) {
    const cur = pricesCache[id] ?? marketDataCache[id]?.current_price ?? null;
    const lastPrice = dcaLogCache[id]?.price ?? null;
    const entry = await dcaEntryDialog(symbol, cur, { lastPrice, refLabel: 'last DCA' });
    if (!entry) return;
    setDcaHistory(id, dcaHistoryOf(id).concat({ price: entry.price, dateStr: entry.dateStr, timestamp: Date.now() }));
    saveDcaLog();
    recomputeHoldingSignals();
    applyCurrentSort();
   }
   
   async function editDcaEntry(id, symbol, ts, idx) {
    const hist = dcaHistoryOf(id);
    const matchIdx = hist.findIndex((h, i) => (Number.isFinite(ts) && h.timestamp != null) ? h.timestamp === ts : i === idx);
    if (matchIdx === -1) return;
    const entry = hist[matchIdx];
    const cur = pricesCache[id] ?? marketDataCache[id]?.current_price ?? null;
    const refEntry = hist[matchIdx + 1] || (matchIdx > 0 ? hist[0] : null);
    const refLabel = hist[matchIdx + 1] ? 'prev DCA' : 'latest DCA';
    const updated = await dcaEntryDialog(symbol, cur, { existing: entry, lastPrice: refEntry ? refEntry.price : null, refLabel });
    if (!updated) return;
    const next = dcaHistoryOf(id).map((h, i) => ((Number.isFinite(ts) && h.timestamp != null) ? h.timestamp === ts : i === matchIdx) ? { ...h, price: updated.price, dateStr: updated.dateStr } : h);
    setDcaHistory(id, next);
    saveDcaLog();
    recomputeHoldingSignals();
    applyCurrentSort();
   }
   
   async function removeDcaEntry(id, symbol, ts, idx) {
    const hist = dcaHistoryOf(id);
    const matchIdx = hist.findIndex((h, i) => (Number.isFinite(ts) && h.timestamp != null) ? h.timestamp === ts : i === idx);
    if (matchIdx === -1) return;
    const entry = hist[matchIdx];
    const ok = await confirmDialog({
     title: `Delete this ${symbol} entry?`,
     message: `${formatINR(entry.price, pricePrecisionFor(entry.price))} on ${entry.dateStr} will be removed from the log.`,
     okLabel: 'Delete',
     danger: true
    });
    if (!ok) return;
    const next = dcaHistoryOf(id).filter((h, i) => !((Number.isFinite(ts) && h.timestamp != null) ? h.timestamp === ts : i === matchIdx));
    setDcaHistory(id, next);
    saveDcaLog();
    recomputeHoldingSignals();
    applyCurrentSort();
   }

    }, 20);
    
    let done = false;

     if (done) return;
     done = true;
