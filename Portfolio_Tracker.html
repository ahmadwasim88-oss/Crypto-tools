function calcEMASeries(values, period) {
  if (values.length < period) return [];
  const k = 2 / (period + 1);
  const out = [];
  let ema = values.slice(0, period).reduce((a, b) => a + b, 0) / period;
  out[period - 1] = ema;
  for (let i = period; i < values.length; i++) {
    ema = values[i] * k + ema * (1 - k);
    out[i] = ema;
  }
  return out;
}

function calcRSISeries(values, period) {
  if (values.length < period + 1) return [];
  const out = new Array(values.length).fill(null);
  let gains = 0, losses = 0;
  for (let i = 1; i <= period; i++) {
    const diff = values[i] - values[i - 1];
    if (diff >= 0) gains += diff; else losses -= diff;
  }
  let avgGain = gains / period, avgLoss = losses / period;
  out[period] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  for (let i = period + 1; i < values.length; i++) {
    const diff = values[i] - values[i - 1];
    avgGain = (avgGain * (period - 1) + Math.max(diff, 0)) / period;
    avgLoss = (avgLoss * (period - 1) + Math.max(-diff, 0)) / period;
    out[i] = avgLoss === 0 ? 100 : 100 - 100 / (1 + avgGain / avgLoss);
  }
  return out;
}

function calcReturnPct(closes, days) {
  if (!closes || closes.length < days + 1) return null;
  const start = closes[closes.length - 1 - days];
  const end = closes[closes.length - 1];
  if (start == null || end == null || start === 0) return null;
  return (end - start) / start * 100;
}

function istDateStr(ts) {
  return new Date(ts).toLocaleDateString('en-CA', { timeZone: 'Asia/Kolkata' });
}

function calcAvgDailyMovePct(closes, days) {
  if (!closes || closes.length < days + 1) return null;
  const slice = closes.slice(-(days + 1));
  let sum = 0, n = 0;
  for (let i = 1; i < slice.length; i++) {
    const prev = slice[i - 1], cur = slice[i];
    if (prev) { sum += Math.abs((cur - prev) / prev * 100); n++; }
  }
  return n ? sum / n : null;
}

// Walks backward through the coin's actual closing-price history (today's live price appended
// as the final point) to find how many consecutive days the ACCUMULATE conditions — near the
// 90-day low, RSI oversold — have really been true, using each day's own trailing 90-day window
// (no lookahead). This replaced a cache that only counted from whenever the app first happened
// to observe the condition while running, which understated the streak if the app was closed, or
// reset the count whenever the underlying gate logic itself changed. Deliberately doesn't fold in
// the ATL-merge refinement `effectiveLow` applies for today — that only matters in the rare case
// of an ATL older than 90 days that's still the coin's lowest daily close, and isn't reconstructable
// per historical day without full ATL history, so it's left out of this backward walk.
function reconstructStreakDays(closes, cur, rsiThreshold, nearLowThresholdPct, windowDays = DCA_DIP_WINDOW_DAYS) {
  if (!closes || !closes.length || cur == null) return 1;
  const series = closes.concat([cur]);
  const rsiSeries = calcRSISeries(series, RSI_PERIOD);
  const threshold = rsiThreshold ?? RSI_OVERSOLD;
  const nearLowPct = nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
  let streak = 0;
  for (let i = series.length - 1; i >= 0; i--) {
    const rsi = rsiSeries[i];
    if (rsi == null) break;
    const windowStart = Math.max(0, i - windowDays + 1);
    let low = Infinity;
    for (let j = windowStart; j <= i; j++) {
      if (series[j] < low) low = series[j];
    }
    const aboveLow = ((series[i] - low) / low) * 100;
    const atLowThatDay = aboveLow <= nearLowPct && rsi <= threshold;
    if (!atLowThatDay) break;
    streak++;
  }
  return streak || 1;
}

function computeTaFromCloses(closes) {
  if (!closes || closes.length < RSI_PERIOD + 1) return null;
  const emaLongSeries = calcEMASeries(closes, EMA_TREND_LONG);
  const rsiSeries = calcRSISeries(closes, RSI_PERIOD);
  const dipWindowCloses = closes.slice(-DCA_DIP_WINDOW_DAYS);
  const rollingLow = dipWindowCloses.length ? Math.min(...dipWindowCloses) : null;
  const rollingHigh = dipWindowCloses.length ? Math.max(...dipWindowCloses) : null;
  // dipWindowCloses[last] is the most recent confirmed daily close (1 day ago, since today's
  // in-progress point is dropped by fetchTaHistory) — so days-ago counts back from that index.
  const rollingLowIndex = dipWindowCloses.length ? dipWindowCloses.indexOf(rollingLow) : -1;
  const rollingLowDaysAgo = rollingLowIndex >= 0 ? (dipWindowCloses.length - rollingLowIndex) : null;
  const rollingHighIndex = dipWindowCloses.length ? dipWindowCloses.indexOf(rollingHigh) : -1;
  const rollingHighDaysAgo = rollingHighIndex >= 0 ? (dipWindowCloses.length - rollingHighIndex) : null;
  const validRsi = rsiSeries.filter(v => v != null && !isNaN(v));
  let rsiOversoldThreshold = RSI_OVERSOLD;
  if (validRsi.length >= RSI_OVERSOLD_MIN_SAMPLES) {
    const sortedRsi = [...validRsi].sort((a, b) => a - b);
    const p = percentileOf(sortedRsi, RSI_OVERSOLD_PERCENTILE);
    if (p != null) rsiOversoldThreshold = Math.min(RSI_OVERSOLD_CEIL, Math.max(RSI_OVERSOLD_FLOOR, p));
  }
  let rsiOverboughtThreshold = RSI_OVERBOUGHT;
  if (validRsi.length >= RSI_OVERBOUGHT_MIN_SAMPLES) {
    const sortedRsiHigh = [...validRsi].sort((a, b) => a - b);
    const pHigh = percentileOf(sortedRsiHigh, RSI_OVERBOUGHT_PERCENTILE);
    if (pHigh != null) rsiOverboughtThreshold = Math.min(RSI_OVERBOUGHT_CEIL, Math.max(RSI_OVERBOUGHT_FLOOR, pHigh));
  }
  // Shortest window whose low was set while RSI was genuinely oversold; falls back to 90d (unqualified).
  let refLow = null;
  for (const N of REF_LOW_WINDOWS) {
    const w = closes.slice(-N);
    if (!w.length) continue;
    const lo = Math.min(...w);
    const idx = closes.length - w.length + w.indexOf(lo);
    const r = rsiSeries[idx];
    const ok = r != null && !isNaN(r) && r <= rsiOversoldThreshold + REF_LOW_RSI_MARGIN;
    const cand = { val: lo, window: w.length, daysAgo: closes.length - idx, rsi: (r != null && !isNaN(r)) ? r : null, qualified: ok };
    if (!refLow) refLow = cand;
    if (ok) { refLow = cand; break; }
  }
  const avgDailyMove = calcAvgDailyMovePct(closes, DCA_VOL_LOOKBACK_DAYS);
  const volScale = avgDailyMove != null
    ? Math.max(VOL_SCALE_MIN, Math.min(VOL_SCALE_MAX, avgDailyMove / VOL_SCALE_REF_PCT))
    : 1;
  const nearLowThresholdPct = Math.max(
    DCA_NEAR_LOW_FLOOR_PCT,
    Math.min(DCA_NEAR_LOW_CEIL_PCT, (avgDailyMove ?? DCA_NEAR_LOW_FLOOR_PCT) * DCA_NEAR_LOW_MULT)
  );
  const clampTier = base => Math.max(ATH_TIER_ABS_FLOOR_PCT, Math.min(ATH_TIER_ABS_CEIL_PCT, base * volScale));
  const athTiers = {
    extreme: clampTier(DCA_EXTREME_PCT),
    deep: clampTier(DCA_DEEP_PCT),
    moderate: clampTier(DCA_MODERATE_PCT),
    watch: clampTier(DCA_WATCH_PCT)
  };
  const clampYearTier = base => Math.max(YEAR_TIER_ABS_FLOOR_PCT, Math.min(YEAR_TIER_ABS_CEIL_PCT, base * volScale));
  const yearTiers = {
    extreme: clampYearTier(DCA_YEAR_EXTREME_PCT),
    deep: clampYearTier(DCA_YEAR_DEEP_PCT),
    moderate: clampYearTier(DCA_YEAR_MODERATE_PCT)
  };
  return {
    rsi: rsiSeries.length ? rsiSeries[rsiSeries.length - 1] : null,
    yearTiers,
    rsiOversoldThreshold,
    rsiOverboughtThreshold,
    avgDailyMove,
    nearLowThresholdPct,
    athTiers,
    emaLong: emaLongSeries.length ? emaLongSeries[emaLongSeries.length - 1] : null,
    rollingLow,
    refLow,
    rollingLowDaysAgo,
    rollingHigh,
    rollingHighDaysAgo,
    rollingLowWindowDays: dipWindowCloses.length,
    closes,
    version: TA_LOGIC_VERSION,
    timestamp: Date.now()
  };
}

// ---- Today's UTC candle (open / high / low) -----------------------------------------------------
// Source: CoinGecko /ohlc?days=1 = 30-minute candles whose timestamp is the candle's CLOSE time
// (per CoinGecko docs). Today's candle = every candle that closes after 00:00 UTC. To keep the
// numbers exact we only accept the data if the first candle closes at exactly 00:30 UTC (so its
// open IS the 00:00 UTC open) and there are no gaps between candles; otherwise we store nothing
// and the UI shows '—' rather than an approximation. All values are CoinGecko's aggregated INR
// prices, so they can differ slightly from a single exchange's candle.
const CANDLE_MS = 30 * 60000;
const DAY_CANDLE_REFRESH_MS = 15 * 60000;   // CoinGecko caches OHLC for 15 minutes
const DAY_CANDLE_RETRY_MS = 5 * 60000;      // back-off after a failed/rejected fetch
const dayCandleLastAttempt = {};
let dayCandleInFlight = false;

function utcDayKey(ts) { return new Date(ts).toISOString().slice(0, 10); }
function utcMidnightOf(ts) { const d = new Date(ts); return Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }

async function fetchDayCandle(id) {
  const data = await fetchJsonTimeout(`${API_BASE}/coins/${id}/ohlc?vs_currency=inr&days=1&x_cg_demo_api_key=${API_KEY}`);
  if (!Array.isArray(data)) return undefined;            // network/rate-limit failure: keep previous entry
  const now = Date.now(), midnight = utcMidnightOf(now);
  const cs = data
    .filter(c => Array.isArray(c) && c.length >= 5 && c.slice(0, 5).every(v => v != null && !isNaN(v)) && c[0] > midnight && c[0] <= now + CANDLE_MS)
    .sort((a, b) => a[0] - b[0]);
  const bad = { dayKey: utcDayKey(now), invalid: true, fetchedAt: now };
  if (!cs.length || cs[0][0] !== midnight + CANDLE_MS) return bad;   // first candle must be 00:00-00:30 UTC
  // A missing candle could hide the day's real high/low, but the open is still exact: keep the open
  // (and % change) and withhold the range.
  let rangeOk = true;
  for (let i = 1; i < cs.length; i++) {
    const gap = cs[i][0] - cs[i - 1][0];
    const isLast = i === cs.length - 1;
    if (isLast ? (gap <= 0 || gap > CANDLE_MS) : gap !== CANDLE_MS) { rangeOk = false; break; }
  }
  return {
    dayKey: utcDayKey(now),
    open: cs[0][1],
    high: rangeOk ? Math.max(...cs.map(c => c[2])) : null,
    low: rangeOk ? Math.min(...cs.map(c => c[3])) : null,
    lastTs: cs[cs.length - 1][0],
    fetchedAt: now
  };
}

async function refreshDayCandles(ids) {
  if (dayCandleInFlight) return;
  const today = utcDayKey(Date.now());
  const due = ids.filter(id => {
    const c = dayCandleCache[id];
    const lastTry = dayCandleLastAttempt[id] || 0;
    if (Date.now() - lastTry < DAY_CANDLE_RETRY_MS) return false;
    if (!c || c.dayKey !== today) return true;
    return Date.now() - c.fetchedAt >= (c.invalid ? DAY_CANDLE_RETRY_MS : DAY_CANDLE_REFRESH_MS);
  });
  if (!due.length) return;
  dayCandleInFlight = true;
  try {
    for (const id of due) {
      dayCandleLastAttempt[id] = Date.now();
      const res = await fetchDayCandle(id);
      if (res !== undefined) { dayCandleCache[id] = res; saveDayCandles(); updatePricesInTable(); }
      await new Promise(r => setTimeout(r, TA_FETCH_DELAY_MS));
    }
  } finally {
    dayCandleInFlight = false;
  }
}

function getDayCandle(id) {
  const c = dayCandleCache[id];
  return (c && !c.invalid && c.dayKey === utcDayKey(Date.now()) && c.open > 0) ? c : null;
}

// Today's move: live price vs today's 00:00 UTC open (= previous day's close). null if unavailable.
function getTodayChangePct(id) {
  const c = getDayCandle(id);
  const cur = pricesCache[id] ?? marketDataCache[id]?.current_price;
  if (!c || cur == null) return null;
  return (cur - c.open) / c.open * 100;
}

// CoinGecko's rolling 24h % (from the price call). Never mixed with the candle figure: wherever it is
// shown as a fallback it carries an explicit '24h' tag.
function getRollingChangePct(id) {
  const v = marketDataCache[id]?.change_24h;
  return (v != null && isFinite(v)) ? v : null;
}
// What the table shows/sorts by: today's candle move if available, else the tagged rolling 24h.
function getDisplayChange(id) {
  const t = getTodayChangePct(id);
  if (t != null) return { pct: t, rolling: false };
  const r = getRollingChangePct(id);
  return r != null ? { pct: r, rolling: true } : null;
}

async function fetchTaHistory(id) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(`${API_BASE}/coins/${id}/market_chart?vs_currency=inr&days=${TA_HISTORY_DAYS}&interval=daily&x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    const data = await res.json();
    const points = (data.prices || []).filter(p => p && p[1] != null);
    if (!points.length) return null;
    const lastTs = points[points.length - 1][0];
    const lastIsToday = new Date(lastTs).toISOString().slice(0, 10) === new Date().toISOString().slice(0, 10);
    const usablePoints = lastIsToday ? points.slice(0, -1) : points;
    const out = usablePoints.map(p => p[1]);
    out.lastTs = usablePoints.length ? usablePoints[usablePoints.length - 1][0] : null; // freshness check
    return out;
  } catch (err) {
    return null;
  }
}


// ---- True high/low sources -------------------------------------------------------------------
// Daily closes are one snapshot per day and never see intraday wicks, so extremes built from them
// understate the real range. Two CoinGecko sources fix that:
//  * OHLC (365d): 4-day candles with real wick highs/lows. Price is exact; the DATE is only good
//    to the 4-day bucket, and the oldest candle can straddle the window edge.
//  * market_chart for 90d (no interval => CoinGecko auto-granularity returns HOURLY points for
//    windows of 2-90 days): exact window edge and hour-level dates, price within the sub-hour wick.
async function fetchJsonTimeout(url) {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 10000);
    const res = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    return await res.json();
  } catch (err) {
    return null;
  }
}

async function fetchRangeExtremes(id) {
  const DAY = 86400000, BUCKET = 4 * DAY, now = Date.now();
  const cutoff90 = now - DCA_DIP_WINDOW_DAYS * DAY, cutoffYear = now - YEAR_HIGH_DAYS * DAY;
  const ohlc = await fetchJsonTimeout(`${API_BASE}/coins/${id}/ohlc?vs_currency=inr&days=${YEAR_HIGH_DAYS}&x_cg_demo_api_key=${API_KEY}`);
  await new Promise(r => setTimeout(r, 500));
  const hourly = await fetchJsonTimeout(`${API_BASE}/coins/${id}/market_chart?vs_currency=inr&days=${DCA_DIP_WINDOW_DAYS}&x_cg_demo_api_key=${API_KEY}`);
  const ok = v => v != null && !isNaN(v);
  const slots = { d90High: null, d90Low: null, yHigh: null, yLow: null };
  const take = (key, val, ts, src, isHigh) => {
    if (!ok(val) || ts == null) return;
    const cur = slots[key];
    if (!cur || (isHigh ? val > cur.val : val < cur.val)) slots[key] = { val, ts, src };
  };
  let any = false;
  if (Array.isArray(ohlc)) {
    for (const c of ohlc) {
      if (!Array.isArray(c) || c.length < 5) continue;
      const [ts, , high, low] = c;
      if (ts == null || ts < cutoffYear) continue;
      any = true;
      take('yHigh', high, ts, 'ohlc', true); take('yLow', low, ts, 'ohlc', false);
      // only candles fully inside the 90d window (valid whether ts is candle start or end)
      if (ts >= cutoff90 + BUCKET) { take('d90High', high, ts, 'ohlc', true); take('d90Low', low, ts, 'ohlc', false); }
    }
  }
  const pts = hourly && Array.isArray(hourly.prices) ? hourly.prices : null;
  if (pts) {
    for (const pt of pts) {
      if (!Array.isArray(pt) || pt[0] < cutoff90) continue;
      any = true;
      take('d90High', pt[1], pt[0], 'hourly', true); take('d90Low', pt[1], pt[0], 'hourly', false);
      take('yHigh', pt[1], pt[0], 'hourly', true); take('yLow', pt[1], pt[0], 'hourly', false);
    }
  }
  // Date refinement: a wick from a 4-day candle only pins the extreme to "somewhere in that bucket".
  // Where hourly points cover that span, snap the date to the hour whose price sits closest to the
  // wick (accepted only if within REFINE_TOL of it, so a coincidental match on a different day
  // can't win). The wick PRICE is kept; only the date improves, and the entry then counts as exact.
  const REFINE_TOL = 0.015;
  if (pts) {
    for (const key of Object.keys(slots)) {
      const sl = slots[key];
      if (!sl || sl.src !== 'ohlc') continue;
      let best = null, bestDiff = Infinity;
      for (const pt of pts) {
        if (!Array.isArray(pt) || Math.abs(pt[0] - sl.ts) > BUCKET) continue;
        const diff = Math.abs(pt[1] - sl.val);
        if (diff < bestDiff) { bestDiff = diff; best = pt; }
      }
      if (best && bestDiff / sl.val <= REFINE_TOL) { sl.ts = best[0]; sl.src = 'hourly'; }
    }
  }
  return any ? slots : null;
}

function auditTa(ta) {
  if (!ta) return true;
  const fields = [ta.rsi, ta.emaLong, ta.rollingLow, ta.rollingHigh, ta.rsiOversoldThreshold, ta.rsiOverboughtThreshold, ta.nearLowThresholdPct,
    ta.athTiers?.extreme, ta.athTiers?.deep, ta.athTiers?.moderate, ta.athTiers?.watch,
    ta.yearTiers?.extreme, ta.yearTiers?.deep, ta.yearTiers?.moderate];
  return fields.every(v => v == null || !isNaN(v));
}

function taBoundaryPassedSince(ts) {
  if (!ts) return true;
  const now = Date.now();
  const d = new Date(now);
  const todaysBoundary = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 0, 0, 0) + TA_ALIGN_BUFFER_MS;
  const mostRecentBoundary = now >= todaysBoundary ? todaysBoundary : todaysBoundary - 24 * 60 * 60000;
  return ts < mostRecentBoundary;
}

async function fetchTaForPortfolio(ids, { force = false } = {}) {
  const hasEnoughHistory = cached => cached.closes && cached.closes.length >= TA_HISTORY_DAYS - 20;

  let recomputed = 0;
  ids.forEach(id => {
    const cached = taCache[id];
    if (cached && cached.fetchVersion === TA_FETCH_VERSION && cached.version !== TA_LOGIC_VERSION && hasEnoughHistory(cached)) {
      const recomputedTa = computeTaFromCloses(cached.closes);
      if (recomputedTa && auditTa(recomputedTa)) {
        // A logic-only recompute derives rolling extremes from `closes` again, which would quietly
        // downgrade an already-fetched OHLC-sourced (true wick) high/low back to the closes-only
        // approximation. Carry the OHLC overlay forward when this coin already has one.
        if (cached.year) recomputedTa.year = cached.year;
        recomputedTa.closesEndTs = cached.closesEndTs;
        if (cached.rollingExtremesSource === 'ohlc' || cached.rollingExtremesSource === 'hourly') {
          recomputedTa.rollingHighSrc = cached.rollingHighSrc; recomputedTa.rollingLowSrc = cached.rollingLowSrc;
          recomputedTa.rollingHigh = cached.rollingHigh;
          recomputedTa.rollingLow = cached.rollingLow;
          recomputedTa.rollingHighDaysAgo = cached.rollingHighDaysAgo;
          recomputedTa.rollingLowDaysAgo = cached.rollingLowDaysAgo;
          recomputedTa.rollingExtremesSource = cached.rollingExtremesSource;
        }
        recomputedTa.fetchVersion = TA_FETCH_VERSION;
        taCache[id] = recomputedTa;
        recomputed++;
      } else {
        setActivityStatus(`TA audit failed recomputing ${id} — one or more indicators returned NaN, keeping previous values.`, 'warn');
      }
    }
  });
  if (recomputed > 0) {
    saveTaData();
    recomputeHoldingSignals();
    updatePricesInTable();
    setActivityStatus(`Re-applied updated signal logic to ${recomputed} coin(s).`, 'ok');
  }

  const stale = ids.filter(id => {
    const cached = taCache[id];
    if (force || !cached) return true;
    if (cached.fetchVersion !== TA_FETCH_VERSION) return true;
    if (cached.closesEndTs && Date.now() - cached.closesEndTs > TA_MAX_DATA_AGE_MS && Date.now() - cached.timestamp > 6 * 3600000) return true;
    if (cached.version !== TA_LOGIC_VERSION && !hasEnoughHistory(cached)) return true;
    return taBoundaryPassedSince(cached.timestamp);
  });
  if (!stale.length || taFetchInFlight) return;
  taFetchInFlight = true;
  let updated = 0, auditFailures = 0, staleFeeds = 0;
  for (const id of stale) {
    const closes = await fetchTaHistory(id);
    // Freshness guard: a daily series that ends days ago makes every window, RSI and EMA read from
    // the wrong dates. Reject it and keep whatever was cached instead of silently using it.
    if (closes && (closes.lastTs == null || Date.now() - closes.lastTs > TA_MAX_DATA_AGE_MS)) {
      staleFeeds++;
      setActivityStatus(`Daily history for ${id} ends ${closes.lastTs ? new Date(closes.lastTs).toISOString().slice(0, 10) : 'at an unknown date'} — too old, discarded.`, 'warn');
      await new Promise(r => setTimeout(r, TA_FETCH_DELAY_MS));
      continue;
    }
    if (closes) {
      const ta = computeTaFromCloses(closes);
      if (ta && auditTa(ta)) {
        ta.closesEndTs = closes.lastTs;
        await new Promise(r => setTimeout(r, 500));
        const ext = await fetchRangeExtremes(id);
        // Start from the close-based values, then let any more-extreme, in-window wick replace them.
        ta.rollingHighSrc = 'closes'; ta.rollingLowSrc = 'closes';
        const w = closes.slice(-YEAR_HIGH_DAYS);
        const yHi = Math.max(...w), yLo = Math.min(...w);
        ta.year = { high: yHi, highDaysAgo: w.length - w.indexOf(yHi), highSrc: 'closes', low: yLo, lowDaysAgo: w.length - w.indexOf(yLo), lowSrc: 'closes' };
        if (ext) {
          const dAgo = (ts, cap) => Math.min(daysSince(ts), cap);
          if (ext.d90High && ext.d90High.val > ta.rollingHigh) { ta.rollingHigh = ext.d90High.val; ta.rollingHighDaysAgo = dAgo(ext.d90High.ts, DCA_DIP_WINDOW_DAYS); ta.rollingHighSrc = ext.d90High.src; }
          if (ext.d90Low && ext.d90Low.val < ta.rollingLow) { ta.rollingLow = ext.d90Low.val; ta.rollingLowDaysAgo = dAgo(ext.d90Low.ts, DCA_DIP_WINDOW_DAYS); ta.rollingLowSrc = ext.d90Low.src; }
          if (ext.yHigh && ext.yHigh.val > ta.year.high) { ta.year.high = ext.yHigh.val; ta.year.highDaysAgo = dAgo(ext.yHigh.ts, YEAR_HIGH_DAYS); ta.year.highSrc = ext.yHigh.src; }
          if (ext.yLow && ext.yLow.val < ta.year.low) { ta.year.low = ext.yLow.val; ta.year.lowDaysAgo = dAgo(ext.yLow.ts, YEAR_HIGH_DAYS); ta.year.lowSrc = ext.yLow.src; }
          const srcs = [ta.rollingHighSrc, ta.rollingLowSrc];
          ta.rollingExtremesSource = srcs.includes('ohlc') ? 'ohlc' : srcs.includes('hourly') ? 'hourly' : 'closes';
        } else {
          ta.rollingExtremesSource = 'closes';
        }
        ta.fetchVersion = TA_FETCH_VERSION;
        taCache[id] = ta;
        updated++;
      } else if (ta) {
        auditFailures++;
        setActivityStatus(`TA audit failed for ${id} — one or more indicators returned NaN, discarding this fetch.`, 'warn');
      }
    }
    await new Promise(r => setTimeout(r, TA_FETCH_DELAY_MS));
  }
  saveTaData();
  if (updated > 0) {
    lastTaTime = Date.now();
    localStorage.setItem('shortfall_ta_time', lastTaTime);
    recomputeHoldingSignals();
    updatePricesInTable();
    updateScheduledStatus();
  }
  setActivityStatus(`TA history updated (${updated}/${stale.length}).${auditFailures ? ` ${auditFailures} discarded on audit failure.` : ''}${staleFeeds ? ` ${staleFeeds} discarded as stale (history ended >3d ago).` : ''}`, updated > 0 ? 'ok' : 'warn');
  taFetchInFlight = false;
}


// CoinGecko's OHLC candles are 4 days wide this far back, so the timestamp we get for the
// high/low candle only pins the wick to "somewhere near this day" — it can land a few days off
// from the actual calendar day (bucket alignment varies, so the error can go either way, not just
// one direction). We already know the true wick PRICE (it came straight from that OHLC candle), so
// rather than guess which direction the timestamp is off, we search the days around the reported
// one and pick whichever day's close sits nearest that known price — that's the best single-day
// stand-in we can get from daily closes alone.
function refineExtremeDay(closes, daysAgo, knownPrice) {
  if (!closes || !closes.length || daysAgo == null || knownPrice == null) return daysAgo;
  let bestK = daysAgo, bestDiff = Infinity;
  const lo = Math.max(1, daysAgo - 4), hi = Math.min(closes.length, daysAgo + 4, DCA_DIP_WINDOW_DAYS);
  for (let k = lo; k <= hi; k++) {
    const c = closes[closes.length - k];
    if (c == null || isNaN(c)) continue;
    const diff = Math.abs(c - knownPrice);
    if (diff < bestDiff) { bestDiff = diff; bestK = k; }
  }
  return bestK;
}

// RSI (14) on the day the 90d low/high was set. `rsiSeries` is aligned with closes.concat([cur]),
// so index (len-1-k) is the close from k days ago and k=0 is the live reading.
function rsiAtExtreme(rsiSeries, daysAgo, isLive) {
  if (!rsiSeries || !rsiSeries.length || daysAgo == null) return null;
  const n = rsiSeries.length;
  if (isLive || daysAgo <= 0) return rsiSeries[n - 1] ?? null;
  const idx = n - 1 - daysAgo;
  if (idx < 0) return null;
  const v = rsiSeries[idx];
  return (v == null || isNaN(v)) ? null : v;
}

// Trailing-365d high (daily closes, plus live price so a fresh high reads as 0%) and the current
// drawdown from it. Returns null if there isn't enough history to call it a year.
// athValue/atlValue (+ dates) are folded in when they fall inside the 365d window — daily closes
// miss intraday wicks, so without this a recent all-time low would read higher than the ATL itself.
function yearHighDrawdown(closes, cur, high24h, low24h, athValue, athDate, atlValue, atlDate, stored) {
  if (!closes || closes.length < YEAR_HIGH_DAYS - 20 || cur == null) return null;
  const w = closes.slice(-YEAR_HIGH_DAYS);
  let high = Math.max(...w), low = Math.min(...w);
  let highDaysAgo = w.length - w.indexOf(high), lowDaysAgo = w.length - w.indexOf(low);
  let highSrc = 'closes', lowSrc = 'closes'; // 'ohlc' = date only good to a 4-day candle
  if (stored && stored.high > high) { high = stored.high; highDaysAgo = stored.highDaysAgo; highSrc = stored.highSrc ?? 'ohlc'; }
  if (stored && stored.low < low) { low = stored.low; lowDaysAgo = stored.lowDaysAgo; lowSrc = stored.lowSrc ?? 'ohlc'; }
  const liveHigh = Math.max(cur, high24h ?? -Infinity), liveLow = Math.min(cur, low24h ?? Infinity);
  // <= 0.5% tolerance: when a candle wick IS the all-time extreme (same price), prefer the ATL/ATH's
  // exact date over the candle's 4-day-bucket date so the two cards agree.
  if (atlValue != null && atlDate && daysSince(atlDate) <= YEAR_HIGH_DAYS && atlValue <= low * 1.005) { low = Math.min(low, atlValue); lowDaysAgo = daysSince(atlDate); lowSrc = 'exact'; }
  if (athValue != null && athDate && daysSince(athDate) <= YEAR_HIGH_DAYS && athValue >= high * 0.995) { high = Math.max(high, athValue); highDaysAgo = daysSince(athDate); highSrc = 'exact'; }
  if (liveHigh > high) { high = liveHigh; highDaysAgo = 0; highSrc = 'exact'; }
  if (liveLow < low) { low = liveLow; lowDaysAgo = 0; lowSrc = 'exact'; }
  return {
    high, low, highDaysAgo, lowDaysAgo, highApprox: highSrc === 'ohlc', lowApprox: lowSrc === 'ohlc',
    pct: (cur - high) / high * 100,          // drawdown from the 365d high (<= 0)
    abovePct: (cur - low) / low * 100,       // distance above the 365d low (>= 0)
    rangePos: high > low ? (cur - low) / (high - low) * 100 : null // 0 = at low, 100 = at high
  };
}

function classifyHolding(md, item, ta, macroTa) {
  if (!md) {
    return {
      signal: 'NA', colorKey: 'na', strength: 0,
      reason: 'No market data yet for this coin — waiting on the next price refresh.',
      volume: null, mcap: null, rank: null, athPct: null, athValue: null, athDate: null, atlValue: null, atlDate: null, low24h: null, high24h: null, volMcapRatio: null
    };
  }
  if (md.notFound) {
    return {
      signal: 'NA', colorKey: 'na', strength: 0,
      reason: 'This coin was not found in the latest CoinGecko market data. It may have been delisted, or the coin ID no longer matches — worth checking manually before assuming anything about the position.',
      volume: null, mcap: null, rank: null, athPct: null, athValue: null, athDate: null, atlValue: null, atlDate: null, low24h: null, high24h: null, volMcapRatio: null
    };
  }

  const volume = md.total_volume;
  const mcap = md.market_cap;
  const rank = md.market_cap_rank;
  const cur = pricesCache[item.id] ?? md.current_price;
  const athValue = (md.ath != null && cur != null) ? Math.max(md.ath, cur) : md.ath;
  const athPct = (athValue != null && cur != null) ? (athValue === md.ath ? md.ath_change_percentage : 0) : md.ath_change_percentage;
  const athDate = md.ath_date;
  // True when today's live price — not CoinGecko's recorded ath/atl_date — is what's setting the
  // extreme, so the recorded date would otherwise go stale next to an updated value.
  const isLiveAth = (athValue != null && cur != null) && athValue === cur && (md.ath == null || cur > md.ath);
  const atlValue = (md.atl != null && cur != null) ? Math.min(md.atl, cur) : md.atl;
  const atlDate = md.atl_date;
  const isLiveAtl = (atlValue != null && cur != null) && atlValue === cur && (md.atl == null || cur < md.atl);
  const low24h = md.low_24h;
  const high24h = md.high_24h;
  const ownReturnPct = calcReturnPct(ta?.closes, REL_STRENGTH_WINDOW_DAYS);
  const btcReturnPct = calcReturnPct(macroTa?.closes, REL_STRENGTH_WINDOW_DAYS);
  const relStrengthVsBtc = (ownReturnPct != null && btcReturnPct != null) ? (ownReturnPct - btcReturnPct) : null;
  // RSI, EMA-200, and the 20/50 sentiment EMAs are recomputed here with today's live price appended
  // as a provisional final point — not read from the once-a-day cached `ta.rsi`/`ta.emaLong`. This
  // keeps them on the same clock as `nearLow` below (which already reacts to live price via
  // effectiveLow); without this they'd lag the near-low check by up to ~24h until the next TA
  // refresh, so a coin could satisfy "near its low" instantly on a sharp intraday move while RSI
  // still showed yesterday's less-extreme reading. `ta.closes`, `rollingLow`, `avgDailyMove`, and
  // the relative-strength returns above intentionally stay closed-candle-only — those are trailing
  // volatility/trend windows, not "current state" reads, so today's still-forming price shouldn't
  // feed into them.
  const liveCloses = (ta?.closes && ta.closes.length && cur != null) ? ta.closes.concat([cur]) : (ta?.closes ?? null);
  const liveRsiSeries = liveCloses ? calcRSISeries(liveCloses, RSI_PERIOD) : [];
  const liveRsi = liveRsiSeries.length ? liveRsiSeries[liveRsiSeries.length - 1] : (ta?.rsi ?? null);
  const liveEmaLongSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_LONG) : [];
  const liveEmaLong = liveEmaLongSeries.length ? liveEmaLongSeries[liveEmaLongSeries.length - 1] : (ta?.emaLong ?? null);
  const emaFastShortSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_FAST_SHORT) : [];
  const emaFastLongSeries = liveCloses ? calcEMASeries(liveCloses, EMA_TREND_FAST_LONG) : [];
  const emaFastShort = emaFastShortSeries.length ? emaFastShortSeries[emaFastShortSeries.length - 1] : null;
  const emaFastLong = emaFastLongSeries.length ? emaFastLongSeries[emaFastLongSeries.length - 1] : null;
  const sentiment = (emaFastShort == null || emaFastLong == null)
    ? null
    : emaFastShort > emaFastLong ? 'Bullish' : emaFastShort < emaFastLong ? 'Bearish' : 'Mixed';

  const noTradingData = (volume == null || mcap == null);
  const zeroMcap = !noTradingData && mcap === 0;
  const volMcapRatio = (!noTradingData && mcap > 0) ? volume / mcap : null;
  const negligibleVolume = !noTradingData && mcap < MICROCAP_FLOOR && volume < ABSOLUTE_DEAD_VOLUME;
  const deadLiquidity = noTradingData || volume === 0 || zeroMcap || negligibleVolume || (volMcapRatio != null && volMcapRatio < LIQUIDITY_DEAD_RATIO);
  const microcap = mcap != null && mcap < MICROCAP_FLOOR;
  const poorRank = rank == null || rank > RANK_CAUTION;
  const atRisk = !deadLiquidity && microcap && poorRank;

  let signal, colorKey, strength, reason;
  const depth = athPct != null ? Math.abs(athPct) : null;
  const athTiers = ta?.athTiers ?? { extreme: DCA_EXTREME_PCT, deep: DCA_DEEP_PCT, moderate: DCA_MODERATE_PCT, watch: DCA_WATCH_PCT };
  const yearTiers = ta?.yearTiers ?? { extreme: DCA_YEAR_EXTREME_PCT, deep: DCA_YEAR_DEEP_PCT, moderate: DCA_YEAR_MODERATE_PCT };
  const yr = yearHighDrawdown(ta?.closes, cur, high24h, low24h, athValue, athDate, atlValue, atlDate, ta?.year);
  const yrNote = yr ? `, ${Math.abs(yr.pct).toFixed(0)}% below ${YEAR_HIGH_DAYS}d high` : '';

  if (deadLiquidity) {
    signal = 'EXIT'; colorKey = 'sell';
    strength = (noTradingData || zeroMcap) ? 90 : Math.max(60, Math.min(95, Math.round(100 - ((volMcapRatio ?? 0) / LIQUIDITY_DEAD_RATIO) * 40)));
    reason = noTradingData
      ? `No volume or market-cap data from CoinGecko — trading has likely stopped. Verify manually.`
      : zeroMcap
      ? `CoinGecko reports a ₹0 market cap — likely defunct, delisted, or migrated. Verify manually.`
      : negligibleVolume
      ? `Volume (${formatINR(volume)}) is negligible against a ${formatINR(mcap)} market cap. No real market to sell into.`
      : `Volume/market-cap ratio (${(volMcapRatio * 100).toFixed(2)}%) has dried up — there may be no real market left here.`;
  } else if (atRisk) {
    signal = 'AT RISK'; colorKey = 'trim';
    strength = 50;
    reason = `Micro-cap (${formatINR(mcap)}${rank ? `, #${rank}` : ', unranked'}) — real survival risk. Not an exit call, but not a place to add either.`;
  } else if (athPct != null) {
    if (athPct <= athTiers.moderate && yr != null && yr.pct > yearTiers.moderate) {
      // Discounted vs ATH, but no real pullback from the past year's high — nothing recent to buy.
      signal = 'HOLD'; colorKey = 'hold';
      strength = 35;
      reason = `${depth.toFixed(0)}% below ATH, but only ${Math.abs(yr.pct).toFixed(0)}% below its ${YEAR_HIGH_DAYS}d high (needs ≥${Math.abs(yearTiers.moderate).toFixed(0)}% for this coin) — no meaningful recent pullback to buy.`;
    } else if (athPct <= athTiers.extreme && (yr == null || yr.pct <= yearTiers.extreme)) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 20;
      reason = `${depth.toFixed(0)}% below ATH${yrNote} — extreme, but depth alone isn't a floor. Watching for a better entry.`;
    } else if (athPct <= athTiers.deep && (yr == null || yr.pct <= yearTiers.deep)) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 30;
      reason = `${depth.toFixed(0)}% below ATH${yrNote} — deep discount, but that alone doesn't confirm the fall has stopped.`;
    } else if (athPct <= athTiers.moderate) {
      signal = 'WAIT'; colorKey = 'hold';
      strength = 25;
      reason = `${depth.toFixed(0)}% below ATH${yrNote} — meaningful discount, but not yet a confirmed add.`;
    } else if (athPct <= athTiers.watch) {
      signal = 'HOLD'; colorKey = 'hold';
      strength = 35;
      reason = `Only ${depth.toFixed(0)}% below ATH — not a deep enough discount yet.`;
    } else {
      signal = 'TRIM'; colorKey = 'trim';
      strength = 55;
      reason = `Just ${depth.toFixed(0)}% below ATH — closer to profit-taking than buying.`;
    }
  } else {
    signal = 'HOLD'; colorKey = 'hold';
    strength = 25;
    reason = `No ATH data yet to judge discount.`;
  }

  const atlWithinWindow = (atlDate && ta?.rollingLowWindowDays != null) ? daysSince(atlDate) <= ta.rollingLowWindowDays : false;
  // Folds in low_24h too, not just `cur` — without it, a coin that wicked below the rolling low
  // intraday and then bounced back before this render would show a 90-day low that's contradicted
  // by its own 24h range (low_24h < the "90-day" low), since the 24h window is always inside the
  // 90-day one.
  const effectiveLow = (ta?.rollingLow != null && cur != null)
    ? Math.min(ta.rollingLow, cur, (low24h != null ? low24h : Infinity), (atlWithinWindow && atlValue != null) ? atlValue : Infinity)
    : null;
  // True when something from today (live price or today's 24h-low reading) — not a confirmed prior
  // extreme — is what's setting the low, i.e. the coin is currently probing a fresh low, so this
  // figure will keep moving with price.
  const isLiveLow = (effectiveLow != null && cur != null)
    && (effectiveLow === cur || effectiveLow === low24h)
    && (ta?.rollingLow == null || effectiveLow < ta.rollingLow);
  // Days ago for whichever source actually set effectiveLow: today (live price or today's 24h low),
  // a historical ATL that folded in because it's both within the window and lower than the
  // rolling-close low, or the rolling-close low itself (position within the daily-closes window).
  const effectiveLowDaysAgo = isLiveLow
    ? 0
    : (atlWithinWindow && atlValue != null && effectiveLow === atlValue)
      ? daysSince(atlDate)
      : (ta?.rollingLowDaysAgo ?? null);
  // CoinGecko's OHLC candles are 4 days wide this far back, so a rolling-low date pulled from one
  // only pins the wick to *somewhere in that 4-day bucket* — not the exact day. Flag it so the UI
  // doesn't imply false precision.
  const lowDaysAgoApprox = !isLiveLow
    && !(atlWithinWindow && atlValue != null && effectiveLow === atlValue)
    && (ta?.rollingLowSrc ?? ta?.rollingExtremesSource) === 'ohlc';

  // Same construction as effectiveLow above, mirrored for the high: fold in the all-time-high
  // when it falls within the rolling window, and let live price or today's 24h-high reading set a
  // fresh intraday high (same reasoning as low24h above — the 24h window can't exceed the 90-day one).
  const athWithinWindow = (athDate && ta?.rollingLowWindowDays != null) ? daysSince(athDate) <= ta.rollingLowWindowDays : false;
  const effectiveHigh = (ta?.rollingHigh != null && cur != null)
    ? Math.max(ta.rollingHigh, cur, (high24h != null ? high24h : -Infinity), (athWithinWindow && athValue != null) ? athValue : -Infinity)
    : null;
  const isLiveHigh = (effectiveHigh != null && cur != null)
    && (effectiveHigh === cur || effectiveHigh === high24h)
    && (ta?.rollingHigh == null || effectiveHigh > ta.rollingHigh);
  const effectiveHighDaysAgo = isLiveHigh
    ? 0
    : (athWithinWindow && athValue != null && effectiveHigh === athValue)
      ? daysSince(athDate)
      : (ta?.rollingHighDaysAgo ?? null);
  const highDaysAgoApprox = !isLiveHigh
    && !(athWithinWindow && athValue != null && effectiveHigh === athValue)
    && (ta?.rollingHighSrc ?? ta?.rollingExtremesSource) === 'ohlc';
  // For extremes taken from 4-day OHLC candles, narrow the date using the known wick price.
  const lowDayK = lowDaysAgoApprox ? refineExtremeDay(ta?.closes, effectiveLowDaysAgo, effectiveLow) : effectiveLowDaysAgo;
  const highDayK = highDaysAgoApprox ? refineExtremeDay(ta?.closes, effectiveHighDaysAgo, effectiveHigh) : effectiveHighDaysAgo;
  const lowRsi = rsiAtExtreme(liveRsiSeries, lowDayK, isLiveLow);
  const highRsi = rsiAtExtreme(liveRsiSeries, highDayK, isLiveHigh);
  // ---- Single source of truth for window extremes and the RSI on their candle ----
  // Every window (90d / 180d / 365d / all-time) picks its low and high from the same candidate list and
  // gets its RSI from ONE routine, so the same extreme can never show two different RSI values, and
  // the add/swing gates read these exact objects. A longer-window candidate only replaces a shorter
  // one if it is genuinely more extreme (beyond data-source noise, EXTREME_TOL), never for a re-measure
  // of the same candle.
  const EXTREME_TOL = 5e-4;
  const liveRsiNow = rsiAtExtreme(liveRsiSeries, 0, true);
  const rsiOf = c => {
    if (c.live) return liveRsiNow;
    const cl = ta?.closes;
    if (c.k == null || !cl || !cl.length || c.k > cl.length) return null; // older than the data we hold
    if (!c.approx) return rsiAtExtreme(liveRsiSeries, c.k, false);
    // Wick extremes from multi-day OHLC candles only know the date to ±4 days: use the nearest-priced
    // close that has an RSI value (RSI needs ~14 candles of warm-up).
    let bestK = null, bd = Infinity;
    for (let k = Math.max(1, c.k - 4); k <= Math.min(cl.length, c.k + 4); k++) {
      if (rsiAtExtreme(liveRsiSeries, k, false) == null) continue;
      const d = Math.abs(cl[cl.length - k] - c.v);
      if (d < bd) { bd = d; bestK = k; }
    }
    return bestK == null ? null : rsiAtExtreme(liveRsiSeries, bestK, false);
  };
  const pickExtreme = (cands, isLow) => {
    let best = null;
    for (const c of cands) {
      if (!c || c.v == null || isNaN(c.v)) continue;
      if (!best || (isLow ? c.v < best.v * (1 - EXTREME_TOL) : c.v > best.v * (1 + EXTREME_TOL))) best = c;
    }
    return best && { ...best, rsi: best.rsi !== undefined ? best.rsi : rsiOf(best) };
  };
  // The 90d extreme is the authoritative candidate (its date/RSI are already resolved above).
  const effLowC = effectiveLow != null ? { v: effectiveLow, k: lowDayK, live: isLiveLow, approx: false, tilde: lowDaysAgoApprox, rsi: lowRsi } : null;
  const effHighC = effectiveHigh != null ? { v: effectiveHigh, k: highDayK, live: isLiveHigh, approx: false, tilde: highDaysAgoApprox, rsi: highRsi } : null;
  const atlK = atlDate ? daysSince(atlDate) : null, athK = athDate ? daysSince(athDate) : null;
  const atlC = atlValue != null && atlK != null ? { v: atlValue, k: isLiveAtl ? 0 : atlK, live: !!isLiveAtl, approx: false, tilde: false } : null;
  const athC = athValue != null && athK != null ? { v: athValue, k: isLiveAth ? 0 : athK, live: !!isLiveAth, approx: false, tilde: false } : null;
  const buildWin = N => {
    const cl = ta?.closes;
    if (!cl || !cl.length || cur == null) return null;
    const w = cl.slice(-N), cLo = Math.min(...w), cHi = Math.max(...w);
    const yrLow = (yr && yr.lowDaysAgo != null && yr.lowDaysAgo <= N) ? { v: yr.low, k: yr.lowDaysAgo, live: yr.lowDaysAgo === 0, approx: !!yr.lowApprox, tilde: !!yr.lowApprox } : null;
    const yrHigh = (yr && yr.highDaysAgo != null && yr.highDaysAgo <= N) ? { v: yr.high, k: yr.highDaysAgo, live: yr.highDaysAgo === 0, approx: !!yr.highApprox, tilde: !!yr.highApprox } : null;
    return {
      n: w.length,
      lo: pickExtreme([effLowC, yrLow, atlK != null && atlK <= N ? atlC : null, { v: cLo, k: w.length - w.indexOf(cLo), live: false, approx: false, tilde: false }], true),
      hi: pickExtreme([effHighC, yrHigh, athK != null && athK <= N ? athC : null, { v: cHi, k: w.length - w.indexOf(cHi), live: false, approx: false, tilde: false }], false)
    };
  };
  const win180 = buildWin(180);
  const win365 = buildWin(YEAR_HIGH_DAYS);
  // Gate references: the shortest window whose extreme was set at an RSI meeting THIS coin's own
  // threshold; if none qualifies, the 90d extreme as before.
  const w90 = ta?.rollingLowWindowDays ?? DCA_DIP_WINDOW_DAYS;
  const osThrG = ta?.rsiOversoldThreshold ?? RSI_OVERSOLD, obThrG = ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT;
  const lowCands = [], highCands = [];
  if (effLowC) lowCands.push({ w: w90, v: effLowC.v, rsi: effLowC.rsi });
  if (effHighC) highCands.push({ w: w90, v: effHighC.v, rsi: effHighC.rsi });
  if (win180 && win180.n > w90 + 5) { if (win180.lo) lowCands.push({ w: 180, v: win180.lo.v, rsi: win180.lo.rsi }); if (win180.hi) highCands.push({ w: 180, v: win180.hi.v, rsi: win180.hi.rsi }); }
  if (win365) { if (win365.lo) lowCands.push({ w: YEAR_HIGH_DAYS, v: win365.lo.v, rsi: win365.lo.rsi }); if (win365.hi) highCands.push({ w: YEAR_HIGH_DAYS, v: win365.hi.v, rsi: win365.hi.rsi }); }
  const qLow = lowCands.find(c => c.rsi != null && c.rsi <= osThrG) || lowCands[0] || null;
  const qHigh = highCands.find(c => c.rsi != null && c.rsi >= obThrG) || highCands[0] || null;
  const gateWindow = qLow ? qLow.w : w90, gateLow = qLow ? qLow.v : effectiveLow;
  const gateHighWindow = qHigh ? qHigh.w : w90, gateHigh = qHigh ? qHigh.v : effectiveHigh;

  const isDiscountCandidate = signal === 'WAIT';
  let dcaStreakDay = null;
  let addReasonShown = false; // true when `reason` below was written by the add pipeline
  if (isDiscountCandidate) {
    const relStrength = relStrengthVsBtc;
    const relStrengthBonus = relStrength == null ? 0 : Math.max(REL_STRENGTH_MIN_BONUS, Math.min(REL_STRENGTH_MAX_BONUS, relStrength / REL_STRENGTH_SCALE));
    const relStrengthNote = relStrength == null
      ? ''
      : ` ${relStrength > 0 ? 'Outperforming' : 'Underperforming'} BTC (${relStrength >= 0 ? '+' : ''}${relStrength.toFixed(1)}pp over ${REL_STRENGTH_WINDOW_DAYS}d) — ${relStrength > 0 ? 'capital may already be rotating in.' : 'weight this accordingly.'}`;

    if (ta && ta.rollingLow != null && cur != null) {
      addReasonShown = true;
      const aboveLow = (cur - gateLow) / gateLow * 100;
      const nearLowThresholdPct = ta.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
      const nearLow = aboveLow <= nearLowThresholdPct;
      const rsiThreshold = ta.rsiOversoldThreshold ?? RSI_OVERSOLD;
      // Both the live reading AND the last closed daily RSI must be oversold: the live RSI includes
      // today's unfinished price, so an intraday spike down alone isn't enough to add.
      const rsiLiveOversold = liveRsi != null && liveRsi <= rsiThreshold;
      const rsiClosedOversold = ta.rsi != null && ta.rsi <= rsiThreshold;
      const rsiOversold = rsiLiveOversold && rsiClosedOversold;
      const avgDailyMove = ta.avgDailyMove ?? null;
      const atLow = nearLow && rsiOversold;
      if (atLow) {
        dcaStreakDay = reconstructStreakDays(ta.closes, cur, rsiThreshold, nearLowThresholdPct, gateWindow);

        const lastLog = dcaLogCache[item.id] ?? null;
        const dynGapPct = Math.max(
          DCA_GAP_FLOOR_PCT,
          Math.min(DCA_GAP_CEIL_PCT, (avgDailyMove ?? DCA_GAP_FLOOR_PCT) * DCA_GAP_MULT)
        );
        const gapPct = lastLog != null ? (lastLog.price - cur) / lastLog.price * 100 : null;
        const gapCleared = lastLog == null || gapPct >= dynGapPct;

        if (gapCleared) {
          signal = 'ACCUMULATE'; colorKey = 'dca';
          strength = Math.round(Math.min(60, strength + 30) + relStrengthBonus);
          const gapNote = lastLog == null ? '' : ` Also ${gapPct.toFixed(1)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}) — a real step down.`;
          const streakNote = dcaStreakDay === 1 ? 'First flagged today.' : `Day ${dcaStreakDay} of this dip.`;
          reason = `${depth.toFixed(0)}% below ATH${yrNote}, ${aboveLow.toFixed(1)}% above its ${gateWindow}d low (within this coin's own ≤${nearLowThresholdPct.toFixed(1)}% band), RSI ${liveRsi.toFixed(2)} (oversold vs this coin's own ≤${rsiThreshold.toFixed(0)} bottom zone) — conditions met. ${streakNote}${gapNote}${relStrengthNote}`;
        } else {
          const nextDcaPrice = lastLog.price * (1 - dynGapPct / 100);
          const positionNote = gapPct >= 0
            ? `only ${gapPct.toFixed(1)}% below last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))})`
            : `${Math.abs(gapPct).toFixed(1)}% above last DCA (${formatINR(lastLog.price, pricePrecisionFor(lastLog.price))}), not below it`;
          reason = `Still meets add conditions (day ${dcaStreakDay}), but ${positionNote}. Needs ≥${dynGapPct.toFixed(1)}% below that — next DCA near ${formatINR(nextDcaPrice, pricePrecisionFor(nextDcaPrice))}. Held at WAIT.${relStrengthNote}`;
        }
      } else {
        if (nearLow && rsiLiveOversold && !rsiClosedOversold) {
          reason = `${depth.toFixed(0)}% below ATH${yrNote}, near its ${gateWindow}d low, live RSI ${liveRsi.toFixed(2)} is oversold (≤${rsiThreshold.toFixed(0)}), but the last daily close (RSI ${ta.rsi == null ? '—' : ta.rsi.toFixed(2)}) hasn't confirmed it yet — waiting for a daily close.`;
        } else if (nearLow && !rsiOversold) {
          reason = `${depth.toFixed(0)}% below ATH${yrNote}, near its ${gateWindow}d low, but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own oversold zone (≤${rsiThreshold.toFixed(0)}) yet.`;
        } else {
          reason = `${depth.toFixed(0)}% below ATH${yrNote}, but ${Math.abs(aboveLow).toFixed(1)}% ${aboveLow >= 0 ? 'above' : 'below'} its ${gateWindow}d low — outside this coin's own ≤${nearLowThresholdPct.toFixed(1)}% near-low band.`;
        }
      }
    } else {
      reason = `Not enough price history loaded yet to judge proximity to its recent-range low.`;
    }
  }

  // Interim range-trade signal: while a coin is just riding out a WAIT/HOLD stretch (not already
  // an ACCUMULATE, the ATH-tier TRIM, or a risk/liquidity call), a confirmed poke at the top of its
  // own recent range is a chance to bank a partial profit and rebuy lower — independent of whether
  // the user's own longer-term sell target has been reached.
  // Which question applies to a WAIT coin — "should I add?" or "should I trim?" — is decided FIRST, from
  // the plain 90d range: whichever extreme price is nearer to (as % of the current price). Only then are
  // that question's gates (and its reasoning) evaluated against the RSI-qualified references.
  const dToLow = (effectiveLow != null && cur) ? (cur - effectiveLow) / cur : null;
  const dToHigh = (effectiveHigh != null && cur) ? (effectiveHigh - cur) / cur : null;
  const lean = (dToLow != null && dToHigh != null && dToHigh < dToLow) ? 'swing' : 'add';
  let nearHigh = false;
  const swingHigh = gateHigh ?? effectiveHigh;
  if (effectiveHigh != null && cur != null && signal !== 'EXIT' && signal !== 'AT RISK' && signal !== 'ACCUMULATE' && signal !== 'TRIM') {
    const belowHighPct = (swingHigh - cur) / swingHigh * 100;
    const nearHighThresholdPct = ta?.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT;
    nearHigh = belowHighPct <= nearHighThresholdPct;
    const rsiOverboughtThreshold = ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT;
    const rsiOverbought = liveRsi != null && liveRsi >= rsiOverboughtThreshold;
    const windowLabel = gateHighWindow;
    if (nearHigh && rsiOverbought) {
      signal = 'SWING TRIM'; colorKey = 'swing';
      strength = Math.max(strength, 50);
      const targetNote = item.target != null ? ` Still well short of your ₹${item.target} target, so this is a partial-profit/rebuy-lower play, not an exit.` : '';
      reason = `${belowHighPct.toFixed(1)}% below its ${windowLabel}d high (within its own ≤${nearHighThresholdPct.toFixed(1)}% band), RSI ${liveRsi.toFixed(2)} (overbought vs this coin's own ≥${rsiOverboughtThreshold.toFixed(0)} top zone) — a reasonable spot to trim into strength.${targetNote}`;
    } else if (lean === 'swing' && addReasonShown && signal === 'WAIT') {
      // The coin is nearer its range top than its range low, so explain the trim question, not the add one.
      const lead = `${belowHighPct.toFixed(1)}% below its ${windowLabel}d high`;
      reason = nearHigh
        ? `${lead} (within this coin's own ≤${nearHighThresholdPct.toFixed(1)}% band), but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(0)}) yet.`
        : `${lead} — outside this coin's own ≤${nearHighThresholdPct.toFixed(1)}% near-high band, and RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) is below this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(0)}).`;
    } else if (nearHigh) {
      reason = `${reason} Also ${belowHighPct.toFixed(1)}% below its ${windowLabel}d high, but RSI (${liveRsi == null ? '—' : liveRsi.toFixed(2)}) hasn't reached this coin's own overbought zone (≥${rsiOverboughtThreshold.toFixed(0)}) yet.`;
    }
  }

  const nearTarget = item.target && cur != null ? (cur >= item.target * (1 - TARGET_PROXIMITY_PCT / 100)) : false;
  if (nearTarget && signal !== 'EXIT' && signal !== 'AT RISK') {
    signal = 'TRIM'; colorKey = 'trim';
    strength = 55;
    reason = `Price is at or within ${TARGET_PROXIMITY_PCT}% of your target (₹${item.target}) — worth considering a trim regardless of what the underlying discount signal says.`;
  }

  return {
    signal, colorKey, strength, reason,
    volume, mcap, rank, athPct, athValue, athDate, atlValue, atlDate, isLiveAth, isLiveAtl, low24h, high24h, volMcapRatio,
    change7d: md.change_7d, change30d: md.change_30d,
    rsi: liveRsi,
    rsiOversoldThreshold: ta?.rsiOversoldThreshold ?? RSI_OVERSOLD,
    rsiOverboughtThreshold: ta?.rsiOverboughtThreshold ?? RSI_OVERBOUGHT,
    nearLowThresholdPct: ta?.nearLowThresholdPct ?? DCA_DIP_NEAR_PCT,
    athTiers,
    closesEndTs: ta?.closesEndTs ?? null,
    yearTiers,
    high365: yr ? yr.high : null,
    drawdown365: yr ? yr.pct : null,
    high365DaysAgo: yr ? yr.highDaysAgo : null,
    high365Approx: yr ? yr.highApprox : false,
    low365Approx: yr ? yr.lowApprox : false,
    low365: yr ? yr.low : null,
    above365Low: yr ? yr.abovePct : null,
    low365DaysAgo: yr ? yr.lowDaysAgo : null,
    range365Pos: yr ? yr.rangePos : null,
    emaLong: liveEmaLong,
    rollingLow: ta?.rollingLow ?? null,
    effectiveLow,
    gateLow,
    gateLowWindow: gateWindow,
    effectiveLowDaysAgo: lowDayK,
    lowDaysAgoApprox,
    lowRsi,
    win180, win365,
    isLiveLow,
    rollingHigh: ta?.rollingHigh ?? null,
    effectiveHigh,
    gateHigh,
    lean,
    gateHighWindow,
    effectiveHighDaysAgo: highDayK,
    highDaysAgoApprox,
    highRsi,
    isLiveHigh,
    rollingLowWindowDays: ta?.rollingLowWindowDays ?? null,
    rollingExtremesSource: ta?.rollingExtremesSource ?? null,
    cmp: cur ?? null,
    relStrengthVsBtc,
    sentiment,
    taStale: !ta,
    dcaStreakDay,
  };
}

let apiWasDown = false;
async function checkApiStatus() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const start = performance.now();
    const res = await fetch(`${API_BASE}/ping?x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    setCurrentStatus(`Live · ${(performance.now() - start).toFixed(0)}ms`, 'ok');
    if (apiWasDown) { setActivityStatus('API reachable again.', 'ok'); apiWasDown = false; }
    return true;
  } catch (err) {
    const message = err.message || '';
    const isNetwork = message.includes('fetch') || err.name === 'TypeError' || err.name === 'AbortError';
    let text = 'Using cached data';
    if (isNetwork) text = 'Connection failed — using cache';
    else if (message.includes('429')) text = 'Rate limited — using cache';
    else if (/5\d{2}/.test(message)) text = 'API down — using cache';
    setCurrentStatus(text, 'error');
    setActivityStatus(text + '.', 'error');
    apiWasDown = true;
    return false;
  }
}

async function loadCoinList(isApiReachable) {
  const cached = localStorage.getItem(CACHE_KEY);
  symbolInput.disabled = false;

  const buildIndex = (list) => {
    symbolIndex = {};
    list.forEach(c => {
      const s = (c.symbol || '').toLowerCase();
      (symbolIndex[s] ||= []).push({ id: c.id, name: c.name, symbol: (c.symbol || '').toUpperCase() });
    });
  };

  if (cached) {
    try {
      const parsed = JSON.parse(cached);
      const list = parsed.list || [];
      if (list.length > 0 && (Date.now() - (parsed.timestamp || 0)) < CACHE_DURATION) {
        coinList = list;
        buildIndex(coinList);
        coinListLoaded = true;
        addBtn.disabled = true;
        symbolInput.placeholder = 'Type a coin symbol or name to add it…';
        setActivityStatus('Coin list loaded from cache.', 'ok');
        return;
      }
    } catch { localStorage.removeItem(CACHE_KEY); }
  }

  if (!isApiReachable) {
    symbolInput.placeholder = 'Coin list unavailable (API down)';
    setActivityStatus('Coin list unavailable — cannot add new coins right now.', 'error');
    return;
  }

  setActivityStatus('Fetching coin list…', 'info');
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 7000);
    const res = await fetch(`${API_BASE}/coins/list?x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!res.ok) throw new Error(`HTTP_ERROR:${res.status}`);
    coinList = await res.json() || [];
    buildIndex(coinList);
    localStorage.setItem(CACHE_KEY, JSON.stringify({ list: coinList, timestamp: Date.now() }));
    coinListLoaded = true;
    addBtn.disabled = true;
    symbolInput.placeholder = 'Type a coin symbol or name to add it…';
    setActivityStatus('Coin list loaded.', 'ok');
  } catch (err) {
    symbolInput.placeholder = 'Coin list unavailable (API failed)';
    setActivityStatus('Coin list failed to load — cannot add new coins right now.', 'error');
  }
}

async function fetchPricesChunk(validIds, attempt = 0) {
  const maxRetries = 2;
  while (attempt <= maxRetries) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000);
      const res = await fetch(`${API_BASE}/coins/markets?vs_currency=inr&ids=${validIds.join(',')}&order=market_cap_desc&per_page=250&page=1&sparkline=false&price_change_percentage=7d,30d&x_cg_demo_api_key=${API_KEY}`, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      const foundIds = new Set();
      let updated = 0;
      data.forEach(coin => {
        foundIds.add(coin.id);
        if (coin.current_price != null) { pricesCache[coin.id] = coin.current_price; updated++; }
        marketDataCache[coin.id] = {
          total_volume: coin.total_volume,
          market_cap: coin.market_cap,
          market_cap_rank: coin.market_cap_rank,
          ath: coin.ath,
          ath_change_percentage: coin.ath_change_percentage,
          ath_date: coin.ath_date,
          atl: coin.atl,
          atl_date: coin.atl_date,
          low_24h: coin.low_24h,
          high_24h: coin.high_24h,
          current_price: coin.current_price,
          change_24h: coin.price_change_percentage_24h,
          change_7d: coin.price_change_percentage_7d_in_currency,
          change_30d: coin.price_change_percentage_30d_in_currency,
          notFound: false,
          timestamp: Date.now()
        };
      });
      validIds.forEach(id => {
        if (!foundIds.has(id)) {
          marketDataCache[id] = { notFound: true, timestamp: Date.now() };
        }
      });
      return { updated, total: validIds.length };
    } catch (err) {
      attempt++;
      if (attempt <= maxRetries) await new Promise(r => setTimeout(r, 3000 * attempt));
    }
  }
  return { updated: 0, total: validIds.length };
}

async function fetchPrices(ids) {
  if (!Array.isArray(ids) || !ids.length) return false;
  const validIds = ids.filter(Boolean);
  if (!validIds.length) return false;

  const chunks = [];
  for (let i = 0; i < validIds.length; i += MAX_IDS_PER_PRICE_CALL) chunks.push(validIds.slice(i, i + MAX_IDS_PER_PRICE_CALL));

  const results = await Promise.all(chunks.map(chunk => fetchPricesChunk(chunk)));
  const updated = results.reduce((a, r) => a + r.updated, 0);

  saveMarketData();
  if (updated > 0) {
    lastPriceTime = Date.now();
    localStorage.setItem('shortfall_prices_time', lastPriceTime);
    savePrices();
    updateScheduledStatus();
  }

  if (updated === validIds.length) {
    return true;
  } else if (updated > 0) {
    setActivityStatus(`Prices partially updated (${updated}/${validIds.length}).`, 'warn');
    return true;
  }
  setActivityStatus('Price update failed — showing cached prices.', 'error');
  return false;
}

function recomputeHoldingSignals() {
  const macroTa = taCache['bitcoin'] || null;
  saved.forEach(item => {
    holdingSignalCache[item.id] = classifyHolding(marketDataCache[item.id] || null, item, taCache[item.id] || null, macroTa);
  });
  saveHoldingSignals();
}

function scheduleApiRecheck() {
  if (recheckTimer) clearTimeout(recheckTimer);
  recheckTimer = setTimeout(async () => {
    setActivityStatus('Re-checking API…', 'info');
    const reachable = await checkApiStatus();
    if (reachable) {
      recheckTimer = null;
      refreshPriceTimer = setInterval(schedulePriceFetch, PRICE_REFRESH_INTERVAL);
      const ids = saved.map(s => s.id).filter(Boolean);
      await fetchPrices(ids);
      recomputeHoldingSignals();
      applyCurrentSort();
      fetchTaForPortfolio([...new Set([...ids, 'bitcoin'])]);
    } else {
      scheduleApiRecheck();
    }
  }, API_RECHECK_INTERVAL);
}

async function schedulePriceFetch() {
  const isApiReachable = await checkApiStatus();
  const ids = saved.map(s => s.id).filter(Boolean);
  if (isApiReachable) {
    await fetchPrices(ids);
    recomputeHoldingSignals();
    updatePricesInTable();
    const taIds = [...new Set([...ids, 'bitcoin'])];
    fetchTaForPortfolio(taIds);
    refreshDayCandles(ids);
  } else {
    updatePricesInTable();
    if (refreshPriceTimer) { clearInterval(refreshPriceTimer); refreshPriceTimer = null; }
    scheduleApiRecheck();
  }
}

const SIGNAL_LABELS_SHORT = {
  'ACCUMULATE': 'ADD', 'HOLD': 'HOLD', 'WAIT': 'WAIT', 'TRIM': 'TRIM', 'SWING TRIM': 'SWING',
  'AT RISK': 'RISK', 'EXIT': 'EXIT', 'NA': 'N/A'
};

function healthOf(id) {
  const entry = marketDataCache[id];
  if (!entry || entry.notFound) return { color: 'var(--sell)', shortLabel: 'No data', fresh: false };
  const stale = (Date.now() - entry.timestamp) >= PRICE_REFRESH_INTERVAL * 3;
  return stale
    ? { color: 'var(--trim)', shortLabel: `Stale ${formatTime(entry.timestamp)}`, fresh: false }
    : { color: 'var(--buy)', shortLabel: '', fresh: true };
}

const SIG_COLOR = { sell: 'var(--sell)', dca: 'var(--dca)', trim: 'var(--trim)', swing: 'var(--swing)', hold: 'var(--hold)', na: 'var(--muted-2)' };

function signalCellHTML(id) {
  const ta = holdingSignalCache[id];
  const health = healthOf(id);
  if (!health.fresh) {
    // Data is stale/missing — the signal was computed from this same data,
    // so it's not trustworthy either. Show only the freshness state, not both.
    const label = health.shortLabel || 'Stale';
    return {
      html: `<div class="signal-wrap">
        <span class="health-dot" style="background:${health.color}"></span>
        <span class="sig-pill na">${label}</span>
      </div>`
    };
  }
  if (!ta || ta.signal === 'NA') {
    return {
      html: `<div class="signal-wrap">
        <span class="health-dot" style="background:${health.color}"></span>
        <span class="sig-pill na">${!marketDataCache[id] ? 'No data' : 'Pending'}</span>
      </div>`
    };
  }
  const label = `${SIGNAL_LABELS_SHORT[ta.signal] || ta.signal} ${ta.strength}%${ta.signal === 'ACCUMULATE' && ta.dcaStreakDay ? `·D${ta.dcaStreakDay}` : ''}`;
  const html = `<div class="signal-wrap">
      <span class="health-dot" style="background:${health.color}"></span>
      <span class="sig-pill" style="--vc:${SIG_COLOR[ta.colorKey] || SIG_COLOR.hold}">${label}</span>
    </div>`;
  return { html };
}

function removeCoin(id, symbol) {

  saved = saved.filter(s => s.id !== id);
  save();
