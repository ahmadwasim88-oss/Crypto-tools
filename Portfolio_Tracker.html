<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Portfolio Tracker</title>
<style>
:root{
  --bg: #0b0f14;
  --panel: #121820;
  --panel-2: #161e28;
  --border: rgba(255,255,255,0.07);
  --text: #e6edf3;
  --muted: #7d8998;
  --muted-2: #566374;
  --accent: #4c8dff;
  --accent-dim: rgba(76,141,255,0.12);
  --buy: #2fd576;
  --buy-dim: rgba(47,213,118,0.12);
  --sell: #ff5c72;
  --sell-dim: rgba(255,92,114,0.12);
  --dca: #22c1d9;
  --trim: #e8a63b;
  --trim-dim: rgba(232,166,59,0.12);
  --swing: #ff5fa2;
  --swing-dim: rgba(255,95,162,0.12);
  --hold: #7d8998;
  --target: #f5d90a;
  --rsi: #c792ea;
  --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Roboto Mono", Consolas, monospace;
  --font-ui: -apple-system, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-sm: 6px;
  --r-md: 10px;
}
*{ box-sizing: border-box; }
html, body {
  height: 100%;
  margin: 0;
  font-family: var(--font-ui);
  font-size: 13px;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
  max-width: 100%;
  overflow-x: hidden;
  overflow-anchor: none;
}
body { padding: 8px 8px calc(52px + env(safe-area-inset-bottom, 0px)); }
.app { max-width: min(100%, 1400px); margin: 0 auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.brand h1 {
  margin: 0;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: -0.01em;
  color: var(--text);
}
.status-panel {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  justify-content: flex-end;
}
.pill {
  font-size: 11px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pill.ok { color: var(--buy); background: var(--buy-dim); border-color: rgba(47,213,118,0.25); }
.pill.ok .dot { background: var(--buy); }
.pill.warn { color: var(--trim); background: var(--trim-dim); border-color: rgba(232,166,59,0.25); }
.pill.warn .dot { background: var(--trim); }
.pill.error { color: var(--sell); background: var(--sell-dim); border-color: rgba(255,92,114,0.25); }
.pill.error .dot { background: var(--sell); }
.pill.info { color: var(--muted); background: var(--panel-2); }
.pill.info .dot { background: var(--muted); }
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
  position: relative;
}
input[type="text"], input[type="number"] {
  font-family: var(--font-ui);
  padding: 7px 10px;
  border-radius: var(--r-sm);
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
  font-size: 13px;
}
input[type="text"]:focus, input[type="number"]:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-dim);
}
input::placeholder { color: var(--muted-2); }
.symbol-input { flex: 1; min-width: 0; }
button {
  font-family: var(--font-ui);
  background: var(--accent);
  border: none;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  color: #06101f;
  cursor: pointer;
  font-weight: 600;
  font-size: 13px;
  white-space: nowrap;
  transition: filter 0.12s ease, opacity 0.12s ease;
}
button:hover:not(:disabled) { filter: brightness(1.1); }
button:disabled { opacity: 0.4; cursor: not-allowed; }
.table-scroll-wrapper {
  overflow-x: auto;
  overflow-y: visible;
  max-height: none;
  border: 1px solid var(--border);
  border-radius: var(--r-md);
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--panel);
  font-size: 11px;
}
th, td { padding: 6px 7px; text-align: left; white-space: nowrap; font-size: 10.5px; }
th.numeric, td.numeric { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
th.center, td.center { text-align: center; }
th {
  background: var(--panel-2);
  font-weight: 600;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--muted);
  position: sticky;
  top: 0;
  border-bottom: 1px solid var(--border);
  padding: 8px 10px;
}
th.sortable { cursor: pointer; user-select: none; }
th.sortable:hover { color: var(--text); }
.sort-arrow { margin-left: 4px; color: var(--accent); font-weight: 700; }
tbody tr.main-row { border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.12s ease; scroll-margin-top: 6px; }
tbody tr.main-row:hover { background: rgba(255,255,255,0.025); }
tbody tr.main-row:last-child { border-bottom: none; }
td[data-col="coin"] { overflow: hidden; text-overflow: ellipsis; }
.coin-name { font-weight: 600; font-size: 10.5px; overflow: hidden; text-overflow: ellipsis; }
.health-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 2px; flex-shrink: 0; }
.target-input {
  width: 82px; text-align: right; padding: 3px 4px; font-size: 10px;
  font-family: inherit; line-height: normal; box-sizing: border-box;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
}
.target-display {
  display: inline-block; padding: 3px 2px; cursor: pointer;
  border-bottom: 1px dashed var(--border);
}
.target-display.target-unset { color: var(--muted-2); }
.gain-pos { color: var(--buy); font-weight: 600; }
.gain-neg { color: var(--sell); font-weight: 600; }
.gain-na { color: var(--muted-2); }
.signal-cell { min-width: 0; }
.signal-wrap { display: flex; align-items: center; justify-content: center; gap: 3px; }
.empty-row td { text-align: center; color: var(--muted-2); padding: 32px 12px; }
.detail-box { padding: 10px; transition: opacity 0.1s ease; touch-action: pan-y; }
.detail-box.swipe-out { opacity: 0.3; }
.detail-reason {
  font-size: 11.5px;
  color: var(--muted);
  line-height: 1.5;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  overflow-wrap: anywhere;
}
.detail-reason b { color: var(--text); }
.detail-remove-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  background: var(--sell-dim);
  color: var(--sell);
  border: 1px solid rgba(255,92,114,0.25);
}
.dca-log-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.dca-log-status {
  font-size: 11px;
  color: var(--muted-2);
}
.dca-log-actions { display: flex; gap: 6px; flex-shrink: 0; }
.dca-log-btn {
  background: var(--panel);
  color: var(--dca);
  border: 1px solid rgba(34,193,217,0.35);
  font-size: 11.5px;
  padding: 6px 12px;
}
.dca-log-clear-btn {
  background: transparent;
  color: var(--muted-2);
  border: 1px solid var(--border);
  font-size: 11.5px;
  padding: 6px 12px;
}
.chart-toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}
.chart-toggle-btn {
  background: var(--panel);
  color: var(--accent);
  border: 1px solid rgba(76,141,255,0.3);
  font-size: 11.5px;
  padding: 6px 12px;
}
.chart-external-link {
  font-size: 11px;
  color: var(--muted-2);
  text-decoration: none;
  white-space: nowrap;
}
.chart-external-link:hover { color: var(--accent); }
.chart-container {
  display: none;
  margin-top: 10px;
  border-radius: var(--r-sm);
  overflow: hidden;
  border: 1px solid var(--border);
  min-height: 60px;
  max-width: 100%;
}
.chart-container > div { max-width: 100%; overflow: hidden; }
.chart-loading {
  padding: 24px 12px;
  text-align: center;
  font-size: 11.5px;
  color: var(--muted-2);
}
#suggestBox {
  position: absolute;
  z-index: 40;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: var(--r-sm);
  max-height: 260px;
  overflow-y: auto;
  display: none;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.suggestion-item { padding: 8px 12px; cursor: pointer; font-size: 12.5px; border-bottom: 1px solid var(--border); }
.suggestion-item:last-child { border-bottom: none; }
.suggestion-item:hover { background: var(--accent-dim); }
.suggestion-no-result { padding: 10px 12px; color: var(--muted-2); font-size: 12px; }
.activity-log-container {
  position: fixed;
  bottom: 0; left: 0; width: 100%;
  z-index: 50;
  padding: 9px 14px calc(9px + env(safe-area-inset-bottom, 0px));
  background: rgba(6,10,15,0.97);
  border-top: 1px solid var(--border);
  backdrop-filter: blur(6px);
}
.status-line {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted-2);
  white-space: nowrap;
  overflow: hidden;
}
.status-line .sl-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted-2);
  flex-shrink: 0;
  transition: background 0.3s ease, box-shadow 0.3s ease;
}
.status-line span#statusLineText {
  overflow: hidden;
  text-overflow: ellipsis;
  transition: color 0.3s ease;
}
.status-line.ok .sl-dot { background: var(--buy); box-shadow: 0 0 6px rgba(47,213,118,0.6); }
.status-line.ok span#statusLineText { color: var(--buy); }
.status-line.warn .sl-dot { background: var(--trim); box-shadow: 0 0 6px rgba(232,166,59,0.6); }
.status-line.warn span#statusLineText { color: var(--trim); }
.status-line.error .sl-dot { background: var(--sell); box-shadow: 0 0 6px rgba(255,92,114,0.6); }
.status-line.error span#statusLineText { color: var(--sell); }

.discover-section { padding: 12px 14px 16px; }
.discover-section > button { width: 100%; background: var(--panel-2); color: var(--dca); border: 1px solid rgba(34,193,217,0.35); }
.discover-section > button:disabled { color: var(--muted); border-color: var(--border); }
.discover-card { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-top: 10px; background: var(--panel); }
.discover-card .dc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.discover-card .dc-symbol { font-weight: 700; }
.discover-card .dc-name { color: var(--muted); font-size: 12px; margin-left: 6px; }
.discover-card .dc-add { padding: 4px 10px; font-size: 13px; }
.discover-card .dc-reason { color: var(--muted); font-size: 12px; margin-top: 6px; line-height: 1.4; }
.discover-empty { color: var(--muted); font-size: 13px; padding: 10px 2px; }

/* ===== v2 layout: compact table, signal chips, redesigned expanded row ===== */
:root{ --track:#222d3a; --ring:rgba(76,141,255,0.55); }
table{table-layout:fixed}
th{font-size:8.5px;letter-spacing:0;padding:7px 4px}
td{padding:5px 4px}
th:first-child,td:first-child{padding-left:9px}
th:last-child,td:last-child{padding-right:8px}
td.price-cell{line-height:1.15}
.px-main{display:block;font-size:10.5px;font-weight:600}
.price-change-24h{display:block;font-size:9px;font-weight:600;margin-top:1px;line-height:1.1}
.price-change-24h em{font-style:normal;color:var(--muted-2);font-weight:500}
.price-change-24h.chg-roll{color:var(--muted)}
td.numeric{font-size:10.5px}
.target-display{font-size:10.5px;font-weight:600;border-bottom:1px dashed var(--muted-2);padding:0 0 1px}
.target-display.target-unset{font-size:9px;font-weight:500;font-family:var(--font-ui);border-bottom-color:var(--border)}
.target-input{width:100%;min-width:0}
.gain-cell{font-weight:600}
.sig-pill{display:inline-block;padding:1px 5px;border-radius:999px;font-weight:700;font-size:9px;letter-spacing:.02em;white-space:nowrap;background:color-mix(in srgb,var(--vc) 15%,transparent);color:var(--vc);border:1px solid color-mix(in srgb,var(--vc) 38%,transparent)}
.sig-pill.na{background:none;border:0;color:var(--muted-2);padding:0;font-weight:600}
tbody tr.main-row.open>td{background:var(--panel-2)}
tbody tr.main-row.open .coin-name{color:var(--accent)}
.detail-box{padding:0 8px 8px;border-top:1px dashed rgba(76,141,255,0.35)}
.dx{display:flex;flex-direction:column;gap:7px;padding-top:7px}
.dx .buy{color:var(--buy)}.dx .sell{color:var(--sell)}.dx .muted{color:var(--muted)}
.dx-verdict{border-left:3px solid var(--vc);background:color-mix(in srgb,var(--vc) 12%,transparent);border-radius:8px;padding:6px 8px;display:flex;gap:8px;align-items:flex-start}
.dx-vp{flex:none;padding:2px 8px;border-radius:999px;font-weight:700;font-size:10px;background:var(--vc);color:#06101f;white-space:nowrap}
.dx-verdict p{margin:0;font-size:11px;line-height:1.35}
.dx h3{margin:0 0 3px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dx-gate{display:grid;grid-template-columns:14px 1fr auto;gap:7px;align-items:center;padding:3px 0;border-top:1px solid var(--border)}
.dx-gate:first-of-type{border-top:0}
.dx-ic{width:14px;height:14px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:700;color:#06101f}
.dx-ic.ok{background:var(--buy)}.dx-ic.no{background:var(--sell)}.dx-ic.na{background:var(--muted)}
.dx-l{font-weight:600;font-size:10.5px}
.dx-gs{display:block;font-family:var(--font-mono);font-weight:400;font-size:9px;line-height:1.3;color:var(--muted);text-align:right}
.dx-v{font-family:var(--font-mono);font-size:10.5px;text-align:right;white-space:nowrap}
.dx-v b.na{color:var(--muted)}
.dx-req{color:var(--muted)}
.dx-oth{font-size:9.5px;color:var(--muted);margin-top:3px}
.dx-blk{padding:5px 0 4px}
.dx-blk + .dx-blk{border-top:1px solid var(--border)}
.dx-blk .dx-rng{margin-top:0}
.dx-rng{display:grid;grid-template-columns:50px auto 1fr auto;gap:6px;align-items:center;font-family:var(--font-mono);font-size:9.5px;margin-top:5px;color:var(--muted)}
.dx-rng b{font-family:var(--font-ui);font-size:10px;color:var(--text);white-space:nowrap}
.dx-bar{position:relative;height:6px;border-radius:3px;margin:0 6px;background:var(--track);--mid:50%;background:linear-gradient(90deg,color-mix(in srgb,var(--sell) 50%,var(--track)) 0%,color-mix(in srgb,var(--sell) 22%,var(--track)) var(--mid),color-mix(in srgb,var(--buy) 22%,var(--track)) var(--mid),color-mix(in srgb,var(--buy) 50%,var(--track)) 100%)}
.dx-bar .m{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--panel-2);transform:translate(-50%,-50%);box-shadow:0 0 0 1.5px var(--accent)}
.dx-bar .o{position:absolute;top:-3px;width:2px;height:12px;background:var(--muted);transform:translateX(-50%)}
.dx-met{display:flex;flex-wrap:wrap;justify-content:space-between;column-gap:8px;font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin:2px 0 0 56px}
.dx-met b{color:var(--text);font-weight:600}
.dx-met .dt{font-style:normal;margin:0 .3em}
@media (max-width:380px){.dx-met{font-size:9px}}
.dx-met div:last-child{text-align:right;margin-left:auto}
.dx-sub{font-family:var(--font-mono);font-size:9.5px;color:var(--muted);margin:1px 0 0 56px}
.dx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.dx-cell{background:var(--bg);border-radius:8px;padding:6px 8px;min-width:0}
.dx-cell .k{font-size:9px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-cell .n{font-family:var(--font-mono);font-weight:700;font-size:11px;margin-top:1px}
.dx-cell .s{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dx-liq{display:flex;flex-wrap:wrap;gap:1px 9px;font-size:9.5px;color:var(--muted)}
.dx-liq b{color:var(--text);font-weight:600}
.dx-cell .n.rsi{color:var(--rsi)}.dx-cell .n.tgt{color:var(--target)}
.dx-hint{font-size:9px;color:var(--muted-2);margin-top:3px}
.dx-acts{display:flex;gap:6px;align-items:stretch}
.dx-acts>*{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;border-radius:8px;border:1px solid var(--border);font-weight:600;font-size:10.5px;background:transparent;margin:0;width:auto;text-decoration:none;white-space:nowrap}
.dx-acts .chart-toggle-btn{color:var(--text)}
.dx-acts .chart-external-link{color:var(--text)}
.dx-acts .detail-remove-btn{flex:none;padding:7px 10px;color:var(--sell);background:transparent;border:1px solid var(--border)}
.dx .dca-log-row{margin-top:0;padding-top:0;border-top:0}
.dx .dca-log-btn,.dx .dca-log-clear-btn{padding:4px 10px}
.dx .chart-container{margin-top:0}
.activity-log-container{background:var(--panel)}

/* ===== Android-style coin popup: bottom sheet on phones, centred dialog on wide screens ===== */
html.cp-locked, body.cp-locked{overflow:hidden}
.cp-overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,5,9,0);visibility:hidden;pointer-events:none;overscroll-behavior:contain;transition:background .22s ease,visibility 0s linear .26s}
.cp-overlay.open{background:rgba(2,5,9,.64);visibility:visible;pointer-events:auto;transition:background .22s ease,visibility 0s}
.cp-sheet{--vc:var(--muted-2);position:relative;width:100%;max-width:620px;max-height:90vh;max-height:min(92dvh,calc(100dvh - env(safe-area-inset-top,0px) - 24px));display:flex;flex-direction:column;overflow:hidden;background:var(--panel-2);border:1px solid var(--border);border-bottom:0;border-radius:22px 22px 0 0;box-shadow:0 -14px 44px rgba(0,0,0,.55);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom,0px);outline:none;will-change:transform}
.cp-overlay.open .cp-sheet{transform:translateY(0)}
.cp-grab{flex:none;width:34px;height:4px;border-radius:2px;background:rgba(255,255,255,.24);margin:7px auto 2px;touch-action:none}
.cp-header{flex:none;display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;padding:2px 10px 8px 14px;border-bottom:1px solid var(--border);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--vc) 60%,transparent);touch-action:none}
.cp-titles{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:7px}
.cp-sym{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.2;white-space:nowrap}
.cp-name{font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.cp-navs{display:flex;align-items:center;gap:0;flex:none}
.cp-count{min-width:34px;text-align:center;font-family:var(--font-mono);font-size:10px;color:var(--muted)}
.cp-icon{flex:none;width:36px;height:36px;padding:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--border)}
.cp-icon svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cp-icon:active:not(:disabled){background:rgba(255,255,255,.14)}
.cp-price{flex:1 0 100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:1px 10px;line-height:1.25}
.cp-price .px-main{display:inline;font-size:15px;font-weight:700}
.cp-price .price-change-24h{display:inline;margin:0 0 0 7px;font-size:10.5px}
.cp-target{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--muted);white-space:nowrap}
.cp-target b{color:var(--text);font-weight:600}
.cp-target .up{color:var(--buy);font-weight:700}
.cp-target .dn{color:var(--sell);font-weight:700}

/* ===== In-app dialog (DCA entry + confirmations) — replaces browser prompt()/confirm() ===== */

<body>
<div class="app">

<header>
  <div class="brand">
    <h1>Portfolio Tracker</h1>
  </div>
  <div class="status-panel">
    <div id="currentStatus" class="pill info"><span class="dot"></span>Initializing…</div>
  </div>
</header>

<div class="toolbar" id="toolbar">
  <input type="text" id="symbolInput" class="symbol-input" placeholder="Type a coin symbol or name to add it…" disabled/>
  <button id="addBtn" disabled>Add coin</button>
  <div id="suggestBox"></div>
</div>

<div class="table-scroll-wrapper">
<table aria-live="polite" id="portfolioTable">
<colgroup><col style="width:14%"><col style="width:20%"><col style="width:18%"><col style="width:22%"><col style="width:26%"></colgroup>
<thead>
<tr>
<th>Coin</th>
<th class="numeric sortable" id="priceSortHeader">Price ₹<span class="sort-arrow" id="priceSortArrow"></span></th>
<th class="numeric">Target ₹</th>
<th class="numeric sortable" id="gainSortHeader">To target<span class="sort-arrow" id="gainSortArrow"></span></th>
<th class="center sortable" id="signalSortHeader">Signal<span class="sort-arrow" id="signalSortArrow"></span></th>
</tr>
</thead>
<tbody id="tableBody">
<tr class="empty-row"><td colspan="5">Loading coin list and prices…</td></tr>
</tbody>
</table>
</div>

<div class="discover-section">
  <button id="discoverBtn">Find candidates not in my list</button>
  <div id="discoverResults"></div>
</div>

</div>

<div id="activityLogContainer" class="activity-log-container">
  <div id="statusLine" class="status-line"><span class="sl-dot"></span><span id="statusLineText">Prices — · TA —</span></div>
</div>

<div id="coinPopupOverlay" class="cp-overlay" aria-hidden="true">
  <div id="coinPopup" class="cp-sheet coin-popup" role="dialog" aria-modal="true" aria-labelledby="cpSym" tabindex="-1">
    <div class="cp-grab" aria-hidden="true"></div>
    <div class="cp-header" id="cpHeader">
      <div class="cp-titles">
        <div class="cp-sym" id="cpSym"></div>
        <div class="cp-name" id="cpName"></div>
      </div>
      <div class="cp-navs">
        <button type="button" class="cp-icon" id="cpPrev" aria-label="Previous coin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
        <span class="cp-count" id="cpCount" aria-live="polite"></span>
        <button type="button" class="cp-icon" id="cpNext" aria-label="Next coin"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
      <button type="button" class="cp-icon" id="cpClose" aria-label="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="cp-price"><span id="cpPx"></span><span class="cp-target" id="cpTarget"></span></div>
    </div>
    <div class="cp-body" id="coinPopupBody"></div>
  </div>
</div>

<div id="dlgOverlay" class="dlg-overlay" aria-hidden="true">
  <div id="dlgCard" class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" tabindex="-1">
    <div class="dlg-head"><div class="dlg-title" id="dlgTitle"></div><div class="dlg-sub" id="dlgSub" hidden></div></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-actions">
      <button type="button" class="dlg-btn dlg-cancel" id="dlgCancel">Cancel</button>
      <button type="button" class="dlg-btn dlg-ok" id="dlgOk">Save</button>
    </div>
  </div>
</div>

<script defer>
(async function () {

const currentStatus   = document.getElementById('currentStatus');
const statusLine      = document.getElementById('statusLine');
const statusLineText  = document.getElementById('statusLineText');
const symbolInput     = document.getElementById('symbolInput');
const addBtn          = document.getElementById('addBtn');
const tableBody       = document.getElementById('tableBody');
const gainHeader      = document.getElementById('gainSortHeader');
const signalHeader    = document.getElementById('signalSortHeader');
const priceHeader     = document.getElementById('priceSortHeader');
const suggestBox      = document.getElementById('suggestBox');
const gainSortArrow   = document.getElementById('gainSortArrow');
const signalSortArrow = document.getElementById('signalSortArrow');
const priceSortArrow  = document.getElementById('priceSortArrow');
const discoverBtn     = document.getElementById('discoverBtn');
const discoverResults = document.getElementById('discoverResults');
const appRoot         = document.querySelector('.app');
const popupOverlay    = document.getElementById('coinPopupOverlay');
const popupSheet      = document.getElementById('coinPopup');
const popupHeader     = document.getElementById('cpHeader');
const popupBody       = document.getElementById('coinPopupBody');
const cpSym           = document.getElementById('cpSym');
const cpName          = document.getElementById('cpName');
const cpCount         = document.getElementById('cpCount');
const cpPx            = document.getElementById('cpPx');
const cpTarget        = document.getElementById('cpTarget');
const cpPrev          = document.getElementById('cpPrev');
const cpNext          = document.getElementById('cpNext');
const cpClose         = document.getElementById('cpClose');
const dlgOverlay      = document.getElementById('dlgOverlay');
const dlgCard         = document.getElementById('dlgCard');
const dlgTitle        = document.getElementById('dlgTitle');
const dlgSub          = document.getElementById('dlgSub');
const dlgBody         = document.getElementById('dlgBody');
const dlgCancel       = document.getElementById('dlgCancel');
const dlgOk           = document.getElementById('dlgOk');

const API_KEY = 'CG-G1MtEv33nwCgRyvF4YNsKyDs';
const API_BASE = 'https://api.coingecko.com/api/v3';

const PRICE_REFRESH_INTERVAL = 2 * 60000;
const API_RECHECK_INTERVAL   = 0.5 * 60000;
const ACTIVITY_TIMEOUT       = 6000;
const ACTIVITY_TIMEOUT_ALERT = 12000;
const MAX_IDS_PER_PRICE_CALL = 90;

const CACHE_KEY      = 'shortfall_coin_list';
const CACHE_DURATION = 7 * 24 * 60 * 60 * 1000;

const TARGET_PROXIMITY_PCT = 3;


const LIQUIDITY_DEAD_RATIO = 0.0005;
const ABSOLUTE_DEAD_VOLUME = 100000;
const MICROCAP_FLOOR = 2000000;
const RANK_CAUTION = 500;

const DCA_EXTREME_PCT = -85;
const DCA_DEEP_PCT = -70;
const DCA_MODERATE_PCT = -40;
const DCA_DIP_WINDOW_DAYS = 90;
const DCA_DIP_NEAR_PCT = 3; // fallback only, used before any TA history is loaded — see nearLowThresholdPct
const DCA_VOL_LOOKBACK_DAYS = 20; // used to scale the gap gate to each coin's own volatility
const DCA_GAP_MULT = 3.0;
const DCA_GAP_FLOOR_PCT = 5;
const DCA_GAP_CEIL_PCT = 12;
const REL_STRENGTH_WINDOW_DAYS = 14;
const EMA_TREND_FAST_SHORT = 20, EMA_TREND_FAST_LONG = 50;
const REL_STRENGTH_SCALE = 3;
const REL_STRENGTH_MIN_BONUS = -10;
const REL_STRENGTH_MAX_BONUS = 8;
const DCA_WATCH_PCT = -20;
// Entry-depth reference: drawdown from the trailing 365d high. ATH stays as the coarse quality/
// discount filter, but for old coins it's years stale (e.g. -98% for everything from the last
// cycle) and can't say whether there's a real, recent pullback to buy. Tiers are volatility-scaled
// like the ATH ones; only 'moderate' gates WAIT vs HOLD, the others just grade the strength.
const YEAR_HIGH_DAYS = 365;
const DCA_YEAR_EXTREME_PCT = -60;
const DCA_YEAR_DEEP_PCT = -45;
const DCA_YEAR_MODERATE_PCT = -30;
const YEAR_TIER_ABS_FLOOR_PCT = -80;
const YEAR_TIER_ABS_CEIL_PCT = -10;

const CRASH_7D_PCT = -15;

// Fixed % bands assume every coin oscillates the same amount, which isn't true — a calm coin can
// sit within a tight range of its low for days, while a choppy one is rarely within a wide band
// without already reversing; same story for how deep a "normal" vs "extreme" ATH drawdown is.
// Both are instead scaled by each coin's own trailing daily-move average (DCA_VOL_LOOKBACK_DAYS),
// relative to VOL_SCALE_REF_PCT — a rough large-cap daily-swing baseline the DCA_* constants above
// were originally calibrated against — clamped so an illiquid/outlier reading can't blow them out.
const VOL_SCALE_REF_PCT = 3;
const VOL_SCALE_MIN = 0.6;
const VOL_SCALE_MAX = 1.8;
const ATH_TIER_ABS_FLOOR_PCT = -95; // beyond this a coin's likely dead/delisted, not "still watching"
const ATH_TIER_ABS_CEIL_PCT = -12;  // watch tier shouldn't fire this close to ATH even for a very calm coin
// Reference windows for RSI-qualified extremes. A low/high only counts as support/resistance if RSI on the
// day it was set met THIS coin's own oversold/overbought threshold; otherwise a longer window is tried.
// classifyHolding does this with the sliders' own RSI; computeTaFromCloses.refLow (close-based) feeds
// the Discover scan, which has no hourly wick data.
const REF_LOW_WINDOWS = [90, 180, 365];
const REF_LOW_RSI_MARGIN = 0; // Discover scan only: strict, no tolerance
const DCA_NEAR_LOW_MULT = 1.0;
const DCA_NEAR_LOW_FLOOR_PCT = 1.5;
const DCA_NEAR_LOW_CEIL_PCT = 8;

const TA_ALIGN_BUFFER_MS = 15 * 60000;
const TA_HISTORY_DAYS = 365;
const TA_FETCH_DELAY_MS = 1500;
const TA_MAX_DATA_AGE_MS = 3 * 24 * 3600000; // daily history must end within 3 days of now

const RSI_PERIOD = 14;
const RSI_OVERSOLD = 30; // fallback only, used when a coin lacks enough RSI history for its own threshold
const RSI_OVERBOUGHT = 85; // fallback only — flat cutoff before a coin has enough RSI history for its own threshold
const ATL_PROXIMITY_PCT = 10;
// Not every coin's RSI oscillates through the same range — low-volatility coins (often BTC
// itself) can bottom at RSI 35-40 and never print sub-30, while high-beta alts blow through 20.
// A single fixed cutoff misses the first group's real bottoms and is loose for the second. So
// "oversold" is instead defined per coin: the ~15th percentile of its OWN RSI history (i.e. where
// this specific coin's RSI has actually spent time before, historically, near past bottoms).
const RSI_OVERSOLD_PERCENTILE = 10;   // tightened from 15: capital for adds is limited, so only extreme oversold qualifies
const RSI_OVERSOLD_MIN_SAMPLES = 60; // need a reasonable amount of RSI history before trusting a per-coin threshold
const RSI_OVERSOLD_FLOOR = 20; // sanity bounds so thin/erratic history can't produce a pointlessly strict or loose threshold
const RSI_OVERSOLD_CEIL = 35;        // tightened from 45: 45 is near-neutral, not oversold
// Mirrors the oversold logic above for the top side, but deliberately stricter: this is meant to
// flag only genuinely extreme, blow-off-top conditions worth swing-selling into — not just "a bit
// hot" — so it clamps to a much narrower, higher band (80-92) than the oversold side's 20-45, and
// looks at each coin's own 97th percentile rather than its 85th.
const RSI_OVERBOUGHT_PERCENTILE = 97;
const RSI_OVERBOUGHT_MIN_SAMPLES = 60;
const RSI_OVERBOUGHT_FLOOR = 80;
const RSI_OVERBOUGHT_CEIL = 92;

function percentileOf(sortedAsc, pct) {
  if (!sortedAsc || !sortedAsc.length) return null;
  const idx = Math.floor((pct / 100) * (sortedAsc.length - 1));
  return sortedAsc[idx];
}

// Discover: scans coins NOT already in the portfolio for the same ACCUMULATE conditions.
// Two-stage to stay within CoinGecko free-tier limits: stage 1 is one cheap /coins/markets call
// across DISCOVER_TOP_N by market cap, prefiltered on ath_change_percentage (already in that
// response, no extra calls) down to a short list; only that short list gets the expensive
// per-coin daily-history fetch (stage 2, same fetchTaHistory used for the portfolio), capped at
// DISCOVER_MAX_TA_FETCHES so an on-demand scan can't trigger 100+ sequential history calls.
const DISCOVER_TOP_N = 150;
const DISCOVER_MAX_TA_FETCHES = 25;

const EMA_TREND_LONG = 200;

const TA_LOGIC_VERSION = 22; // 22: add/swing gates use an RSI-qualified low/high (90→180→365d); earlier: ACCUMULATE RSI tightened (10th pct, ceiling 35) + last closed-day RSI must be oversold; overbought band 80-92 (97th pct)
const TA_FETCH_VERSION = 7; // bumped: 90d extremes now from hourly data (exact window) + in-window OHLC wicks; 365d extremes from OHLC wicks

let saved             = JSON.parse(localStorage.getItem('shortfall_portfolio') || '[]');
let pricesCache       = JSON.parse(localStorage.getItem('shortfall_prices') || '{}');
let marketDataCache   = JSON.parse(localStorage.getItem('shortfall_market_data') || '{}');
let holdingSignalCache = JSON.parse(localStorage.getItem('shortfall_holding_signals') || '{}');
let dcaLogCache = JSON.parse(localStorage.getItem('shortfall_dca_log') || '{}');
const DCA_HISTORY_MAX = 50; // log entries kept per coin (the newest-dated one is the gap-check anchor)
let taCache            = JSON.parse(localStorage.getItem('shortfall_ta_data') || '{}');
let dayCandleCache     = JSON.parse(localStorage.getItem('shortfall_day_candle') || '{}');

let coinList = [];
let symbolIndex = {};
let portfolioMap = {};

let expandedRowId = null;   // id of the coin shown in the popup (null = popup closed)
let coinPopupOpen = false;
let popupShownId = null;
let popupLastHtml = '';
let popupCloseTimer = null;
let popupLastFocus = null;
let popupBackdropDown = false;
let popupScrollLocked = false;
let popupPrevPadRight = '';
let dlgOpen = false, dlgDone = null, dlgValidate = null, dlgLastFocus = null, dlgBackdropDown = false, dlgCloseTimer = null;
let dlgCtx = { cur: null, today: '', yest: '' };
let refreshPriceTimer = null;
let recheckTimer = null;
let coinListLoaded = false;

let lastPriceTime = parseInt(localStorage.getItem('shortfall_prices_time') || '0', 10);
let lastTaTime     = parseInt(localStorage.getItem('shortfall_ta_time') || '0', 10);
let taFetchInFlight = false;

let currentSortColumn = 'gain';
let sortDir = 'desc';

const formatTime = (ts) => !ts ? 'N/A' : new Date(ts).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatDateTime = (ts) => !ts ? 'N/A' : new Date(ts).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatLogTime = () => new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
const formatINR = (n, maxDecimals = 2, compact = false) => {
  if (n == null || isNaN(n)) return '—';
  const abs = Math.abs(n);
  if (compact) {
    if (abs >= 1e7) return '₹' + (n / 1e7).toFixed(2) + 'Cr';
    if (abs >= 1e5) return '₹' + (n / 1e5).toFixed(2) + 'L';
  }
  return '₹' + Number(n).toLocaleString('en-IN', { minimumFractionDigits: maxDecimals, maximumFractionDigits: maxDecimals });
};

const pricePrecisionFor = (price) => {
  const abs = Math.abs(price ?? 0);
  if (abs >= 100) return 2;
  if (abs >= 1) return 4;
  if (abs >= 0.01) return 6;
  return 8;
};

const pctToTarget = (cur, tgt) => {
  if (cur == null || tgt == null || isNaN(cur) || isNaN(tgt) || cur === 0) return null;
  return ((tgt - cur) / cur) * 100;
};
const formatPctShort = (val) => (val == null || isNaN(val)) ? '—' : (Math.abs(val) >= 100 ? `${val > 0 ? '+' : val < 0 ? '−' : ''}${Math.abs(val).toLocaleString('en-IN', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%` : `${val > 0 ? '+' : val < 0 ? '−' : ''}${Math.abs(val).toFixed(1)}%`);
const formatPct = (val) => (val == null || isNaN(val)) ? 'N/A' : `${val > 0 ? '+' : ''}${val.toFixed(2)}%`;

const save                 = () => localStorage.setItem('shortfall_portfolio', JSON.stringify(saved));
